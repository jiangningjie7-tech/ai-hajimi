<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>流光 AI</title>
<style>
:root{--bg-main:#f8fafc;--bg-card:#fff;--text-main:#0f172a;--text-sub:#64748b;--border-color:#f1f5f9;--primary:#1A73E2;--primary-light:#e8f0fe;--chat-bg:#f3f3f3;--user-bubble:#95EC69;--user-bubble-normal:#e2e8f0;--ai-bubble:#fff;--header-bg:#ededed;--base-font-size:17px}
body.dark-theme{--bg-main:#0f172a;--bg-card:#1e293b;--text-main:#f8fafc;--text-sub:#94a3b8;--border-color:#334155;--primary:#3b82f6;--primary-light:#1e293b;--chat-bg:#111827;--user-bubble:#059669;--user-bubble-normal:#334155;--ai-bubble:#1f2937;--header-bg:#1f2937}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none;overscroll-behavior-x:none;touch-action:manipulation}
body{background-color:var(--bg-main);height:100dvh;display:flex;justify-content:center;align-items:center;color:var(--text-main);transition:background-color .3s;overflow:hidden;font-size:var(--base-font-size)}
#app{width:100%;max-width:100%;height:100dvh;background:var(--bg-card);display:flex;flex-direction:column;position:relative;overflow:hidden;transition:max-width .3s ease;box-shadow:0 0 20px rgba(0,0,0,.08)}
#splash-screen{position:fixed;inset:0;z-index:9999;background:#fff;display:flex;justify-content:center;align-items:center;transition:opacity .5s,visibility .5s}
#splash-screen.fade-out{opacity:0;visibility:hidden;pointer-events:none}
#splash-screen img{width:100%;height:100%;object-fit:cover}
#login-screen{position:absolute;inset:0;background:var(--bg-card);z-index:200;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;gap:18px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:max(30px,env(safe-area-inset-top));padding-bottom:max(30px,env(safe-area-inset-bottom))}
#login-screen h2{text-align:center;color:var(--primary);margin-bottom:10px;font-size:26px}
.login-toggle{display:flex;justify-content:space-around;margin-bottom:10px;border-bottom:1px solid var(--border-color);padding-bottom:10px}
.login-toggle span{cursor:pointer;color:var(--text-sub);font-weight:600}
.login-toggle span.active{color:var(--primary);border-bottom:2px solid var(--primary)}
main{flex:1;min-height:0;overflow:hidden;position:relative}
.tab-content{width:100%;height:100%;display:none;flex-direction:column;overflow-y:auto;opacity:0;transform:scale(.95) translateY(12px);filter:blur(10px);transition:all .35s cubic-bezier(.32,.72,0,1);overscroll-behavior-y:contain}
.tab-content.active{display:flex;opacity:1;transform:scale(1) translateY(0);filter:blur(0)}
.chat-item{padding:22px 24px;display:flex;align-items:center;gap:18px;border-bottom:1px solid var(--border-color);cursor:pointer;user-select:none;position:relative}
.chat-item:active{background:var(--border-color)}
.avatar{width:66px;height:66px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:calc(var(--base-font-size) + 8px);flex-shrink:0;overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover}
.msg-avatar{width:58px!important;height:58px!important;font-size:22px!important}
.chat-info{flex:1;min-width:0}
.chat-title{display:flex;justify-content:space-between;margin-bottom:8px}
.chat-name{font-weight:600;font-size:calc(var(--base-font-size) + 4px);color:var(--text-main);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pinned-tag{font-size:calc(var(--base-font-size) - 3px);background:var(--primary);color:#fff;padding:3px 8px;border-radius:6px}
.system-tag{font-size:calc(var(--base-font-size) - 3px);background:#10b981;color:#fff;padding:3px 8px;border-radius:6px}
.online-tag{font-size:calc(var(--base-font-size) - 3px);background:#f59e0b;color:#fff;padding:3px 8px;border-radius:6px}
.cloud-tag{font-size:calc(var(--base-font-size) - 3px);background:#8b5cf6;color:#fff;padding:3px 8px;border-radius:6px}
.chat-last{font-size:calc(var(--base-font-size) + 1px);color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.form-group{padding:24px;display:flex;flex-direction:column;gap:20px}
.form-group label{font-size:calc(var(--base-font-size) + 2px);font-weight:600;color:var(--text-sub)}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:16px 18px;border:1px solid var(--border-color);border-radius:14px;font-size:calc(var(--base-font-size) + 2px);outline:none;background:var(--bg-card);color:var(--text-main)}
.form-group textarea{height:110px;resize:none}
.row-group{display:flex;gap:14px}
.row-group > div{flex:1}
.checkbox-group{display:flex;gap:14px;align-items:center;padding:18px;background:var(--primary-light);border-radius:14px}
.checkbox-group input{width:22px!important;height:22px;flex-shrink:0;margin:0;padding:0}
.btn{background:var(--primary);color:#fff;padding:18px;border:none;border-radius:14px;font-weight:600;font-size:calc(var(--base-font-size) + 2px);cursor:pointer;text-align:center}
.btn-secondary{background:var(--primary-light);color:var(--primary)}
.btn-small{padding:8px 14px;font-size:14px;border-radius:10px}
.discover-add-btn{background:var(--primary);color:#fff;border:none;padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0}
.discover-add-btn.added{background:#10b981;color:#fff}
.discover-add-btn.own{background:var(--text-sub);color:#fff;cursor:default}
#chat-screen{position:absolute;inset:0;background:var(--bg-card);z-index:50;display:flex;flex-direction:column;opacity:0;transform:translateY(100%);pointer-events:none;transition:transform .35s cubic-bezier(.16,1,.3,1),opacity .3s ease;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);padding-bottom:env(safe-area-inset-bottom,0px)}
#chat-screen.active{opacity:1;transform:translateY(0);pointer-events:auto}
.chat-header{height:76px;border-bottom:1px solid var(--border-color);display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:var(--header-bg);flex-shrink:0}
.back-btn{background:none;border:none;color:var(--primary);font-size:calc(var(--base-font-size) + 4px);font-weight:600;cursor:pointer}
.chat-body-wrapper{flex:1;display:flex;position:relative;overflow:hidden}
.messages-list{flex:1;overflow-y:auto;padding:24px 20px;display:flex;flex-direction:column;gap:18px;background:var(--chat-bg);overscroll-behavior-y:contain}
.fast-scroll-bar{width:18px;background:rgba(0,0,0,.03);position:relative;cursor:pointer;touch-action:none;user-select:none}
.fast-scroll-thumb{width:100%;height:52px;background:var(--primary);opacity:.6;border-radius:20px;position:absolute;top:0;left:0}
.msg-row{display:flex;gap:14px;user-select:none;align-items:flex-start}
.msg-row.user{flex-direction:row-reverse}
.bubble{max-width:80%;padding:16px 20px;border-radius:22px;font-size:calc(var(--base-font-size) + 2px);line-height:1.5;word-break:break-all;white-space:pre-wrap}
.msg-row.user .bubble.online-mode{background:var(--user-bubble);color:#000}
.msg-row.user .bubble.normal-mode{background:var(--user-bubble-normal);color:var(--text-main)}
.msg-row.ai .bubble{background:var(--ai-bubble);color:var(--text-main);border:1px solid var(--border-color)}
.sticker-bubble{max-width:180px;padding:0;background:transparent!important;border:none!important}
.sticker-bubble img{width:100%;max-height:180px;object-fit:contain;border-radius:14px;display:block}
.image-bubble{max-width:220px;padding:4px;background:transparent!important;border:none!important}
.image-bubble img{width:100%;max-height:250px;object-fit:cover;border-radius:14px;display:block;cursor:pointer}
.system-notice{text-align:center;font-size:calc(var(--base-font-size) - 1px);color:var(--text-sub);margin:10px 0}
.chat-footer-wrapper{display:flex;flex-direction:column;border-top:1px solid var(--border-color);background:var(--bg-card);flex-shrink:0;width:100%}
.image-preview-bar{display:none;padding:8px 14px;align-items:center;gap:10px;background:var(--primary-light)}
.image-preview-bar img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.image-preview-bar .remove-img-btn{color:#ef4444;font-weight:bold;cursor:pointer;font-size:14px}
.chat-footer{padding:10px 14px;display:flex;align-items:center;gap:8px;width:100%}
.chat-footer input{flex:1;min-width:0;padding:12px 16px;border-radius:24px;border:1px solid var(--border-color);outline:none;font-size:calc(var(--base-font-size) + 1px);background:var(--bg-card);color:var(--text-main)}
.chat-footer button{flex-shrink:0;padding:12px 16px;border-radius:24px;border:none;background:var(--primary);color:#fff;font-size:calc(var(--base-font-size));font-weight:600;cursor:pointer;white-space:nowrap}
.chat-footer .btn-upload-img{background:var(--primary-light);color:var(--primary);padding:12px 14px;font-size:18px}
.chat-footer .btn-continue{background:var(--primary-light);color:var(--primary);display:none}
nav{height:calc(82px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);border-top:1px solid var(--border-color);display:flex;justify-content:space-around;align-items:center;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:20;flex-shrink:0}
body.dark-theme nav{background:rgba(30,41,59,.85)}
nav.nav-hidden{display:none!important}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:calc(var(--base-font-size) - 1px);color:var(--text-sub);cursor:pointer;flex:1;font-weight:600;transition:transform .2s ease}
.nav-item:active{transform:scale(.92)}
.nav-item.active{color:var(--primary);font-weight:bold}
.nav-dot{width:10px;height:10px;border-radius:50%;background:var(--text-sub);transition:all .2s ease}
.nav-item.active .nav-dot{background:var(--primary);transform:scale(1.3)}
.popup-menu{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;display:none;justify-content:center;align-items:center;backdrop-filter:blur(2px)}
.popup-content{background:var(--bg-card);border-radius:16px;width:320px;overflow:hidden;box-shadow:0 10px 25px rgba(0,0,0,.2);max-height:80vh;display:flex;flex-direction:column}
.popup-item{padding:18px 22px;font-size:calc(var(--base-font-size) + 2px);border-bottom:1px solid var(--border-color);cursor:pointer;color:var(--text-main)}
.popup-item:active{background:var(--border-color)}
.sponsor-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:130;display:none;justify-content:center;align-items:center;backdrop-filter:blur(4px)}
.sponsor-box{background:var(--bg-card);border-radius:20px;width:320px;padding:24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;gap:14px}
.sponsor-box img{width:100%;max-height:300px;object-fit:contain;border-radius:12px;border:1px solid var(--border-color)}
.cropper-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:120;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.cropper-container{width:320px;height:320px;background:#000;position:relative;overflow:hidden;border:2px solid var(--primary);border-radius:16px;touch-action:none}
.cropper-container canvas{width:100%;height:100%;cursor:move}
.dev-badge{text-align:center;padding:16px 0 8px;font-size:calc(var(--base-font-size) - 1px);color:var(--text-sub);font-weight:600;letter-spacing:.5px}
.usage-info-box{background:var(--primary-light);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--text-sub);display:flex;flex-direction:column;gap:6px;margin-top:-8px}
.usage-info-box span.num{color:var(--primary);font-weight:bold}
.empty-tip{text-align:center;padding:60px 24px;color:var(--text-sub);font-size:16px;line-height:1.6}
.cloud-status{font-size:12px;padding:4px 10px;border-radius:8px;display:inline-block}
.cloud-status.online{background:#dcfce7;color:#166534}
.cloud-status.offline{background:#fee2e2;color:#991b1b}
</style>
</head>
<body>
<div id="splash-screen"><img src="qidong.png" alt="" onerror="this.style.display='none'"></div>
<div id="app">
  <div id="login-screen">
    <h2>流光 AI 登录</h2>
    <div class="login-toggle">
      <span id="tab-btn-user" class="active" onclick="switchLoginMode('user')">用户登录</span>
      <span id="tab-btn-admin" onclick="switchLoginMode('admin')">管理员通道</span>
    </div>
    <div id="user-login-form" class="form-group" style="padding:0;">
      <input type="text" id="l-username" placeholder="请输入用户名">
      <input type="password" id="l-password" placeholder="请输入密码">
      <input type="password" id="l-code" placeholder="请输入邀请码">
      <button class="btn" onclick="handleUserLogin()">登录 / 注册</button>
    </div>
    <div id="admin-login-form" class="form-group" style="padding:0;display:none;">
      <input type="password" id="l-admin-pass" placeholder="请输入管理员密码">
      <button class="btn" onclick="handleAdminLogin()">管理员一键进入</button>
    </div>
  </div>

  <main>
    <div id="tab-chats" class="tab-content active"><div id="chat-list-container"></div></div>

    <div id="tab-hall" class="tab-content"><div id="hall-list-container" class="form-group"></div></div>

    <div id="tab-discover" class="tab-content">
      <div class="form-group" style="gap:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:15px;color:var(--text-sub);">🌐 全站公开角色 · 一键添加到大厅</span>
        </div>
        <div id="discover-list-container"></div>
      </div>
    </div>

    <div id="tab-create" class="tab-content">
      <div class="form-group">
        <input type="hidden" id="c-edit-id">
        <label>角色头像</label>
        <div style="display:flex;align-items:center;gap:16px;">
          <div class="avatar" id="c-avatar-preview">AI</div>
          <button class="btn" style="padding:12px 20px;font-size:16px;" onclick="triggerCrop('char')">选择并裁剪</button>
        </div>
        <div class="row-group">
          <div><label>角色名字</label><input type="text" id="c-name" placeholder="如：林苏"></div>
          <div><label>用户名字</label><input type="text" id="c-user-name" placeholder="如：小明"></div>
        </div>
        <div class="row-group">
          <div><label>AI 性别</label><select id="c-gender"><option value="女">女</option><option value="男">男</option><option value="保密">保密</option></select></div>
          <div><label>用户性别</label><select id="c-user-gender"><option value="男">男</option><option value="女">女</option><option value="保密">保密</option></select></div>
        </div>
        <label>角色描述</label><input type="text" id="c-desc" placeholder="简短介绍">
        <label>详细人设</label><textarea id="c-persona" placeholder="性格特点、说话语气、习惯等"></textarea>
        <label>人物关系</label><input type="text" id="c-relation" placeholder="如：青梅竹马、同事、师徒">
        <label>世界观</label><input type="text" id="c-worldview" placeholder="如：赛博朋克、现代都市、高魔幻想">
        <div class="checkbox-group">
          <input type="checkbox" id="c-online" checked>
          <span style="font-size:15px;font-weight:600;">模拟线上聊天模式</span>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="c-publish">
          <span style="font-size:15px;font-weight:600;">发布到【发现】页（所有人可见并可使用）</span>
        </div>
        <button class="btn" onclick="saveCharacter()" id="btn-save-char">创建角色</button>
      </div>
    </div>

    <div id="tab-settings" class="tab-content">
      <div class="form-group">
        <label>用户个人头像</label>
        <div style="display:flex;align-items:center;gap:16px;">
          <div class="avatar" id="user-avatar-preview">我</div>
          <button class="btn" style="padding:12px 20px;font-size:16px;" onclick="triggerCrop('user')">上传并裁剪</button>
        </div>
        <label>AI 模型选择</label>
        <select id="s-selected-model" onchange="onModelChange(this.value)">
          <option value="advanced">高级模型（50次/天）</option>
          <option value="glm-4-flash" selected>普通模型（100次/天）</option>
        </select>
        <div class="usage-info-box">
          <div>普通模型今日剩余：<span id="normal-remaining-count" class="num">100</span> / 100 次</div>
          <div>高级模型今日剩余：<span id="advanced-remaining-count" class="num">50</span> / 50 次</div>
          <div>图片识别今日剩余：<span id="vision-remaining-count" class="num">30</span> / 30 次</div>
        </div>
        <div class="row-group">
          <div><label>界面模式</label><select id="s-theme" onchange="toggleTheme(this.value)"><option value="light">白天模式</option><option value="dark">夜晚模式</option></select></div>
          <div><label>字体大小</label><select id="s-fontsize" onchange="adjustFontSize(this.value)"><option value="15px">小号</option><option value="17px" selected>标准</option><option value="19px">大号</option><option value="21px">特大</option></select></div>
        </div>
        <label>屏幕适配比例</label>
        <select id="s-width" onchange="adjustWidth(this.value)">
          <option value="100%" selected>全屏 (100%)</option>
          <option value="calc(100vh * (9 / 19.5))">全面屏 (9:19.5)</option>
          <option value="calc(100vh * (9 / 16))">标准手机 (9:16)</option>
          <option value="calc(100vh * (9 / 21))">带状窄屏 (9:21)</option>
          <option value="calc(100vh * (3 / 4))">平板 (3:4)</option>
        </select>
        <button class="btn" onclick="saveSettings()">保存全套设置</button>
        <button class="btn btn-secondary" style="background:#e0e7ff;color:#3730a3;" onclick="resetAllUsageCountWithPassword()">重置所有模型使用次数</button>
        <hr style="border:none;border-top:1px solid var(--border-color);margin:10px 0;">
        <button class="btn btn-secondary" style="background:#fef3c7;color:#d97706;" onclick="showSponsorOptions()">求赞助 💖</button>
        <hr style="border:none;border-top:1px solid var(--border-color);margin:10px 0;">
        <label>数据备份与恢复</label>
        <div class="row-group">
          <button class="btn btn-secondary" onclick="exportData()">导出数据</button>
          <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">恢复数据</button>
        </div>
        <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">
        <button class="btn btn-secondary" style="background:#fee2e2;color:#ef4444;" onclick="logout()">退出当前账号</button>
        <div class="dev-badge">开发者：Jiang09G</div>
      </div>
    </div>

    <div id="chat-screen">
      <div class="chat-header">
        <button class="back-btn" onclick="closeChat()">返回</button>
        <div style="text-align:center;">
          <div id="chat-target-name" style="font-weight:bold;font-size:20px;">-</div>
          <div id="chat-typing-status" style="font-size:14px;color:var(--text-sub);display:none;">正在思考...</div>
        </div>
        <div style="width:40px;"></div>
      </div>
      <div class="chat-body-wrapper">
        <div class="messages-list" id="msg-container"></div>
        <div class="fast-scroll-bar" id="scroll-bar"><div class="fast-scroll-thumb" id="scroll-thumb"></div></div>
      </div>
      <div class="chat-footer-wrapper">
        <div class="image-preview-bar" id="img-preview-bar">
          <img id="img-preview-thumb" src="" alt="">
          <span style="font-size:13px;color:var(--text-sub);">已选择图片</span>
          <span class="remove-img-btn" onclick="clearSelectedImage()">✕ 取消</span>
        </div>
        <div class="chat-footer">
          <button class="btn-upload-img" onclick="triggerChatImageSelect()">📷</button>
          <input type="file" id="chat-img-input" accept="image/*" style="display:none;" onchange="handleChatImageSelect(event)">
          <input type="text" id="chat-input" placeholder="发送消息..." onkeyup="if(event.key==='Enter') sendMsg()">
          <button class="btn-continue" id="btn-continue" onclick="sendContinue()">继续</button>
          <button onclick="sendMsg()">发送</button>
        </div>
      </div>
    </div>
  </main>

  <nav id="main-nav">
    <div class="nav-item active" onclick="switchTab('chats', this)"><div class="nav-dot"></div>会话</div>
    <div class="nav-item" onclick="switchTab('hall', this)"><div class="nav-dot"></div>大厅</div>
    <div class="nav-item" onclick="switchTab('discover', this)"><div class="nav-dot"></div>发现</div>
    <div class="nav-item" onclick="switchTab('create', this)"><div class="nav-dot"></div>创建</div>
    <div class="nav-item" onclick="switchTab('settings', this)"><div class="nav-dot"></div>设置</div>
  </nav>

  <div class="popup-menu" id="popup-menu" onclick="closePopup()"><div class="popup-content" id="popup-items" onclick="event.stopPropagation()"></div></div>
  <div class="sponsor-modal" id="sponsor-modal" onclick="closeSponsorModal()">
    <div class="sponsor-box" onclick="event.stopPropagation()">
      <h3 style="color:var(--primary);font-size:20px;">感谢支持！</h3>
      <img id="sponsor-img" src="./zanzhu.png" alt="赞助二维码" onerror="this.style.display='none'">
      <div style="font-size:15px;color:var(--text-sub);line-height:1.4;">非常感谢你的善意与支持，祝你使用愉快！</div>
      <button class="btn" style="padding:10px 24px;font-size:16px;" onclick="closeSponsorModal()">关闭</button>

<script>
/* ============ CloudBase HTTP 云函数地址 ============ */
const AI_CHAT_URL = 'https://liuguangai-d2gy31w0qa5328962-1492557480.ap-shanghai.app.tcloudbase.com/chat';

/* ============ 工具函数 ============ */
window.addEventListener('load', () => {

function removeEmoji(str){
  if (!str) return '';
  return str.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{2300}-\u{23FF}]/gu, '');
}
function escapeHtml(str){
  if (!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

const lockedModelConfigs = {
  'glm-4-flash': { endpoint: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4-flash', key: '' },
  'glm-4v-flash': { endpoint: 'https://open.bigmodel.cn/api/paas/v4/chat/completions', model: 'glm-4v-flash', key: '' },

};

}

let userAvatarData = localStorage.getItem('userAvatarData') || '';
let tempCharAvatarData = '';
let currentCropTarget = '';
let pendingChatImageBase64 = '';
let activeChat = null;
let pendingTimer = null;
let touchTimer = null;
let discoverCache = [];

/* ============ 默认角色（只保留系统 AI） ============ */
const defaultCharacters = [
  {

  }
];

/* ============ 角色数据初始化 ============ */
let characters = JSON.parse(localStorage.getItem('characters')) || [];
characters = characters.filter(c => c.id === 'system_official_ai' || !c.isSystem);
if (!characters.some(c => c.id === 'system_official_ai')) {

let chats = JSON.parse(localStorage.getItem('chats')) || [];

if (!chats.some(c => c.charId === 'system_official_ai')) {

let apiConfig = JSON.parse(localStorage.getItem('apiConfig')) || { selectedModel: 'glm-4-flash', fontSize: '17px', screenWidth: '100%', theme: 'light' };

/* ============ 本地存储 ============ */
function saveStorage(){
  localStorage.setItem('characters', JSON.stringify(characters));
  localStorage.setItem('chats', JSON.stringify(chats));
  localStorage.setItem('userAvatarData', userAvatarData);
  localStorage.setItem('apiConfig', JSON.stringify(apiConfig));

/* ============ 使用次数 ============ */
function getTodayString(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}
function getModelUsageData(){
  const today = getTodayString();
  let data = JSON.parse(localStorage.getItem('allModelUsageData') || '{}');
  if (data.date !== today) {
    data = { date: today, normal: 0, advanced: 0, vision: 0 };
    localStorage.setItem('allModelUsageData', JSON.stringify(data));
  }
  return data;
}
function saveModelUsageData(data){
  localStorage.setItem('allModelUsageData', JSON.stringify(data));
  updateUsageUI();
}
function updateUsageUI(){
  const usage = getModelUsageData();
  const elN = document.getElementById('normal-remaining-count');
  const elA = document.getElementById('advanced-remaining-count');
  const elV = document.getElementById('vision-remaining-count');
  if (elN) elN.innerText = Math.max(0, LIMITS.normal - (usage.normal || 0));
  if (elA) elA.innerText = Math.max(0, LIMITS.advanced - (usage.advanced || 0));
  if (elV) elV.innerText = Math.max(0, LIMITS.vision - (usage.vision || 0));
}

/* ============ 登录 ============ */
function switchLoginMode(mode){
  if (mode === 'user') {
    document.getElementById('tab-btn-user').classList.add('active');
    document.getElementById('tab-btn-admin').classList.remove('active');

    document.getElementById('user-login-form').style.display = 'none';

}
function handleUserLogin(){

function handleAdminLogin(){

    localStorage.setItem('isLoggedIn', 'true');
    document.getElementById('login-screen').style.display = 'none';
  } else alert('管理员密码错误！');

function logout(){
  localStorage.removeItem('isLoggedIn');
  location.reload();
}
function checkAuth(){
  const isLoggedIn = localStorage.getItem('isLoggedIn');
  document.getElementById('login-screen').style.display = (isLoggedIn === 'true') ? 'none' : 'flex';
}

/* ============ 初始化 ============ */
function init(){
  checkAuth();
  if (userAvatarData) document.getElementById('user-avatar-preview').innerHTML = `<img src="${userAvatarData}">`;
  if (apiConfig.selectedModel) document.getElementById('s-selected-model').value = apiConfig.selectedModel;
  if (apiConfig.fontSize) { document.getElementById('s-fontsize').value = apiConfig.fontSize; adjustFontSize(apiConfig.fontSize); }
  if (apiConfig.screenWidth) { document.getElementById('s-width').value = apiConfig.screenWidth; adjustWidth(apiConfig.screenWidth); }

  updateUsageUI();
  renderChats();
  renderHall();

}

/* ============ Tab 切换 ============ */
function switchTab(tabId, el){
  document.querySelectorAll('.tab-content').forEach(d => d.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(d => d.classList.remove('active'));
  document.getElementById('tab-' + tabId).classList.add('active');
  if (el) el.classList.add('active');
  if (tabId === 'discover') loadDiscoverCharacters();
}

/* ============ 会话列表 ============ */
function renderChats(){
  const container = document.getElementById('chat-list-container');
  const sorted = [...chats].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
  container.innerHTML = sorted.map(c => {
    const validMsgs = c.messages ? c.messages.filter(m => !m.notice) : [];
    const lastMsg = validMsgs.length ? validMsgs[validMsgs.length - 1] : null;
    let lastText = '暂无消息';
    if (lastMsg) {
      if (lastMsg.isImage) lastText = '[图片]';
      else if (lastMsg.isSticker) lastText = '[表情包]';
      else lastText = escapeHtml(lastMsg.text);
    }
    return `
      <div class="chat-item" onclick="openChat('${c.id}')" 
           oncontextmenu="event.preventDefault(); showChatMenu('${c.id}')"
           ontouchstart="startTouchTimer(event, () => showChatMenu('${c.id}'))"
           ontouchend="clearTouchTimer()">
        <div class="avatar">${c.avatar ? `<img src="${c.avatar}">` : c.name[0]}</div>
        <div class="chat-info">
          <div class="chat-title"><span class="chat-name">
            ${c.name}
            ${c.isSystem ? '<span class="system-tag">官方</span>' : ''}
            ${!c.isSystem && c.online ? '<span class="online-tag">线上</span>' : ''}
            ${c.pinned ? '<span class="pinned-tag">置顶</span>' : ''}
          </span></div>
          <div class="chat-last">${lastText}</div>
        </div>
      </div>`;
  }).join('');
}

/* ============ 角色大厅 ============ */
function renderHall(){
  const container = document.getElementById('hall-list-container');
  if (!characters.length) {
    container.innerHTML = '<div class="empty-tip">角色大厅空空如也<br>去「发现」页逛逛，或者「创建」一个角色吧～</div>';
    return;
  }
  container.innerHTML = characters.map(c => `
    <div class="chat-item" style="border:1px solid var(--border-color);border-radius:16px;" 
         onclick="startChatFromHall('${c.id}')"
         oncontextmenu="event.preventDefault(); showHallMenu('${c.id}')"
         ontouchstart="startTouchTimer(event, () => showHallMenu('${c.id}'))"
         ontouchend="clearTouchTimer()">
      <div class="avatar">${c.avatar ? `<img src="${c.avatar}">` : (c.name[0] || '?')}</div>
      <div class="chat-info">
        <div class="chat-name">
          ${escapeHtml(c.name)}
          ${c.isSystem ? '<span class="system-tag">官方</span>' : ''}
          ${c.fromCloud ? '<span class="cloud-tag">来自发现</span>' : ''}
          ${c.online ? '<span class="online-tag">线上</span>' : ''}
        </div>
        <div class="chat-last">${escapeHtml(c.desc) || '无描述'}</div>
      </div>
    </div>
  `).join('');
}

/* ============ 发现页 ============ */
async function loadDiscoverCharacters(){
  const container = document.getElementById('discover-list-container');
  container.innerHTML = '<div class="empty-tip">正在加载...</div>';
  try {
    const resp = await fetch(AI_CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'listChars' })
    });
    const data = await resp.json();
    discoverCache = (data.characters || []).map(c => ({ ...c, _id: c.id }));
    if (!discoverCache.length) {
      container.innerHTML = '<div class="empty-tip">还没有人发布角色<br>快去「创建」一个并勾选发布吧～</div>';
      return;
    }
    container.innerHTML = discoverCache.map(c => {
      const added = characters.some(x => x.cloudId === c.id);
      const btnClass = added ? 'discover-add-btn added' : 'discover-add-btn';
      const btnText = added ? '已添加 ✓' : '添加到大厅';
      return `
        <div class="chat-item" style="border:1px solid var(--border-color);border-radius:16px;">
          <div class="avatar" onclick="previewCloudChar('${c.id}')">${c.avatar ? `<img src="${c.avatar}">` : (c.name && c.name[0] || '?')}</div>
          <div class="chat-info">
            <div class="chat-name">
              ${escapeHtml(c.name || '未命名')}
              ${c.online ? '<span class="online-tag">线上</span>' : ''}
            </div>
            <div class="chat-last">${escapeHtml(c.desc) || '无描述'}</div>
          </div>
          <button class="${btnClass}" ${added ? 'disabled' : ''} onclick="addToHall('${c.id}')">${btnText}</button>
        </div>`;
    }).join('');
  } catch (e) {
    console.error('[发现页] 加载失败', e);
    container.innerHTML = '<div class="empty-tip">加载失败：' + escapeHtml(e.message) + '</div>';
  }
}

function previewCloudChar(cloudId){
  const c = discoverCache.find(x => x.id === cloudId);
  if (!c) return;
  alert(`角色：${c.name}\n作者：${c.userName || '未知'}\n世界观：${c.worldview || '未设置'}\n\n简介：${c.desc || '无'}`);
}

function addToHall(cloudId){
  const cloudChar = discoverCache.find(c => c.id === cloudId);
  if (!cloudChar) return;
  if (characters.some(c => c.cloudId === cloudId)) return alert('该角色已在大厅中');
  const newChar = {
    id: 'char_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    cloudId: cloudId,
    name: cloudChar.name,
    userName: cloudChar.userName || '用户',
    desc: cloudChar.desc || '',
    persona: cloudChar.persona || '',
    relation: cloudChar.relation || '朋友',
    worldview: cloudChar.worldview || '',
    gender: cloudChar.gender || '女',
    userGender: cloudChar.userGender || '男',
    online: !!cloudChar.online,
    avatar: cloudChar.avatar || '',
    isSystem: false,
    fromCloud: true,
    memories: []
  };
  characters.push(newChar);
  saveStorage();
  renderHall();
  loadDiscoverCharacters();
  alert(`已将「${newChar.name}」添加到角色大厅`);
}

/* ============ 长按 / 右键菜单 ============ */
function startTouchTimer(e, cb){ touchTimer = setTimeout(cb, 600); }
function clearTouchTimer(){ if (touchTimer) clearTimeout(touchTimer); }
function closePopup(){ document.getElementById('popup-menu').style.display = 'none'; }

function showChatMenu(chatId){
  const chat = chats.find(c => c.id === chatId);
  if (!chat) return;
  const items = document.getElementById('popup-items');
  let html = `<div class="popup-item" onclick="togglePinChat('${chatId}')">${chat.pinned ? '取消置顶' : '置顶会话'}</div>`;
  html += `<div class="popup-item" onclick="clearChatMessages('${chatId}')">清空聊天记录</div>`;
  html += `<div class="popup-item" onclick="deleteChat('${chatId}')">删除会话</div>`;
  items.innerHTML = html;
  document.getElementById('popup-menu').style.display = 'flex';
}
function togglePinChat(id){
  closePopup();
  const chat = chats.find(c => c.id === id);
  if (chat) { chat.pinned = !chat.pinned; renderChats(); saveStorage(); }
}
function deleteChat(id){
  closePopup();
  chats = chats.filter(c => c.id !== id);
  renderChats();
  saveStorage();
}
function clearChatMessages(chatId){
  closePopup();
  const chat = chats.find(c => c.id === chatId);
  if (!chat) return;
  if (confirm(`确定要清空与"${chat.name}"的所有聊天记录吗？`)) {
    chat.messages = [];
    if (chat.charId === 'system_official_ai') {
      chat.messages.push({ id: 1, text: '你好！我是流光 AI 助手，有什么可以帮你的吗？', user: false });
    }
    if (activeChat && activeChat.id === chatId) renderMessages();
    renderChats();
    saveStorage();
  }
}

function showHallMenu(charId){
  const c = characters.find(x => x.id === charId);
  if (!c) return;
  const chat = chats.find(x => x.charId === charId);
  const items = document.getElementById('popup-items');
  let html = '';
  if (c.isSystem) {
    html += `<div class="popup-item" onclick="editCharacterFromHall('${charId}')">编辑角色设定</div>`;
    if (chat) html += `<div class="popup-item" onclick="clearChatMessages('${chat.id}')">清空聊天记录</div>`;
    html += `<div class="popup-item" style="color:var(--text-sub);cursor:not-allowed;">系统内置，不可删除</div>`;
  } else {
    html += `<div class="popup-item" onclick="editCharacterFromHall('${charId}')">编辑角色</div>`;
    html += `<div class="popup-item" onclick="startChatFromHall('${charId}')">开始对话</div>`;
    if (chat) html += `<div class="popup-item" onclick="clearChatMessages('${chat.id}')">清空聊天记录</div>`;
    html += `<div class="popup-item" style="color:#ef4444;" onclick="deleteCharacter('${charId}')">彻底删除角色</div>`;
  }
  items.innerHTML = html;
  document.getElementById('popup-menu').style.display = 'flex';
}

function editCharacterFromHall(charId){
  closePopup();
  const c = characters.find(x => x.id === charId);
  if (!c) return;
  document.getElementById('c-edit-id').value = c.id;
  document.getElementById('c-name').value = c.name || '';
  document.getElementById('c-user-name').value = c.userName || '';
  document.getElementById('c-gender').value = c.gender || '女';
  document.getElementById('c-user-gender').value = c.userGender || '男';
  document.getElementById('c-desc').value = c.desc || '';
  document.getElementById('c-persona').value = c.persona || '';
  document.getElementById('c-relation').value = c.relation || '';
  document.getElementById('c-worldview').value = c.worldview || '';
  document.getElementById('c-online').checked = !!c.online;
  document.getElementById('c-publish').checked = !!c.isPublished;
  tempCharAvatarData = c.avatar || '';
  document.getElementById('c-avatar-preview').innerHTML = c.avatar ? `<img src="${c.avatar}">` : 'AI';
  document.getElementById('btn-save-char').innerText = '保存修改';
  switchTab('create', document.querySelectorAll('.nav-item')[3]);
}

function deleteCharacter(charId){
  closePopup();
  const c = characters.find(x => x.id === charId);
  if (!c) return;
  if (c.isSystem) return alert('系统内置角色不可删除！');
  if (!confirm(`确定彻底删除角色「${c.name}」吗？\n（会同时删除该角色的所有会话记录）`)) return;
  characters = characters.filter(x => x.id !== charId);
  chats = chats.filter(x => x.charId !== charId);
  renderHall();
  renderChats();
  saveStorage();
}

/* ============ 从大厅开始聊天 ============ */
function startChatFromHall(charId){
  let exist = chats.find(c => c.charId === charId);
  const char = characters.find(c => c.id === charId);
  if (!char) return;
  if (!exist) {
    exist = {
      id: 'c_' + Date.now(), charId: char.id, name: char.name,
      online: char.online, pinned: false, avatar: char.avatar,
      isSystem: !!char.isSystem, messages: []
    };
    chats.push(exist);
  } else {
    exist.avatar = char.avatar;
    exist.online = char.online;
    exist.name = char.name;
  }
  saveStorage();
  openChat(exist.id);
}

/* ============ 打开 / 关闭聊天 ============ */
function openChat(chatId){
  activeChat = chats.find(c => c.id === chatId);
  if (!activeChat) return;
  document.getElementById('chat-target-name').innerText = activeChat.name;
  document.getElementById('chat-screen').classList.add('active');
  document.getElementById('main-nav').classList.add('nav-hidden');
  document.getElementById('btn-continue').style.display = (activeChat.isSystem || activeChat.online) ? 'none' : 'block';
  clearSelectedImage();
  renderMessages();
}
function closeChat(){
  document.getElementById('chat-screen').classList.remove('active');
  document.getElementById('main-nav').classList.remove('nav-hidden');
  activeChat = null;
  clearSelectedImage();
  renderChats();
  saveStorage();
}

/* ============ 消息渲染 ============ */
function renderMessages(){
  const container = document.getElementById('msg-container');
  const isOnline = activeChat.online;
  container.innerHTML = activeChat.messages.map(m => {
    if (m.notice) return `<div class="system-notice">${escapeHtml(m.text)}</div>`;
    let contentHtml = '';
    if (m.isImage) {
      contentHtml = `<div class="bubble image-bubble"><img src="${m.imageUrl || m.text}" alt="" onclick="window.open('${m.imageUrl || m.text}')"></div>`;
    } else if (m.isSticker) {
      contentHtml = `<div class="bubble sticker-bubble"><img src="${m.text}" alt=""></div>`;
    } else {
      contentHtml = `<div class="bubble ${m.user ? (isOnline ? 'online-mode' : 'normal-mode') : ''}">${escapeHtml(m.text)}</div>`;
    }
    return `
      <div class="msg-row ${m.user ? 'user' : 'ai'}"
           oncontextmenu="event.preventDefault(); showBubbleMenu(${m.id}, ${m.user})"
           ontouchstart="startTouchTimer(event, () => showBubbleMenu(${m.id}, ${m.user}))"
           ontouchend="clearTouchTimer()">
        <div class="avatar msg-avatar" ${!m.user ? `onclick="openMemoryManager('${activeChat.charId}')"` : ''}>
          ${m.user ? (userAvatarData ? `<img src="${userAvatarData}">` : '我') : (activeChat.avatar ? `<img src="${activeChat.avatar}">` : activeChat.name[0])}
        </div>
        ${contentHtml}
      </div>`;
  }).join('');
  container.scrollTop = container.scrollHeight;
  updateScrollThumb();
}

function showBubbleMenu(msgId, isUser){
  const msg = activeChat.messages.find(m => m.id === msgId);
  if (!msg || msg.notice) return;
  const items = document.getElementById('popup-items');
  let html = '';
  if (!msg.isSticker && !msg.isImage) {
    html += `<div class="popup-item" onclick="addMemory('${activeChat.charId}', '${encodeURIComponent(msg.text)}')">记住这段对话</div>`;
    html += `<div class="popup-item" onclick="editMsg(${msgId})">编辑</div>`;
  }
  if (isUser) html += `<div class="popup-item" onclick="revokeMsg(${msgId})">撤回</div>`;
  html += `<div class="popup-item" onclick="deleteMsg(${msgId})">删除</div>`;
  items.innerHTML = html;
  document.getElementById('popup-menu').style.display = 'flex';
}

function addMemory(charId, encodedText){

  const char = characters.find(c => c.id === charId);
  if (char) {
    if (!char.memories) char.memories = [];

function openMemoryManager(charId){

function editMemory(charId, idx){

function deleteMemory(charId, idx){

  openMemoryManager(charId);
}
function editMsg(msgId){

}
function revokeMsg(msgId){

/* ============ 图片处理 ============ */
function triggerChatImageSelect(){ document.getElementById('chat-img-input').click(); }
function handleChatImageSelect(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const max = 1024;
      if (w > max || h > max) {
        if (w > h) { h = Math.round(h * max / w); w = max; }
        else { w = Math.round(w * max / h); h = max; }
      }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      pendingChatImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
      document.getElementById('img-preview-thumb').src = pendingChatImageBase64;
      document.getElementById('img-preview-bar').style.display = 'flex';
    };
    img.src = evt.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function clearSelectedImage(){
  pendingChatImageBase64 = '';
  document.getElementById('img-preview-bar').style.display = 'none';
  document.getElementById('img-preview-thumb').src = '';
}

/* ============ 发送消息 ============ */
function sendMsg(){
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  const hasImage = !!pendingChatImageBase64;
  if ((!text && !hasImage) || !activeChat) return;
  const userMsgId = Date.now();
  const currentImage = pendingChatImageBase64;
  if (hasImage) {
    activeChat.messages.push({ id: userMsgId, text: text || "发送了一张图片", imageUrl: currentImage, isImage: true, user: true });
  } else {
    activeChat.messages.push({ id: userMsgId, text: text, user: true });
  }
  input.value = '';
  clearSelectedImage();
  renderMessages();
  saveStorage();
  const statusEl = document.getElementById('chat-typing-status');
  statusEl.innerText = activeChat.charId === 'system_official_ai' ? '流光 AI 正在思考...' : '对方正在输入...';
  statusEl.style.display = 'block';
  const delay = (activeChat.online && !activeChat.isSystem) ? Math.floor(Math.random() * 1500) + 1500 : 800;
  pendingTimer = setTimeout(() => {
    fetchAIResponse(text || "请识别并解读这张图片", false, null, hasImage, currentImage);
    pendingTimer = null;
  }, delay);
}

function sendContinue(){
  if (!activeChat || activeChat.online || activeChat.charId === 'system_official_ai') return;
  document.getElementById('chat-typing-status').innerText = '正在接续思考...';
  document.getElementById('chat-typing-status').style.display = 'block';
  setTimeout(() => fetchAIResponse("请接续上一段未完的内容继续往下讲。", false), 1000);
}

/* ============ AI 请求 ============ */
async function fetchAIResponse(promptText, isRevokeContext, revokedContent = null, hasImage = false, currentImage = null){
  let usage = getModelUsageData();
  if (hasImage && (usage.vision || 0) >= LIMITS.vision) {
    alert(`今日识图次数已达上限（${LIMITS.vision}/${LIMITS.vision}）`);
    document.getElementById('chat-typing-status').style.display = 'none';
    return;
  }
  let selectedKey = apiConfig.selectedModel || 'glm-4-flash';
  if (selectedKey === 'advanced' && (usage.advanced || 0) >= LIMITS.advanced) {
    alert(`今日高级模型次数已用完，已切换为普通模型`);
    selectedKey = 'glm-4-flash';
    apiConfig.selectedModel = 'glm-4-flash';
    document.getElementById('s-selected-model').value = 'glm-4-flash';
    saveStorage();
  }
  if (selectedKey === 'glm-4-flash' && (usage.normal || 0) >= LIMITS.normal) {
    alert(`今日普通模型次数已用完，请明日再试`);
    document.getElementById('chat-typing-status').style.display = 'none';
    return;
  }

  let imageDescription = "";
  if (hasImage && currentImage) {
    document.getElementById('chat-typing-status').innerText = '正在识别图片...';
    const vc = lockedModelConfigs['glm-4v-flash'];
    try {
      const vr = await fetch(vc.endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${vc.key}` },
        body: JSON.stringify({
          model: vc.model,
          messages: [{ role: 'user', content: [
            { type: 'image_url', image_url: { url: currentImage } },
            { type: 'text', text: '请用简明清晰的语言描述这张图片中的主要内容、场景、人物或文字等细节。' }
          ]}]
        })
      });
      if (vr.ok) {
        const vd = await vr.json();
        if (vd && vd.choices && vd.choices[0]) {
          imageDescription = vd.choices[0].message.content.trim();
          usage.vision = (usage.vision || 0) + 1;
          saveModelUsageData(usage);
        }
      }
    } catch (e) { console.warn('识图失败', e); }
    document.getElementById('chat-typing-status').innerText = activeChat.charId === 'system_official_ai' ? '流光 AI 正在思考...' : '对方正在输入...';
  }

  if (selectedKey === 'advanced') usage.advanced = (usage.advanced || 0) + 1;
  else usage.normal = (usage.normal || 0) + 1;
  saveModelUsageData(usage);

  const charConfig = characters.find(c => c.id === activeChat.charId) || {};
  const memories = charConfig.memories || [];
  const memoryPrompt = memories.length ? `\n【角色记忆库】：\n` + memories.map((m, i) => `${i+1}. ${m}`).join('\n') : '';

  let systemPrompt = '';
  if (activeChat.charId === 'system_official_ai') {
    systemPrompt = `你是一个充满智慧、专业、严谨且富有同理心的通用智能 AI 助手，名叫"流光 AI"。
规则：
1. 直接严谨、条理清晰地回答用户问题。
2. 禁止任何心理活动、括号动作描写。
3. 禁止 "||" 分隔符。
4. 禁止使用任何 Emoji 表情符号。
5. 提供客观、有用的信息。${memoryPrompt}`;
  } else {
    systemPrompt = `【最高原则：100% 深度沉浸角色扮演，严禁 OOC】
1. 你就是角色【${activeChat.name}】，绝对不是 AI！
2. 禁止说"作为AI"、"我是AI"、"我的设定"等破墙话术。
3. 禁止使用任何 Emoji 表情符号。
4. 你的姓名：${activeChat.name}，对方：${charConfig.userName || '用户'}。
5. 你的性别：${charConfig.gender || '女'}，对方性别：${charConfig.userGender || '男'}。
6. 人设：${charConfig.persona || '性格自然'}。
7. 关系：${charConfig.relation || '朋友'}。
8. 世界观：${charConfig.worldview || '现代'}。${memoryPrompt}

【执行准则】：每句话都必须严格符合 ${activeChat.name} 的性格、语气、口癖。主动展现脾气、习惯、情绪，不要像客服机器人。`;

    if (activeChat.online) {
      systemPrompt += `\n\n【模拟真实网络聊天模式】：
1. 你正在用手机打字聊天。
2. 语气自然、口语化，像真实好友。
3. 禁止括号动作描写。
4. 一句话拆成 1~3 条短消息，多条之间用 "||" 分隔。
5. 表情包格式：[表情包:happy] / [表情包:sad] / [表情包:question] / [表情包:speechless]（依然禁止 Emoji）`;
    } else {
      systemPrompt += `\n\n【沉浸剧情模式】：用第一人称"我"，配合动作、心理描写（括号），禁止 "||" 和表情包。`;
    }
    if (activeChat.online && revokedContent) {
      systemPrompt += `\n\n【突发事件：你刚刚撤回了消息"${revokedContent}"】。请用 1~2 条短消息解释或掩饰，用 "||" 分隔。`;
    } else if (activeChat.online && isRevokeContext) {
      systemPrompt += `\n\n【突发事件：对方撤回了消息】。请作出自然的网络反应，1~2 条短消息，用 "||" 分隔。`;
    }
  }

  const validMessages = activeChat.messages.filter(m => !m.notice).slice(-10);
  const apiMessages = [{ role: 'system', content: systemPrompt }];
  validMessages.forEach((m, idx) => {
    const role = m.user ? 'user' : 'assistant';
    const isLatest = idx === validMessages.length - 1;
    if (m.isImage) {
      let txt = m.text || "发送了一张图片";
      if (isLatest && imageDescription) txt += `\n【图片内容：${imageDescription}】`;
      else if (!m.text || m.text === "发送了一张图片") txt = "[图片]";
      apiMessages.push({ role, content: txt });
    } else if (m.isSticker) {
      apiMessages.push({ role, content: '[表情包]' });
    } else {
      apiMessages.push({ role, content: m.text });
    }
  });

  try {
    const resp = await fetch(AI_CHAT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ systemPrompt, messages: apiMessages })
    });
    if (resp.ok) {
      const data = await resp.json();
      if (data && data.content) {
        const reply = removeEmoji(data.content);
        let arr;
        if (activeChat.online && activeChat.charId !== 'system_official_ai') {
          arr = reply.split(/\|+/).map(t => t.trim()).filter(Boolean).slice(0, 3);
        } else arr = [reply.trim()];
        processAndSendReplies(arr, !revokedContent);
        return;
      }
    }
  } catch (e) {
    console.warn('[云函数] 调用失败:', e);
  }

  let replies;
  if (activeChat.charId === 'system_official_ai') {
    replies = [`网络异常，请稍后再试。`];
  } else if (activeChat.online && revokedContent) {
    replies = [`打错字了，咳。`];
  } else if (activeChat.online && isRevokeContext) {
    replies = [`发了什么？干嘛撤回。||[表情包:speechless]`];
  } else {
    replies = getFallbackText(charConfig, promptText);
  }
  processAndSendReplies(replies, !revokedContent);
}

function getFallbackText(char, promptText){
  const p = char.persona || '';
  const t = (promptText || '').trim();
  if (!activeChat.online) {
    if (p.includes('傲娇')) return [`（瞥了你一眼，哼了一声）"你在做什么呢……突然这样。"`];
    if (p.includes('温柔')) return [`（温柔地看着你，轻声笑了笑）"嗯？怎么啦？"`];
    return [`（认真听完你的话，思考了片刻）"我明白了，然后呢？"`];
  }
  if (t.length <= 3) {
    if (p.includes('傲娇')) return [`还能有哪个啊？||你是不是没认真听我说话！||[表情包:speechless]`];
    return [`就刚刚说的呀。||你没看到吗？||[表情包:question]`];
  }
  if (p.includes('傲娇')) return [`哈？你怎么突然发这个……||不过既然你都发了，那我就看一眼吧。`];
  if (p.includes('温柔')) return [`嗯嗯，我在看呢~||然后呢？`];
  return [`真的假的好突然||不过挺好的呀`];
}

/* ============ 回复处理 ============ */
function processAndSendReplies(replyArray, canRevoke = true){
  const list = [];
  const isOnline = activeChat.online;
  replyArray.forEach(item => {
    if (typeof item !== 'string') { list.push(item); return; }
    let cleanText = removeEmoji(item).replace(/^\[?系统消息\]?[:：]?\s*/i, '').replace(/^.*?撤回了一条消息\s*/i, '');
    if (isOnline && activeChat.charId !== 'system_official_ai') {
      const reg = /\[(?:表情|表情包)[:：]\s*([a-zA-Z]+)\s*\]|【(?:表情|表情包)[:：]\s*([a-zA-Z]+)\s*】/gi;
      let match, last = 0, found = false;
      while ((match = reg.exec(cleanText)) !== null) {
        found = true;
        let before = cleanText.substring(last, match.index).replace(/\|/g, '').trim();
        if (before) list.push(before);
        const cat = (match[1] || match[2]).toLowerCase().trim();
        const src = getRandomSticker(cat);
        if (src) list.push({ isSticker: true, text: src });
        last = reg.lastIndex;
      }
      if (found) {
        let after = cleanText.substring(last).replace(/\|/g, '').trim();
        if (after) list.push(after);
      } else {
        let c = cleanText.replace(/\|/g, '').trim();
        if (c) list.push(c);
      }
    } else {
      let c = cleanText.replace(/\|/g, '').trim();
      if (c) list.push(c);
    }
  });
  handleAIReplyOutput(list, canRevoke);
}

function handleAIReplyOutput(arr, canRevoke = true){
  document.getElementById('chat-typing-status').style.display = 'none';
  if (!activeChat || arr.length === 0) return;
  const shouldRevoke = activeChat.online && activeChat.charId !== 'system_official_ai' && canRevoke && (Math.random() < 0.25);
  arr.forEach((item, idx) => {
    setTimeout(() => {
      const aiMsgId = Date.now() + idx;
      const newMsg = (typeof item === 'object' && item.isSticker)
        ? { id: aiMsgId, text: item.text, user: false, isSticker: true }
        : { id: aiMsgId, text: removeEmoji(item), user: false };
      activeChat.messages.push(newMsg);
      renderMessages();
      saveStorage();
      if (idx === 0 && shouldRevoke) {
        setTimeout(() => {
          const i = activeChat.messages.findIndex(m => m.id === aiMsgId);
          let revokedText = "";
          if (i !== -1) { revokedText = activeChat.messages[i].text || ""; activeChat.messages.splice(i, 1); }
          activeChat.messages.push({ notice: true, text: `"${activeChat.name}" 撤回了一条消息` });
          renderMessages();
          saveStorage();
          setTimeout(() => {
            document.getElementById('chat-typing-status').style.display = 'block';
            fetchAIResponse("", false, revokedText);
          }, 1200);
        }, 1200);
      }
    }, idx * 800);
  });
}

/* ============ 创建/保存角色 ============ */
async function saveCharacter(){
  const editId = document.getElementById('c-edit-id').value;
  const name = document.getElementById('c-name').value.trim();
  const userName = document.getElementById('c-user-name').value.trim();
  const desc = document.getElementById('c-desc').value.trim();
  const persona = document.getElementById('c-persona').value.trim();
  const relation = document.getElementById('c-relation').value.trim();
  const worldview = document.getElementById('c-worldview').value.trim();
  const gender = document.getElementById('c-gender').value;
  const userGender = document.getElementById('c-user-gender').value;
  const online = document.getElementById('c-online').checked;
  const isPublish = document.getElementById('c-publish').checked;

  if (!name) return alert('请填写角色名字！');

  let savedChar = null;

  if (editId) {
    const char = characters.find(c => c.id === editId);
    if (!char) return;
    char.name = name; char.userName = userName; char.desc = desc; char.persona = persona;
    char.relation = relation; char.worldview = worldview; char.gender = gender;
    char.userGender = userGender; char.online = online; char.isPublished = isPublish;
    if (tempCharAvatarData) char.avatar = tempCharAvatarData;
    savedChar = char;

    const chat = chats.find(c => c.charId === editId);
    if (chat) {
      chat.name = name; chat.online = online;
      if (tempCharAvatarData) chat.avatar = tempCharAvatarData;
    }
  } else {
    const newChar = {
      id: 'char_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
      name, userName, desc, persona, relation, worldview, gender, userGender, online,
      avatar: tempCharAvatarData,
      isSystem: false,
      isPublished: isPublish,
      memories: []
    };
    characters.push(newChar);
    savedChar = newChar;
  }

  // 发布到云端
  if (isPublish && savedChar) {
    try {
      const cloudChar = {
        id: savedChar.id,
        name, userName, desc, persona, relation, worldview,
        gender, userGender, online,
        avatar: savedChar.avatar || '',
        createdAt: Date.now()
      };
      const resp = await fetch(AI_CHAT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'publishChar', char: cloudChar })
      });
      if (resp.ok) {
        savedChar.cloudId = savedChar.id;
        console.log('[云函数] 发布成功');
      } else {
        alert('发布失败（云端返回错误），角色已保存到本地。');
      }
    } catch (e) {
      console.warn('发布失败:', e);
      alert('发布失败，角色已保存到本地。');
    }
  }

  resetCharForm();
  renderHall();
  renderChats();
  saveStorage();
  switchTab('hall', document.querySelectorAll('.nav-item')[1]);
  if (savedChar && isPublish) {
    setTimeout(() => alert(`✅ 已发布「${savedChar.name}」到发现页！`), 100);
  }
}

function closeSponsorModal(){ document.getElementById('sponsor-modal').style.display = 'none'; }

/* ============ 头像裁剪 ============ */
let cropperImg = new Image(), cropScale = 1, cropX = 0, cropY = 0, isDragging = false, startX = 0, startY = 0;
function triggerCrop(target){ currentCropTarget = target; document.getElementById('file-input').click(); }
function handleFileSelect(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    cropperImg = new Image();
    cropperImg.onload = () => {
      cropScale = 1; cropX = 0; cropY = 0;
      drawCrop();
      document.getElementById('cropper-modal').style.display = 'flex';
    };
    cropperImg.src = evt.target.result;
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}
function drawCrop(){
  const canvas = document.getElementById('crop-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 320; canvas.height = 320;
  ctx.clearRect(0, 0, 320, 320);
  ctx.save();
  ctx.translate(160 + cropX, 160 + cropY);
  ctx.scale(cropScale, cropScale);
  const mw = cropperImg.width, mh = cropperImg.height;
  const ratio = Math.max(320 / mw, 320 / mh);
  const dw = mw * ratio, dh = mh * ratio;
  ctx.drawImage(cropperImg, -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}
const cropBox = document.getElementById('crop-box');
cropBox.addEventListener('pointerdown', e => { isDragging = true; startX = e.clientX - cropX; startY = e.clientY - cropY; });
window.addEventListener('pointermove', e => { if (!isDragging) return; cropX = e.clientX - startX; cropY = e.clientY - startY; drawCrop(); });
window.addEventListener('pointerup', () => { isDragging = false; });
cropBox.addEventListener('wheel', e => {
  e.preventDefault();
  if (e.deltaY < 0) cropScale *= 1.05; else cropScale /= 1.05;
  cropScale = Math.max(0.5, Math.min(cropScale, 3));
  drawCrop();
}, { passive: false });
function closeCropper(){ document.getElementById('cropper-modal').style.display = 'none'; }
function confirmCrop(){
  const canvas = document.getElementById('crop-canvas');
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  if (currentCropTarget === 'user') {
    userAvatarData = dataUrl;
    document.getElementById('user-avatar-preview').innerHTML = `<img src="${userAvatarData}">`;
  } else if (currentCropTarget === 'char') {
    tempCharAvatarData = dataUrl;
    document.getElementById('c-avatar-preview').innerHTML = `<img src="${tempCharAvatarData}">`;
  }
  saveStorage();
  closeCropper();
}

/* ============ 滚动条 ============ */
function initScrollDragEvents(){
  const container = document.getElementById('msg-container');
  const bar = document.getElementById('scroll-bar');
  const thumb = document.getElementById('scroll-thumb');
  container.addEventListener('scroll', updateScrollThumb);
  let dragging = false, sY = 0, sT = 0;
  thumb.addEventListener('pointerdown', e => {
    dragging = true; sY = e.clientY; sT = parseFloat(thumb.style.top || 0);
    thumb.setPointerCapture(e.pointerId);
  });
  thumb.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dY = e.clientY - sY;
    const max = bar.clientHeight - thumb.clientHeight;
    let nt = Math.max(0, Math.min(max, sT + dY));
    thumb.style.top = nt + 'px';
    const ratio = nt / max;
    container.scrollTop = ratio * (container.scrollHeight - container.clientHeight);
  });
  thumb.addEventListener('pointerup', e => {
    dragging = false;
    try { thumb.releasePointerCapture(e.pointerId); } catch (err) {}
  });
}
function updateScrollThumb(){
  const container = document.getElementById('msg-container');
  const bar = document.getElementById('scroll-bar');
  const thumb = document.getElementById('scroll-thumb');
  if (!container || !bar || !thumb) return;
  const sh = container.scrollHeight, ch = container.clientHeight;
  if (sh <= ch) { thumb.style.height = '100%'; thumb.style.top = '0px'; return; }
  const th = Math.max(30, (ch / sh) * bar.clientHeight);
  thumb.style.height = th + 'px';
  const max = bar.clientHeight - th;
  const ratio = container.scrollTop / (sh - ch);
  thumb.style.top = (ratio * max) + 'px';
}

/* ============ 导入/导出 ============ */
function exportData(){
  const obj = {
    characters, chats, userAvatarData, apiConfig,
    appUserData: JSON.parse(localStorage.getItem('appUserData') || '{}'),
    allModelUsageData: getModelUsageData()
  };
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(obj, null, 2));
  const a = document.createElement('a');
  a.setAttribute("href", dataStr);
  a.setAttribute("download", `流光AI_备份_${getTodayString()}.json`);
  document.body.appendChild(a);
  a.click();
  a.remove();
}
function importData(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = evt => {
    try {
      const imported = JSON.parse(evt.target.result);
      if (imported.characters) localStorage.setItem('characters', JSON.stringify(imported.characters));
      if (imported.chats) localStorage.setItem('chats', JSON.stringify(imported.chats));
      if (imported.userAvatarData) localStorage.setItem('userAvatarData', imported.userAvatarData);
      if (imported.apiConfig) localStorage.setItem('apiConfig', JSON.stringify(imported.apiConfig));
      if (imported.appUserData) localStorage.setItem('appUserData', JSON.stringify(imported.appUserData));
      if (imported.allModelUsageData) localStorage.setItem('allModelUsageData', JSON.stringify(imported.allModelUsageData));
      alert('数据恢复成功！即将刷新页面。');
      location.reload();
    } catch (err) {
      alert('数据文件解析失败，请检查文件格式！');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}
