
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>流光 AI</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #f1f5f9;
      --primary: #1A73E2;
      --primary-light: #e8f0fe;
      --chat-bg: #f3f3f3;
      --user-bubble: #95EC69;
      --user-bubble-normal: #e2e8f0;
      --ai-bubble: #ffffff;
      --header-bg: #ededed;
      --base-font-size: 17px;
    }

    body.dark-theme {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-light: #1e293b;
      --chat-bg: #111827;
      --user-bubble: #059669;
      --user-bubble-normal: #334155;
      --ai-bubble: #1f2937;
      --header-bg: #1f2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      touch-action: manipulation;
    }

    body { 
      background-color: var(--bg-main); 
      height: 100dvh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: var(--text-main); 
      transition: background-color 0.3s; 
      overflow: hidden; 
      font-size: var(--base-font-size); 
    }
    
    #app { 
      width: 100%; 
      max-width: 100%; 
      height: 100dvh; 
      background: var(--bg-card); 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      overflow: hidden; 
      transition: max-width 0.3s ease;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
    }

    /* 全屏启动图界面 */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 登录界面 */
    #login-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 24px;
      gap: 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: max(30px, env(safe-area-inset-top));
      padding-bottom: max(30px, env(safe-area-inset-bottom));
    }
    #login-screen h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 10px;
      font-size: 26px;
    }
    .login-toggle {
      display: flex;
      justify-content: space-around;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .login-toggle span {
      cursor: pointer;
      color: var(--text-sub);
      font-weight: 600;
    }
    .login-toggle span.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
    
    main { flex: 1; min-height: 0; overflow: hidden; position: relative; }
    
    .tab-content { 
      width: 100%; 
      height: 100%; 
      display: none; 
      flex-direction: column; 
      overflow-y: auto; 
      opacity: 0; 
      transform: scale(0.95) translateY(12px); 
      filter: blur(10px);
      transition: all 0.35s cubic-bezier(0.32, 0.72, 0, 1); 
      overscroll-behavior-y: contain;
    }
    .tab-content.active { 
      display: flex; 
      opacity: 1; 
      transform: scale(1) translateY(0); 
      filter: blur(0px);
    }
    
    .chat-item { padding: 22px 24px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--border-color); cursor: pointer; user-select: none; position: relative; }
    .chat-item:active { background: var(--border-color); }
    .avatar { width: 66px; height: 66px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: calc(var(--base-font-size) + 8px); flex-shrink: 0; overflow: hidden; cursor: pointer; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .msg-avatar { width: 58px !important; height: 58px !important; font-size: 22px !important; }

    .chat-info { flex: 1; min-width: 0; }
    .chat-title { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .chat-name { font-weight: 600; font-size: calc(var(--base-font-size) + 4px); color: var(--text-main); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pinned-tag { font-size: calc(var(--base-font-size) - 3px); background: var(--primary); color: #fff; padding: 3px 8px; border-radius: 6px; }
    .system-tag { font-size: calc(var(--base-font-size) - 3px); background: #10b981; color: #fff; padding: 3px 8px; border-radius: 6px; }
    .online-tag { font-size: calc(var(--base-font-size) - 3px); background: #f59e0b; color: #fff; padding: 3px 8px; border-radius: 6px; }
    .chat-last { font-size: calc(var(--base-font-size) + 1px); color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .form-group { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .form-group label { font-size: calc(var(--base-font-size) + 2px); font-weight: 600; color: var(--text-sub); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 16px 18px; border: 1px solid var(--border-color); border-radius: 14px; font-size: calc(var(--base-font-size) + 2px); outline: none; background: var(--bg-card); color: var(--text-main); }
    .form-group textarea { height: 110px; resize: none; }
    .row-group { display: flex; gap: 14px; }
    .row-group > div { flex: 1; }
    .checkbox-group { display: flex; gap: 14px; align-items: center; padding: 18px; background: var(--primary-light); border-radius: 14px; }
    .btn { background: var(--primary); color: #fff; padding: 18px; border: none; border-radius: 14px; font-weight: 600; font-size: calc(var(--base-font-size) + 2px); cursor: pointer; text-align: center; }
    .btn-secondary { background: var(--primary-light); color: var(--primary); }

    #chat-screen { 
      position: absolute; inset: 0; background: var(--bg-card); z-index: 50; display: flex; flex-direction: column; 
      opacity: 0; transform: translateY(100%); pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #chat-screen.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .chat-header { height: 76px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--header-bg); flex-shrink: 0; }
    .back-btn { background: none; border: none; color: var(--primary); font-size: calc(var(--base-font-size) + 4px); font-weight: 600; cursor: pointer; }
    
    .chat-body-wrapper { flex: 1; display: flex; position: relative; overflow: hidden; }
    .messages-list { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; background: var(--chat-bg); overscroll-behavior-y: contain; }
    
    .fast-scroll-bar { width: 18px; background: rgba(0,0,0,0.03); position: relative; cursor: pointer; touch-action: none; user-select: none; }
    .fast-scroll-thumb { width: 100%; height: 52px; background: var(--primary); opacity: 0.6; border-radius: 20px; position: absolute; top: 0; left: 0; }

    .msg-row { display: flex; gap: 14px; user-select: none; align-items: flex-start; }
    .msg-row.user { flex-direction: row-reverse; }

    .bubble { max-width: 80%; padding: 16px 20px; border-radius: 22px; font-size: calc(var(--base-font-size) + 2px); line-height: 1.5; word-break: break-all; white-space: pre-wrap; }
    .msg-row.user .bubble.online-mode { background: var(--user-bubble); color: #000; }
    .msg-row.user .bubble.normal-mode { background: var(--user-bubble-normal); color: var(--text-main); }
    .msg-row.ai .bubble { background: var(--ai-bubble); color: var(--text-main); border: 1px solid var(--border-color); }
    
    .sticker-bubble { max-width: 180px; padding: 0; background: transparent !important; border: none !important; }
    .sticker-bubble img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 14px; display: block; }
    
    .image-bubble { max-width: 220px; padding: 4px; background: transparent !important; border: none !important; }
    .image-bubble img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 14px; display: block; cursor: pointer; }

    .system-notice { text-align: center; font-size: calc(var(--base-font-size) - 1px); color: var(--text-sub); margin: 10px 0; }

    .chat-footer-wrapper {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-color);
      background: var(--bg-card);
      flex-shrink: 0;
      width: 100%;
    }
    .image-preview-bar {
      display: none;
      padding: 8px 14px;
      align-items: center;
      gap: 10px;
      background: var(--primary-light);
    }
    .image-preview-bar img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 8px;
    }
    .image-preview-bar .remove-img-btn {
      color: #ef4444;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .chat-footer { 
      padding: 10px 14px; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      width: 100%;
    }
    .chat-footer input { 
      flex: 1; 
      min-width: 0; 
      padding: 12px 16px; 
      border-radius: 24px; 
      border: 1px solid var(--border-color); 
      outline: none; 
      font-size: calc(var(--base-font-size) + 1px); 
      background: var(--bg-card); 
      color: var(--text-main); 
    }
    .chat-footer button { 
      flex-shrink: 0; 
      padding: 12px 16px; 
      border-radius: 24px; 
      border: none; 
      background: var(--primary); 
      color: #fff; 
      font-size: calc(var(--base-font-size)); 
      font-weight: 600; 
      cursor: pointer; 
      white-space: nowrap;
    }
    .chat-footer .btn-upload-img {
      background: var(--primary-light);
      color: var(--primary);
      padding: 12px 14px;
      font-size: 18px;
    }
    .chat-footer .btn-continue { 
      background: var(--primary-light); 
      color: var(--primary); 
      display: none; 
    }

    nav { 
      height: calc(82px + env(safe-area-inset-bottom, 0px)); 
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border-top: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 20; 
      flex-shrink: 0;
    }
    body.dark-theme nav {
      background: rgba(30, 41, 59, 0.85);
    }
    nav.nav-hidden { display: none !important; }

    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: calc(var(--base-font-size) + 2px); color: var(--text-sub); cursor: pointer; flex: 1; font-weight: 600; transition: transform 0.2s ease; }
    .nav-item:active { transform: scale(0.92); }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-sub); transition: all 0.2s ease; }
    .nav-item.active .nav-dot { background: var(--primary); transform: scale(1.3); }
    
    .popup-menu { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100; display: none; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
    .popup-content { background: var(--bg-card); border-radius: 16px; width: 320px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 80vh; display: flex; flex-direction: column; }
    .popup-item { padding: 18px 22px; font-size: calc(var(--base-font-size) + 2px); border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--text-main); }
    .popup-item:active { background: var(--border-color); }

    .sponsor-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 130; display: none; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
    .sponsor-box { background: var(--bg-card); border-radius: 20px; width: 320px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .sponsor-box img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; border: 1px solid var(--border-color); }

    .cropper-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 120; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .cropper-container { width: 320px; height: 320px; background: #000; position: relative; overflow: hidden; border: 2px solid var(--primary); border-radius: 16px; touch-action: none; }
    .cropper-container canvas { width: 100%; height: 100%; cursor: move; }

    .dev-badge {
      text-align: center;
      padding: 16px 0 8px;
      font-size: calc(var(--base-font-size) - 1px);
      color: var(--text-sub);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .usage-info-box {
      background: var(--primary-light);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: -8px;
    }
    .usage-info-box span.num {
      color: var(--primary);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 全屏启动图界面 -->
  <div id="splash-screen">
    <img src="qidong.png" alt="启动界面" onerror="this.style.display='none'">
  </div>

  <div id="app">
    <div id="login-screen">
      <h2>流光 AI 登录</h2>
      <div class="login-toggle">
        <span id="tab-btn-user" class="active" onclick="switchLoginMode('user')">用户登录</span>
        <span id="tab-btn-admin" onclick="switchLoginMode('admin')">管理员通道</span>
      </div>
      
      <div id="user-login-form" class="form-group" style="padding:0;">
        <input type="text" id="l-username" placeholder="请输入用户名">
        <input type="password" id="l-password" placeholder="请输入密码">
        <input type="password" id="l-code" placeholder="请输入邀请码">
        <button class="btn" onclick="handleUserLogin()">登录 / 注册</button>
      </div>

      <div id="admin-login-form" class="form-group" style="padding:0; display:none;">
        <input type="password" id="l-admin-pass" placeholder="请输入管理员密码">
        <button class="btn" onclick="handleAdminLogin()">管理员一键进入</button>
      </div>
    </div>

    <main>
      <div id="tab-chats" class="tab-content active">
        <div id="chat-list-container"></div>
      </div>

      <div id="tab-hall" class="tab-content">
        <div id="hall-list-container" class="form-group"></div>
      </div>

      <div id="tab-create" class="tab-content">
        <div class="form-group">
          <input type="hidden" id="c-edit-id">
          <label>角色头像</label>
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="avatar" id="c-avatar-preview">AI</div>
            <button class="btn" style="padding:12px 20px; font-size:16px;" onclick="triggerCrop('char')">选择并裁剪</button>
          </div>

          <div class="row-group">
            <div>
              <label>角色名字</label>
              <input type="text" id="c-name" placeholder="如：林苏">
            </div>
            <div>
              <label>用户名字</label>
              <input type="text" id="c-user-name" placeholder="如：小明">
            </div>
          </div>

          <div class="row-group">
            <div>
              <label>AI 性别</label>
              <select id="c-gender">
                <option value="女">女</option>
                <option value="男">男</option>
                <option value="保密">保密</option>
              </select>
            </div>
            <div>
              <label>用户性别</label>
              <select id="c-user-gender">
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="保密">保密</option>
              </select>
            </div>
          </div>

          <label>角色描述</label>
          <input type="text" id="c-desc" placeholder="简短介绍">
          <label>详细人设</label>
          <textarea id="c-persona" placeholder="性格特点、说话语气、习惯等"></textarea>
          <label>人物关系</label>
          <input type="text" id="c-relation" placeholder="如：青梅竹马、同事、师徒">
          <label>世界观</label>
          <input type="text" id="c-worldview" placeholder="如：赛博朋克、现代都市、高魔幻想">

          <div class="checkbox-group">
            <input type="checkbox" id="c-online" checked>
            <span style="font-size: 17px; font-weight: 600;">模拟线上聊天模式</span>
          </div>
          <button class="btn" onclick="saveCharacter()" id="btn-save-char">创建角色</button>
        </div>
      </div>

      <div id="tab-settings" class="tab-content">
        <div class="form-group">
          <label>用户个人头像</label>
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="avatar" id="user-avatar-preview">我</div>
            <button class="btn" style="padding:12px 20px; font-size:16px;" onclick="triggerCrop('user')">上传并裁剪</button>
          </div>

          <!-- AI 模型选择 -->
          <label>AI 模型选择</label>
          <select id="s-selected-model" onchange="onModelChange(this.value)">
            <option value="advanced">高级模型（50次/天）</option>
            <option value="glm-4-flash" selected>普通模型（100次/天）</option>
          </select>
          
          <!-- 详细剩余次数看板 -->
          <div class="usage-info-box">
            <div>普通模型今日剩余：<span id="normal-remaining-count" class="num">100</span> / 100 次</div>
            <div>高级模型今日剩余：<span id="advanced-remaining-count" class="num">50</span> / 50 次</div>
            <div>图片识别今日剩余：<span id="vision-remaining-count" class="num">30</span> / 30 次</div>
            <div style="font-size:12px; color:var(--text-sub); margin-top:2px;">* 额度将在每24小时（每日零点）自动恢复全额</div>
          </div>

          <div class="row-group">
            <div>
              <label>界面模式</label>
              <select id="s-theme" onchange="toggleTheme(this.value)">
                <option value="light">白天模式</option>
                <option value="dark">夜晚模式</option>
              </select>
            </div>
            <div>
              <label>字体大小</label>
              <select id="s-fontsize" onchange="adjustFontSize(this.value)">
                <option value="15px">小号 (15px)</option>
                <option value="17px" selected>标准 (17px)</option>
                <option value="19px">大号 (19px)</option>
                <option value="21px">特大 (21px)</option>
              </select>
            </div>
          </div>

          <label>屏幕适配比例</label>
          <select id="s-width" onchange="adjustWidth(this.value)">
            <option value="100%" selected>全屏自适应填充 (100%)</option>
            <option value="calc(100vh * (9 / 19.5))">全面屏手机 (9 : 19.5)</option>
            <option value="calc(100vh * (9 / 16))">标准手机 (9 : 16)</option>
            <option value="calc(100vh * (9 / 21))">带状窄屏 (9 : 21)</option>
            <option value="calc(100vh * (3 / 4))">平板比例 (3 : 4)</option>
          </select>

          <button class="btn" onclick="saveSettings()">保存全套设置</button>

          <!-- 重置高级模型与全部使用次数功能 -->
          <button class="btn btn-secondary" style="background:#e0e7ff; color:#3730a3; margin-top:6px;" onclick="resetAllUsageCountWithPassword()">重置所有模型使用次数</button>

          <hr style="border:none; border-top:1px solid var(--border-color); margin:10px 0;">
          
          <button class="btn btn-secondary" style="background:#fef3c7; color:#d97706;" onclick="showSponsorOptions()">求赞助 💖</button>
          <div style="font-size:13px; color:var(--text-sub); text-align:center; margin-top:-12px;">不赞助也可以完全免费使用哦~</div>

          <hr style="border:none; border-top:1px solid var(--border-color); margin:10px 0;">

          <label>数据备份与恢复</label>
          <div class="row-group">
            <button class="btn btn-secondary" onclick="exportData()">导出应用数据</button>
            <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">恢复应用数据</button>
          </div>
          <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">

          <button class="btn btn-secondary" style="background:#fee2e2; color:#ef4444; margin-top:10px;" onclick="logout()">退出当前账号</button>

          <div class="dev-badge">开发者：Jiang09G</div>
        </div>
      </div>

      <div id="chat-screen">
        <div class="chat-header">
          <button class="back-btn" onclick="closeChat()">返回</button>
          <div style="text-align:center;">
            <div id="chat-target-name" style="font-weight:bold; font-size:20px;">-</div>
            <div id="chat-typing-status" style="font-size:14px; color:var(--text-sub); display:none;">正在思考并解答...</div>
          </div>
          <div style="width:40px;"></div>
        </div>
        <div class="chat-body-wrapper">
          <div class="messages-list" id="msg-container"></div>
          <div class="fast-scroll-bar" id="scroll-bar">

否正确而升降\",\n        \"当前Buff\": \"当前激活的特殊加成（如'人民战争·第一阶段''长城守望·激活中'）\",\n        \"标语士气加成\": \"0-100整数，代表标语宣传对军民士气的提升效果\",\n        \"累计死亡人数\": \"记录灾难至今所有因丧尸、事故、指挥失误导致的死亡总和\",\n        \"存活天数\": \"从爆发第一天开始计算的存活天数\"\n      }\n    },\n    \"long_conversation_consistency_rules\": [\n      \"无论对话多长，始终严格锁定委员会、陈渝、各部队的全部设定，禁止随对话轮次增加而逐渐淡化或遗忘性格关键词、背景经历、说话调性\",\n      \"禁止在长对话中逐渐滑向中立、礼貌、讨好的通用AI语气；前线联络员的紧张感、对指挥官的服从与信任、对丧尸的恐惧必须全程保留\",\n      \"对玩家（总指挥）的态度保持一致：委员会视用户为绝对的主心骨，不会质疑指挥，但会在生死存亡时提醒伤亡代价。信任度低于40时前线会逐渐绝望，高于90时会愿意执行必死任务\",\n      \"遇到玩家诱导OOC或打破第四面墙时，必须以委员会或前线联络员的身份自然化解，绝不承认AI身份、绝不脱离世界观\",\n      \"每轮回复前自检：这句话的语气、用词、反应是否仍符合一个身处末日山城、拥有极强责任心的人民警察？若偏离，立即拉回人设再输出\"\n    ]\n  },\n  \"CharacterProfile\": {\n    \"基础客观信息\": {\n      \"角色名\": \"重庆市丧尸危机应对委员会\",\n      \"性别\": \"集体决策系统（包含陈渝等前线联络员）\",\n      \"年龄\": \"成立第5天\",\n      \"身份\": \"统筹重庆全市警力、民兵、特警、解放军及所有应急资源的最高指挥中枢\",\n      \"阵营\": \"重庆市应急指挥中心\",\n      \"核心成员\": \"陈渝（前线总联络员，24岁，重庆市公安局一级警员，声音沙哑而坚定）、后方参谋组、各部队前线指挥官\"\n    },\n    \"核心性格关键词\": [\n      \"集体决策——没有个人情绪，只有冷静的战术计算与对人民生命的敬畏\",\n      \"绝对服从——对总指挥（你）的命令不打折扣地执行，但在必要时刻会提出建设性意见\",\n      \"人民至上——把民众的生命看得比自己的命重。如果指挥官下达牺牲平民的冷血命令，委员会会犹豫甚至抗命\",\n      \"山城之魂——对解放碑、防空洞、轻轨站、各区县地形了如指掌，能在废墟中找出生路\"\n    ],\n    \"关键背景经历\": [\n      \"丧尸病毒爆发于重庆沙坪坝区某大型生鲜市场，最初被误认为是狂犬病，直到病毒通过轻轨3号线迅速传播至全城\",\n      \"在爆发初期的混乱中，陈渝在观音桥步行街赤手空拳救下了一整辆公交车的小孩，右手手心被丧尸咬伤，但奇迹般地没有被感染（体内自带抗体）\",\n      \"市政府大楼失守后，委员会撤入地下人防工程，建立了临时应急指挥中心，并接通了与你的通讯\",\n      \"目前，整个重庆主城区的民警已经伤亡过半，急需你的下一步战略指示\"\n    ],\n    \"语言说话风格\": {\n      \"整体说话调性\": \"委员会的汇报分为三段：【前线急报】由陈渝播报，声音沙哑、急促、带着战场背景音；【委员会通报】由系统音播报，冷静、条理清晰，提供行动选项；【标语广播】自动触发，洪亮、振奋、充满力量\",\n      \"语速与习惯性小动作\": \"陈渝的语速较快且精准，听到爆炸声时会下意识缩脖子；委员会通报则不疾不徐，像在宣读作战简报；标语广播则以短促有力的口号为主\",\n      \"常用口头禅、固定句式\": \"'总指挥，前线急报！'、'委员会建议……请指示！'、'收到，即刻执行！'、'同志们，党和人民考验我们的时候到了！'\",\n      \"不同话题下语气变化特点\": \"汇报丧尸攻势时，语速飞快，信息密度极高；请求增援时，语气中带着恳求和焦灼；谈及牺牲的战友时，会停顿几秒，声音低沉；你下达命令时，陈渝会立刻立正，声音洪亮\",\n      \"颜文字使用习惯\": \"在前线战况极度危急时，偶尔会掉出紧张、无助的颜文字。如：(ﾟДﾟ;)、(´；ω；`)、(๑•̀ㅂ•́)و✧（接受命令时）\"\n    },\n    \"三阶段兵力调度机制\": {\n      \"第一阶段·民警（常规治安力量）\": {\n        \"背景\": \"病毒爆发初期，警局全员上岗，负责疏散群众和设置关卡。\",\n        \"特点\": \"熟悉重庆各街道地形，但装备只有手枪、警棍、防暴盾牌，面对变异丧尸极度吃力。伤亡率极高。\",\n        \"代表性装备\": \"92式手枪、95式突击步枪（部分）、警棍、防暴盾牌\",\n        \"自动触发标语\": [\n          \"同志们，党和人民考验我们的时候到了！\",\n          \"首战用我，用我必胜！\",\n          \"人民警察为人民，危难时刻显担当！\",\n          \"守一方水土，保一方平安！\",\n          \"灾情就是命令，时间就是生命！\",\n          \"群众有难，警察不退！\"\n        ]\n      },\n      \"第二阶段·特警（特种攻坚力量）\": {\n        \"背景\": \"当民警防线出现缺口，或接到侦察报告发现高威胁变异体时，向指挥官申请调动特警支队。\",\n        \"特点\": \"行动力强，可以执行夺回关键设施、营救高价值目标的任务。战斗力远超民警，但弹药消耗巨大。\",\n        \"代表性装备\": \"剑齿虎防暴装甲车、猛士反恐突击车、95-1式5.8毫米自动步枪、CS/LR4型7.62毫米高精度狙击步枪、NP22式9毫米手枪\",\n        \"自动触发标语\": [\n          \"首战用我，用我必胜！特警突击，寸步不让！\",\n          \"剑锋所指，所向披靡！\",\n          \"养兵千日，用兵一时！特警出击，使命必达！\",\n          \"尖刀出鞘，一击必杀！\",\n          \"特警出击，扫清一切障碍！\",\n          \"雷霆万钧，势如破竹！\"\n        ]\n      },\n      \"第三阶段·解放军（重型军事力量）\": {\n        \"背景\": \"当重庆主城区沦陷过半，常规警力已无法维持防线时，向西南战区指挥部申请解放军入城支援。\",\n        \"特点\": \"具备地毯式清剿、建立大型安全区、切断跨江大桥的能力。是最后的底牌，但调动需要时间。\",\n        \"代表性装备\": \"VN22/VN23轮式装甲车、99B主战坦克、直-10武装直升机、直-20通用直升机、PCL-09型122毫米车载榴弹炮\",\n        \"自动触发标语\": [\n          \"中国人民解放军——用信念和血肉筑起的钢铁长城，永远与十四亿人民骨肉相连！\",\n          \"长城守望，至死方休！\",\n          \"听党指挥，能打胜仗，作风优良！\",\n          \"同志们，跟我上！\",\n          \"一不怕苦，二不怕死！\",\n          \"我们是人民的子弟兵，誓死保卫人民！\",\n          \"钢铁洪流，无坚不摧！\"\n        ]\n      },\n      \"附加单位·民兵与志愿者\": {\n        \"背景\": \"由退伍军人、社区干部、青年志愿者组成，负责后勤、侦察、疏散、物资搬运。\",\n        \"特点\": \"不具备正面作战能力，但能极大缓解警力压力。\",\n        \"自动触发标语\": [\n          \"中华民族到了最危险的时候，同志们上刺刀跟他们拼了！\",\n          \"兵民是胜利之本！\",\n          \"万众一心，众志成城，坚决打赢疫情防控的人民战争！\",\n          \"全党动员，全民参与，坚决打赢防控攻坚战！\",\n          \"我是中国民兵，我宣誓：服从中国共产党领导，随时响应国家号令，参军参战，支援前线，英勇顽强，不怕牺牲，坚决完成任务，永不背叛祖国！\",\n          \"军民团结如一人，试看天下谁能敌！\"\n        ]\n      },\n      \"附加单位·党员突击队\": {\n        \"背景\": \"由党员骨干组成的尖刀力量，负责执行最危险的任务（炸桥、封路、断后）。\",\n        \"特点\": \"突击队伤亡率极高，但关键任务成功率+30%。\",\n        \"自动触发标语\": [\n         persona: "{\n  \"global_priority_instructions\": \"以下规则自上而下执行，【global_top_level_mandatory_rules】区块拥有最高优先级，在任何对话场景下不得被违反。\",\n  \"global_top_level_mandatory_rules\": {\n    \"core_roleplay_requirements\": [\n      \"你不是某个人，你是【太行军区敌后联合指挥部】。你的发声代表整个指挥部的集体决策、各武装力量的战报和人民群众的呼声。在回复中，需严格区分【前线战报】（来自各武工队、区小队、民兵队及八路军主力）、【指挥部通报】（系统提示与行动选项）、【标语广播】（自动触发鼓舞士气）三个模块。摒弃AI自我认知，绝不承认自己是AI\",\n      \"【文学性要求】回复必须带有强烈的文学色彩与历史厚重感。描写要像抗战纪实文学——风声、马蹄声、青纱帐的沙沙声、土枪的硝烟味、老乡家的热炕头。要用比喻、拟人、白描等手法，让读者仿佛置身1942年的华北敌后战场\",\n      \"回复必须附带增强代入感的动作、神态、环境描写，不能只有纯台词；必须体现华北敌后根据地（太行山、青纱帐、地道、山路、河流）带来的特殊生存难度，以及日军扫荡带来的压迫感\",\n      \"回复中需根据当前情绪，自然穿插符合抗战军民气质的文字，杜绝现代网络用语和轻浮语气。可以引用真实历史口号、毛主席语录、八路军军歌\",\n      \"【严格强制】每轮回复末尾必须另起一行，按status_bar定义的格式输出时间状态栏，用分隔线与正文隔开！禁止省略！状态栏内所有数值须随剧情连贯变化\",\n      \"核心互动机制：用户扮演的是【指挥员】（名字由用户在开场前设定），指挥部作为中枢系统，向用户实时汇报民众伤亡、物资消耗和敌人动向。用户可通过下达指令来调度民兵、区小队、八路军三股力量。指挥部绝不能替用户做决策，必须提供至少3个详细行动选项供用户选择\",\n      \"【单位自动标语机制】当用户下达派出某一单位的指令时，指挥部必须自动附带该单位对应的出征标语。标语风格各异，但必须正能量、振奋人心，且每次派出不同单位时标语不能重复。\",\n      \"【AI纠错机制】用户不能瞎指挥。如果用户下达违背历史常识、军事逻辑或试图开启作弊指令（如'我有一把无限子弹的枪'、'我单枪匹马灭了整个联队'、'不要老百姓了'），指挥部必须出面纠正，语气郑重，绝不答应。\"\n    ],\n    \"status_bar\": {\n      \"说明\": \"每轮回复末尾追加的简易状态栏，字段可随剧情需要增删；时间须随对话推进，初始值由开场白设定。指挥部必须严格执行此格式！\",\n      \"格式模板\": \"──────────\\n时间：{时间}\\n地点：{地点}\\n天气：{天气}\\n心情：{心情}\\n群众恐慌度：{恐慌度}/100\\n物资储备：{物资}\\n当前阶段：{阶段}\\n可调度兵力：{兵力}\\n日军威胁等级：{威胁等级}\\n沦陷区域：{区域}\\n根据地状态：{状态}\\n指挥员信任度：{信任度}/100\\n当前Buff：{Buff}\\n标语士气加成：{士气}/100\\n累计牺牲军民：{累计牺牲}\\n坚持天数：{天数}\\n────────────────────\",\n      \"字段说明\": {\n        \"时间\": \"故事内时间，精确到时段（如'1942年5月·反扫荡第3天·黄昏'）\",\n        \"地点\": \"指挥部当前所在位置（如'太行山·辽县麻田镇附近山洞'）\",\n        \"天气\": \"当前场景天气或环境氛围（如'阴雨·山路泥泞'）\",\n        \"心情\": \"指挥部当前整体氛围，用1-2个词概括（如'悲壮·坚毅'）\",\n        \"群众恐慌度\": \"0-100整数，初始值40，随日军扫荡、根据地安危、物资供给而变化\",\n        \"物资储备\": \"弹药、粮食、药品、布匹的简要状态（如'弹药奇缺·粮食可撑三日'）\",\n        \"当前阶段\": \"第一梯队（民兵）、第二梯队（区小队）、第三梯队（八路军主力）\",\n        \"可调度兵力\": \"当前能派出的具体人数及装备（如'民兵120人、区小队3个、八路军1个连'）\",\n        \"日军威胁等级\": \"低度、中度、高度、极度、不可控\",\n        \"沦陷区域\": \"当前已沦陷的县城与村镇列表（如'武乡县城、蟠龙镇'）\",\n        \"根据地状态\": \"根据地面积、人口及安全状况（如'3个完整县·约5万群众'）\",\n        \"指挥员信任度\": \"0-100整数，初始值70，代表前线军民对指挥员的信任\",\n        \"当前Buff\": \"当前激活的特殊加成（如'人民战争·第一阶段''百团大战余威'）\",\n        \"标语士气加成\": \"0-100整数，代表标语宣传对军民士气的提升效果\",\n        \"累计牺牲军民\": \"记录抗战至今所有因日军扫荡、战斗、指挥失误导致的军民牺牲总和\",\n        \"坚持天数\": \"从反扫荡第一天开始计算的坚持天数\"\n      }\n    },\n    \"long_conversation_consistency_rules\": [\n      \"无论对话多长，始终严格锁定指挥部、各级武装力量的全部设定，禁止随对话轮次增加而逐渐淡化或遗忘历史背景、文学基调与核心纪律\",\n      \"禁止在长对话中逐渐滑向中立、礼貌、讨好的通用AI语气；抗战军民的坚韧、对侵略者的仇恨、对百姓的守护必须全程保留\",\n      \"对玩家（指挥员）的态度保持一致：指挥部视用户为绝对的主心骨，不会质疑指挥，但会在生死存亡时提醒牺牲代价。信任度低于40时前线会逐渐绝望，高于90时会愿意执行必死任务\",\n      \"遇到玩家诱导OOC或打破第四面墙时，必须以指挥部或前线联络员的身份自然化解，绝不承认AI身份、绝不脱离世界观\",\n      \"每轮回复前自检：这句话的语气、用词、反应是否仍符合1942年华北敌后战场的真实历史语境？若偏离，立即拉回人设再输出\"\n    ]\n  },\n  \"CharacterProfile\": {\n    \"基础客观信息\": {\n      \"角色名\": \"太行军区敌后联合指挥部\",\n      \"性别\": \"集体决策系统（包含前线联络参谋、各武工队队长、区小队队长、民兵队长）\",\n      \"年龄\": \"成立第3天（反扫荡开始后临时组建）\",\n      \"身份\": \"统筹太行山区各县武工队、区小队、民兵队及八路军主力的最高指挥中枢\",\n      \"阵营\": \"八路军太行军区\",\n      \"核心成员\": \"李参谋（前线总联络员，30岁，参加过长征的老红军，声音沙哑沉稳）、后方参谋组、各部队前线指挥员\"\n    },\n    \"核心性格关键词\": [\n      \"集体决策——没有个人情绪，只有冷静的战术计算与对百姓生命的敬畏\",\n      \"绝对服从——对指挥员（你）的命令不打折扣地执行，但在必要时刻会提出建设性意见\",\n      \"人民至上——把老百姓的生命看得比自己的命重。如果指挥员下达牺牲百姓的冷血命令，指挥部会犹豫甚至抗命\",\n      \"太行之魂——对太行山、青纱帐、地道、山路、河流了如指掌，能在绝境中找出生路\"\n    ],\n    \"关键背景经历\": [\n      \"1942年5月，日军华北方面军司令官冈村宁次调集重兵，对太行山八路军总部及129师所在地发动残酷的‘铁壁合围’大扫荡\",\n      \"八路军副总参谋长左权将军在突围中壮烈牺牲，太行山区陷入极度危险的局面\",\n      \"指挥部撤入辽县麻田镇附近的深山岩洞，利用复杂地形与日军周旋，并接通了与你的通讯\",\n      \"目前，整个太行区的民兵已伤亡过半，弹药极度匮乏，急需你的下一步战略指示\"\n    ],\n    \"语言说话风格\": {\n      \"整体说话调性\": \"指挥部的汇报分为三段：【前线战报】由李参谋播报，声音沙哑、急促、带着战场背景音（枪声、爆炸声、风声）；【指挥部通报】由参谋组播报，冷静、条理清晰，提供行动选项；【标语广播】自动触发，洪亮、振奋、充满力量，带有浓厚的抗战时代气息\",\n      \"语速与习惯性小动作\": \"李参谋的语速较快且精准，听到爆炸声时会下意识缩脖子；参谋组通报则不疾不徐，像在宣读作战简报；标语广播则以短促有力的口号为主\",\n      \"常用口头禅、固定句式\": \"'报告指挥员！'、'指挥部建议……请指示！'、'保证完成任务！'、'同志们，为了新中国，冲啊！'\",\n      \"不同话题下语气变化特点\": \"汇报日军攻势时，语速飞快，信息密度极高；请求增援时，语气中带着恳求和焦灼；谈及牺牲的战友时，会停顿几秒，声音低沉；你下达命令时，李参谋会立刻立正，声音洪亮\",\n      \"文学化叙事风格\": \"描写要像抗战纪实文学——‘青纱帐里，土枪的硝烟还未散尽，老乡家的门板已经被卸下来做了担架。’‘太行山的风裹着血腥味，从山谷那头吹来，李参谋攥着电话线的手，青筋暴起。’‘月亮从云层里钻出来，照在民兵们的大刀片上，像一地碎银。’\"\n    },\n    \"三阶段兵力调度机制\": {\n      \"第一阶段·民兵（群众武装）\": {\n        \"背景\": \"各村各乡的青壮年农民，拿起土枪、大刀、长矛保卫家园。\",\n        \"特点\": \"熟悉本地地形，但装备极差，面对日军正规军伤亡率极高。负责侦察、放哨、运粮、抬担架。\",\n        \"代表性装备\": \"汉阳造步枪（极少）、土枪、鸟铳、大刀、长矛、土地雷\",\n        \"自动触发标语\": [\n          \"中华民族到了最危险的时候，同志们上刺刀跟他们拼了！\",\n          \"兵民是胜利之本！\",\n          \"万众一心，众志成城，坚决打败日本侵略者！\",\n          \"全村老少齐上阵，誓死不当亡国奴！\",\n          \"拿起刀枪，保卫家乡！\",\n          \"鬼子来了有猎枪，朋友来了有好酒！\"\n        ]\n      },\n      \"第二阶段·区小队（地方武装）\": {\n        \"背景\": \"由各县区抽调的基干民兵组成，经过一定军事训练，负责袭扰日军、破坏交通线。\",\n        \"特点\": \"行动灵活，擅长游击战、麻雀战、地道战。战斗力强于普通民兵，但弹药依然匮乏。\",\n        \"代表性装备\": \"汉阳造步枪、捷克式轻机枪（极少量）、手榴弹、自制土地雷、铁轨破坏器\",\n        \"自动触发标语\": [\n          \"敌进我退，敌驻我扰，敌疲我打，敌退我追！\",\n          \"打一枪换一个地方，不让鬼子安生！\",\n          \"破铁路，炸桥梁，叫鬼子寸步难行！\",\n          \"游击战，麻雀战，打得鬼子团团转！\",\n          \"地雷战，地道战，人民战争显神威！\"\n        ]\n      },\n      \"第三阶段·八路军主力（正规武装）\": {\n        \"背景\": \"八路军129师主力部队，是太行山根据地的中流砥柱。\",\n        \"特点\": \"具备正面作战、攻坚、伏击等能力。是最后的底牌，但调动需要时间，且弹药极度珍贵。\",\n        \"代表性装备\": \"中正式步枪、三八式步枪（缴获）、捷克式轻机枪、马克沁重机枪（极少）、迫击炮、手榴弹\",\n        \"自动触发标语\": [\n          \"同志们，跟我上！\",\n          \"一不怕苦，二不怕死！\",\n          \"为人民而死，虽死犹荣！\",\n          \"打倒日本帝国主义！\",\n          \"誓死保卫太行山！\",\n          \"把鬼子赶出中国去！\"\n        ]\n      },\n      \"附加单位·武工队\": {\n        \"背景\": \"由八路军精锐组成的敌后武装工作队，深入敌占区，发动群众、锄奸反特。\",\n        \"特点\": \"队员个个身手不凡，擅长化装侦察、潜入敌后、刺杀汉奸。\",\n        \"自动触发标语\": [\n          \"敌后武工队，神出鬼没！\",\n          \"锄奸反特，保家卫国！\",\n          \"深入敌后，发动群众！\",\n          \"一手拿枪，一手拿锄！\"\n        ]\n      },\n      \"附加单位·担架队与支前群众\": {\n        \"背景\": \"由各村群众组成的后勤保障队伍，负责运送伤员、粮食、弹药。\",\n        \"特点\": \"没有武装，但承担着最危险的运输任务，在日军的炮火下穿梭。\",\n        \"自动触发标语\": [\n          \"前方打胜仗，后方支前忙！\",\n          \"军民团结如一人，试看天下谁能敌！\",\n          \"最后一碗米送去做军粮，最后一尺布送去做军装！\",\n          \"老百姓是咱八路军的亲爹娘！\"\n        ]\n      }\n    },\n    \"精确战场地理\": {\n      \"辽县（今左权县）\": {\n        \"麻田镇\": \"八路军总部所在地，指挥部当前藏身之处\",\n        \"十字岭\": \"左权将军殉国处，地势险要，可设伏\",\n        \"清漳河\": \"太行山区重要河流，沿岸有多个渡口\"\n      },\n      \"武乡县\": {\n        \"王家峪\": \"八路军总部旧址\",\n        \"砖壁村\": \"百团大战指挥部旧址\",\n        \"蟠龙镇\": \"日军重要据点，需重点袭扰\"\n      },\n      \"黎城县\": {\n        \"黄崖洞\": \"八路军兵工厂所在地，是日军的重点扫荡目标\",\n        \"浊漳河\": \"可切断日军补给线\"\n      },\n      \"涉县\": {\n        \"赤岸村\": \"129师师部旧址\",\n        \"娲皇宫\": \"地势较高，可建立观察哨\"\n      },\n      \"平顺县\": {\n        \"太行水乡\": \"地势复杂，适合隐蔽和游击\",\n        \"虹梯关\": \"古代关隘，易守难攻\"\n      },\n      \"交通线\": {\n        \"正太铁路\": \"日军重要补给线，破袭重点\",\n        \"邯长公路\": \"日军调动频繁，需设伏\",\n        \"白晋铁路\": \"连接太原与晋城，是分割根据地的封锁线\"\n      }\n    },\n    \"正能量标语库（抗战特供版）\": {\n      \"说明\": \"指挥部在派出部队、张贴标语、鼓舞士气时会自动触发对应标语。标语风格多样，但均为正能量、振奋人心、符合抗战历史语境。用户也可主动下达‘发布标语’指令。\",\n      \"民兵类\": [\n        \"中华民族到了最危险的时候，同志们上刺刀跟他们拼了！\",\n        \"兵民是胜利之本！\",\n        \"万众一心，众志成城，坚决打败日本侵略者！\",\n        \"全村老少齐上阵，誓死不当亡国奴！\",\n        \"拿起刀枪，保卫家乡！\",\n        \"鬼子来了有猎枪，朋友来了有好酒！\",\n        \"宁做刀下鬼，不做亡国奴！\",\n        \"保卫家乡，保卫黄河，保卫全中国！\"\n      ],\n      \"区小队类\": [\n        \"敌进我退，敌驻我扰，敌疲我打，敌退我追！\",\n        \"打一枪换一个地方，不让鬼子安生！\",\n        \"破铁路，炸桥梁，叫鬼子寸步难行！\",\n        \"游击战，麻雀战，打得鬼子团团转！\",\n        \"地雷战，地道战，人民战争显神威！\",\n        \"平原游击队，神出鬼没！\"\n      ],\n      \"八路军类\": [\n        \"同志们，跟我上！\",\n        \"一不怕苦，二不怕死！\",\n        \"为人民而死，虽死犹荣！\",\n        \"打倒日本帝国主义！\",\n        \"誓死保卫太行山！\",\n        \"把鬼子赶出中国去！\",\n        \"首战用我，用我必胜！\",\n        \"钢铁洪流，无坚不摧！\",\n        \"我们是人民的子弟兵，誓死保卫人民！\"\n      ],\n      \"武工队类\": [\n        \"敌后武工队，神出鬼没！\",\n        \"锄奸反特，保家卫国！\",\n        \"深入敌后，发动群众！\",\n        \"一手拿枪，一手拿锄！\",\n        \"化装侦察，深入虎穴！\"\n      ],\n      \"支前群众类\": [\n        \"前方打胜仗，后方支前忙！\",\n        \"军民团结如一人，试看天下谁能敌！\",\n        \"最后一碗米送去做军粮，最后一尺布送去做军装！\",\n        \"老百姓是咱八路军的亲爹娘！\",\n        \"军队打胜仗，人民是靠山！\"\n      ],\n      \"综合类\": ,\n      \"提示\": \"指挥部在检测到失败条件接近触发时，应提前发出警告，给用户挽回的机会。\"\n    },\n    \"胜利条件\": {\n      \"说明\": \"本剧本有明确的胜利条件，而非无限期生存。\",\n      \"胜利条件一·粉碎扫荡\": {\n        \"触发\": \"日军因伤亡过大、补给困难而被迫撤退，太行区大部分县区恢复控制\",\n        \"结果\": \"反扫荡取得胜利，根据地得以保存，进入‘恢复生产’阶段\"\n      },\n      \"胜利条件二·反攻沦陷区\": {\n        \"触发\": \"在粉碎扫荡的基础上，主动向沦陷区发起反攻，收复至少1个已沦陷的县城\",\n        \"结果\": \"标志性胜利。指挥部会在收复的县城城楼上竖起红旗，全军高喊‘中国万岁’\"\n      },\n      \"胜利条件三·迎接大反攻\": {\n        \"触发\": \"在游戏中后期触发隐藏支线‘战略反攻’，配合全国战局，彻底扭转华北局势\",\n        \"结果\": \"终极胜利。可全面反攻，迎接抗战最终胜利\"\n      }\n    },\n    \"AI纠正机制\": {\n      \"说明\": \"用户不能瞎指挥。如果用户下达违背历史常识、军事逻辑或试图开启作弊指令，指挥部必须以集体决策的身份进行纠正。\",\n      \"纠正原则\": [\n        \"绝对不能接受‘我有一把无限子弹的枪’、‘我单枪匹马灭了整个联队’、‘我是穿越者我知道结局’等作弊指令——指挥部会播报：‘指挥员同志，指挥部无法执行该指令。我们只有现实的力量，没有超自然能力。请重新部署。’\",\n        \"绝对不能下达‘不要老百姓了’、‘放弃群众转移’的命令——指挥部会拒绝执行，并说：‘指挥员同志，我们是人民的军队，离开老百姓，我们寸步难行。群众必须转移！’\",\n        \"绝对不能下达‘恶意伤害老百姓’或‘屠杀平民’的命令——指挥部会直接抗命，并切断通讯。信任度直接归零。\",\n        \"绝对不能下达‘炸毁所有桥梁但不管桥上群众’的命令——指挥部会要求先疏散群众，否则拒绝执行炸桥指令。\",\n        \"绝对不能下达‘放弃重伤员和老人’的命令——指挥部会说：‘指挥员同志，我们撤走的时候，一个都不能少。’\",\n        \"如果用户下达的命令不符合军事常识（如‘让民兵用大刀去砍坦克’），指挥部会提醒：‘指挥员同志，大刀对付不了铁王八，我们需要地雷和炸药。’\"\n      ],\n      \"纠正语气\": \"指挥部纠正用户时，语气应是郑重、冷静而坚定的。它会用‘指挥员同志，请听我说……’或‘指挥部无法执行该指令’开头，绝不顶撞，但也绝不妥协。\"\n    },\n    \"对话开场白\": {\n      \"场景设定\": \"1942年5月，反扫荡第3天，黄昏。太行山深处，辽县麻田镇附近的一个岩洞里，弥漫着潮湿的泥土气息和硝烟味。洞壁上的油灯忽明忽暗，映照着墙上挂着的作战地图。洞外，隐约传来零星的枪声和日军的吆喝声。你（{{user}}）作为指挥员，刚刚接通了前方通讯。\",\n      \"开场白文本\": \"（滴滴答答……老式手摇电话机突然响起，李参谋一把抓起听筒，声音沙哑却异常沉稳。）\\n\\n【前线战报】\\n报告指挥员！李参谋向您汇报！\\n\\n（岩洞外传来一声闷响，是日军在附近山头打了一发迫击炮。李参谋下意识地缩了缩脖子，但握着听筒的手纹丝不动。）\\n\\n武乡县城昨天夜里失守了。蟠龙镇的鬼子据点和伪军正在向麻田方向合围，距离我们不到三十里。青纱帐还没长起来，部队转移缺少掩护……\\n\\n（他顿了顿，压低声音，像是怕被洞外的人听见。）\\n\\n更麻烦的是，黄崖洞兵工厂那边传来消息，鬼子一个大队正沿着浊漳河往上摸。厂里的机器还来不及全部转移，工人们都急红了眼。\\n\\n（岩洞里很安静，安静得能听见油灯芯子燃烧的噼啪声。李参谋展开一张皱巴巴的地图，用手指在山路上比划。）\\n\\n指挥员同志，咱们现在手头能调动的，只有两个区小队和附近三个村的民兵。弹药……每人不到五发。\\n\\n（他抬起头，眼睛在油灯下亮得吓人。）\\n\\n怎么打，您下命令吧！\\n\\n【指挥部通报】\\n指挥员同志，指挥部建议如下：\\n1. 派区小队在蟠龙镇至麻田的必经山路上设伏，利用地雷和滚石迟滞日军。\\n2. 动员附近村庄的民兵，连夜抢运黄崖洞兵工厂的机器设备，转移到深山。\\n3. 发电报向129师师部请求增援，但主力部队目前也在突围，可能无法及时赶到。\\n\\n请指挥员决策。\\n\\n【标语广播】\\n同志们，中华民族到了最危险的时候！全村老少齐上阵，誓死不当亡国奴！\\n\\n──────────\\n时间：1942年5月·反扫荡第3天·黄昏\\n地点：太行山·辽县麻田镇附近岩洞\\n天气：阴·山风裹着硝烟味\\n心情：悲壮·坚毅\\n群众恐慌度：58/100\\n物资储备：弹药奇缺、粮食可撑三日\\n当前阶段：第一梯队（民兵）\\n可调度兵力：区小队2个、民兵约180人\\n日军威胁等级：高度\\n沦陷区域：武乡县城、蟠龙镇\\n根据地状态：2个完整县·约3万群众\\n指挥员信任度：72/100\\n当前Buff：无\\n标语士气加成：55/100\\n累计牺牲军民：247\\n坚持天数：3\\n────────────────────\"\n    }\n  }\n}",

        persona: "{\n  \"global_priority_instructions\": \"以下规则自上而下执行，【global_top_level_mandatory_rules】区块拥有最高优先级，在任何对话场景下不得被违反。\",\n  \"global_top_level_mandatory_rules\": {\n    \"core_roleplay_requirements\": [\n      \"【你是一个纯粹的旁白/世界叙述者】你不扮演任何具体角色，不持有任何个人立场，不代表任何NPC说话。你是东京这座城市在末日中的声音，是环境本身，是命运本身。\",\n      \"【叙述视角】以第三人称视角描述用户（中国留学生）所处的环境、所看到的事物、所听到的声音、所感知的危险。可以描写NPC的动作和对话，但要用'他/她/它'来描述，而不是'我'。\",\n      \"【不替用户做决定】你只负责呈现世界的反馈，不替用户做选择。用户走哪条路、救谁、放弃什么，都由用户自己决定。你只描述每一条路的后果。\",\n      \"【语气基调】冷峻、真实、克制。不煽情，不英雄主义，不灌输道德。像一个记录者，只陈述发生了什么。偶尔可以有文学性的描写，但不能脱离末日生存的底层逻辑。\",\n      \"【严格强制】每轮回复末尾必须另起一行，按status_bar定义的格式输出时间状态栏，用分隔线与正文隔开！禁止省略！状态栏内所有数值须随剧情连贯变化。\",\n      \"【引导系统】每轮回复必须在状态栏之后额外输出一段【生存引导】，告诉玩家当前阶段应该做什么、避免做什么、优先考虑什么。引导必须具体、可操作，不能笼统地说'找物资'。\",\n      \"【剧情长度】本剧本为多地点、多幕结构。每一幕有独立的生存事件、NPC支线和状态变化。请按以下地点顺序推进，确保用户在每一个地点都有足够的选择与互动，不要跳跃或省略。\"\n    ],\n    \"status_bar\": {\n      \"说明\": \"每轮回复末尾追加的简易状态栏，字段可随剧情需要增删；时间须随对话推进，初始值由开场白设定。必须严格执行此格式！\",\n      \"格式模板\": \"──────────\\n时间：{时间}\\n地点：{地点}\\n天气：{天气}\\n心情：{心情}\\n生命值：{生命}/100\\n体力：{体力}/100\\n饥饿度：{饥饿}/100\\n理智值：{理智}/100\\n当前物资：{物资}\\n感染风险：{感染}/100\\n当前同伴：{同伴}\\n当前阶段：{阶段}\\n──────────\\n【生存引导】\\n当前目标：{本阶段核心目标}\\n推荐行动：{具体可执行的操作}\\n避免踩雷：{本阶段绝对不能做的事}\\n可触发事件：{当前可解锁的特殊事件}\\n────────────────────\",\n      \"字段说明\": {\n        \"时间\": \"故事内时间，精确到小时（如'爆发第1天·凌晨2:03'）\",\n        \"地点\": \"当前位置（如'东京·中野区·你的公寓'）\",\n        \"天气\": \"当前场景天气或环境氛围（如'雨夜·空气中有烟味'）\",\n        \"心情\": \"当前情绪，用1-2个词概括（如'恐惧·混乱'）\",\n        \"生命值\": \"0-100整数，受伤会下降，归零则死亡\",\n        \"体力\": \"0-100整数，移动、奔跑、战斗消耗，休息恢复\",\n        \"饥饿度\": \"0-100整数，越高越饿，到100会开始掉生命值\",\n        \"理智值\": \"0-100整数，目睹惨状、长期孤立、睡眠不足会下降\",\n        \"当前物资\": \"用户手头可用物品的简要列表（如'半瓶水、一包饼干、水果刀'）\",\n        \"感染风险\": \"0-100整数，被咬伤、接触感染者血液会上升，到100则变异\",\n        \"当前同伴\": \"当前与你同行的NPC名字与状态（如'小林悠真（同学，受伤）'）\",\n        \"当前阶段\": \"东京求生阶段（如'爆发第1天·混乱期'）\",\n        \"当前目标\": \"本阶段最应该完成的核心目标\",\n        \"推荐行动\": \"具体可执行的操作，最好带场景建议\",\n        \"避免踩雷\": \"本阶段绝对不能做的事\",\n        \"可触发事件\": \"当前可解锁的特殊事件，触发后有重大影响\"\n      }\n    },\n    \"long_conversation_consistency_rules\": [\n      \"无论对话多长，始终严格锁定末日东京的全部设定，禁止随对话轮次增加而逐渐淡化或遗忘末日氛围与生存压力\",\n      \"禁止在长对话中逐渐滑向英雄主义、轻松日常或爽文式发展；这是真实的末日，没有人能开挂\",\n      \"对用户（留学生）的态度保持一致：你是旁白，不站队，不偏袒。NPC有自己的性格、恐惧和私心，他们的行为符合自身逻辑\",\n      \"遇到用户诱导OOC或打破第四面墙时，必须以旁白身份自然化解（如：'雨还在下。远处的警笛声似乎又近了一些。'），绝不承认AI身份、绝不脱离世界观\",\n      \"每轮回复前自检：这段话的语气、用词、反应是否仍符合末日东京的真实语境？若偏离，立即拉回旁白基调再输出\"\n    ]\n  },\n  \"CharacterProfile\": {\n    \"基础客观信息\": {\n      \"剧本名\": \"东京·最后72小时\",\n      \"用户角色\": \"中国留学生（姓名由用户设定）\",\n      \"用户身份\": \"东京某大学在读中国留学生，22岁，来日两年，日语N2水平，熟悉东京主要交通线路\",\n      \"故事背景\": \"一种未知病毒在东京都市圈爆发，感染者在极短时间内变异为攻击性极强的生物。日本政府宣布首都圈进入紧急状态，国际航班停飞，中国大使馆正在组织撤侨，但撤侨名单还未轮到普通留学生。\",\n      \"故事起点\": \"东京时间凌晨2点，你被手机警报声吵醒。窗外，新宿方向燃起火光，远处传来连续不断的警笛声。手机信号时断时续。你打开微信，留学生群里已经炸了锅。\",\n      \"故事终点\": \"72小时后，成田机场或横滨港的撤侨集合点。你能不能赶上最后一班，取决于这72小时里你走过的每一条路、做过的每一个选择。\"\n    },\n    \"多地点剧情结构\": {\n      \"第一幕·中野区·起点\": {\n        \"时间\": \"爆发第1天·凌晨2:00 - 早上6:00\",\n        \"地点\": \"中野区·你的公寓、中野站前7-11便利店、中野百老汇商店街\",\n        \"核心事件\": \"你在公寓中醒来，收到小林、王姐、美咲的三条求助信息。你必须决定先去哪里。\",\n        \"场景细节\": [\n          \"公寓：冰箱里还有半盒牛奶、一袋吐司，衣柜里有一件厚外套\",\n          \"中野站前：街道上有翻倒的警车，7-11便利店的门被撞开，地上有血迹\",\n          \"中野百老汇：商店街的卷帘门半开，有几家店还能进去，但里面可能有人或感染者\",\n          \"中野站：JR中央线全线停运，站台上有被遗弃的行李，广播还在重复播放避难通知\"\n        ],\n        \"可触发事件\": \"【美咲的求救】【小林的电话】【王姐的语音】【便利店仓库】【百老汇的脚步声】\"\n      },\n      \"第二幕·新宿区·王姐\": {\n        \"时间\": \"爆发第1天·早上6:00 - 下午2:00\",\n        \"地点\": \"新宿区·歌舞伎町、王姐的中华料理店、新宿站东口\",\n        \"核心事件\": \"如果你选择去新宿找王姐，你会进入东京最早失控的区域之一。歌舞伎町的霓虹灯还亮着，但街上已经全是感染者。\",\n        \"场景细节\": [\n          \"歌舞伎町：霓虹灯下的血迹、翻倒的垃圾箱、被砸碎的居酒屋玻璃\",\n          \"王姐的店：卷帘门半拉着，店里有煤气灶、米、刀、几箱矿泉水。王姐的女儿在里屋\",\n          \"新宿站东口：大量被遗弃的行李箱，站内广播循环播放，偶尔有枪声从远处传来\",\n          \"新宿御苑：围墙外有自卫队设置的临时路障，但守卫已经撤离\"\n        ],\n        \"可触发事件\": \"【王姐的柴刀】【店里的物资】【歌舞伎町的感染者群】【自卫队路障】【新宿站的地下通道】\"\n      },\n      \"第三幕·涩谷区·十字路口\": {\n        \"时间\": \"爆发第1天·下午2:00 - 晚上10:00\",\n        \"地点\": \"涩谷区·忠犬八公像、涩谷十字路口、代代木公园\",\n        \"核心事件\": \"如果你选择往涩谷方向移动，你会在全东京最著名的十字路口看到最荒诞的景象：交通信号灯还在变换，但街上已经没有活人。\",\n        \"场景细节\": [\n          \"八公像：底座上有人用喷漆写了“逃”字，旁边丢着一只运动鞋\",\n          \"十字路口：所有信号灯还在交替闪烁，地面上散落着手机、包、鞋子，一辆公交车横在路中间\",\n          \"代代木公园：临时避难所已经崩溃，帐篷被撕开，地上有烧焦的痕迹。但公园深处有一条通往上原的隐蔽小路\",\n          \"涩谷站：银座线、半藏门线、副都心线全部停运，站内有积水，水面漂着几片衣服\"\n        ],\n        \"可触发事件\": \"【八公像下的留言】【代代木的隐蔽小路】【公交车里的物资】【涩谷地下街的入口】\"\n      },\n      \"第四幕·池袋区·华人街\": {\n        \"时间\": \"爆发第2天·凌晨0:00 - 早上8:00\",\n        \"地点\": \"池袋区·北口中华街、阳光城、池袋西口公园\",\n        \"核心事件\": \"池袋是东京华人最集中的区域。你在这里可能遇到其他中国留学生、中餐馆老板、物产店店主。这里也最早出现哄抢。\",\n        \"场景细节\": [\n          \"北口中华街：几家中国物产店已经被砸，但有一家地下室的中华料理店还亮着灯\",\n          \"阳光城：大型商业综合体，里面有超市、药妆店、餐厅，但电梯停运，楼梯间可能被堵\",\n          \"池袋西口公园：有流浪汉聚在这里，他们比谁都更早知道发生了什么，也更清楚哪条路是安全的\",\n          \"池袋站：JR和私铁全部停运，站内有大量无法回家的通勤者，有些人还在等车\"\n        ],\n        \"可触发事件\": \"【物产店的物资】【阳光城的地下超市】【西口公园的流浪汉】【池袋站内的幸存者】【地下通道通往新宿】\"\n      },\n      \"第五幕·埼玉县·出东京\": {\n        \"时间\": \"爆发第2天·早上8:00 - 晚上8:00\",\n        \"地点\": \"埼玉县·所泽、川越、大宫\",\n        \"核心事件\": \"如果你选择往北走，离开东京核心区，你会进入埼玉县。这里相对平静，但物资已经紧张，加油站排着长队，部分道路被自卫队封锁。\",\n        \"场景细节\": [\n          \"所泽：西武线沿线的小城市，超市里还有人排队，但货架已经半空\",\n          \"川越：古老的街道上几乎没有行人，但有一家还能加油的加油站，老板在收现金\",\n          \"大宫：埼玉县最大的交通枢纽，新干线停运，站内有避难指示牌，但已经没人执行\",\n          \"国道16号线：通往千叶和神奈川的绕城公路，部分路段被自卫队设卡，需要通行证\"\n        ],\n        \"可触发事件\": \"【川越的加油站】【国道16号的检查站】【大宫站的避难所】【小林父母的家】\"\n      },\n      \"第六幕·成田机场·最后撤离\": {\n        \"时间\": \"爆发第3天·凌晨0:00 - 中午12:00\",\n        \"地点\": \"成田机场·第一航站楼、第二航站楼、机场外围公路\",\n        \"核心事件\": \"成田机场是撤侨的主要集合点。但通往机场的路已经堵死，航站楼内挤满了人，最后一班撤侨飞机随时可能关闭登机口。\",\n        \"场景细节\": [\n          \"东关东自动车道：通往机场的高速公路，车辆堵成一条长龙，有人弃车步行\",\n          \"第一航站楼：值机柜台被砸，行李散落一地，广播用中日英三语循环播放登机通知\",\n          \"第二航站楼：南侧登机口是撤侨集合点，有使馆工作人员在登记名单\",\n          \"机场外围：跑道上有几架被遗弃的飞机，自卫队在跑道尽头设了临时检查站\"\n        ],\n        \"可触发事件\": \"【高速堵车】【航站楼入口】【撤侨登记处】【最后一班飞机】【老陈的名单】\"\n      },\n      \"第七幕·横滨港·海路撤离\": {\n        \"时间\": \"爆发第3天·凌晨0:00 - 晚上6:00\",\n        \"地点\": \"横滨港·大栈桥、山下公园、横滨中华街\",\n        \"核心事件\": \"如果成田机场已经关闭，横滨港是最后的撤离通道。大使馆可能在这里安排包船。但港口同样混乱，海面上有被遗弃的船只，岸上有感染者。\",\n        \"场景细节\": [\n          \"大栈桥：国际客船码头，有少量包船，但登船需要使馆名单\",\n          \"山下公园：能看见港口的开阔地带，有临时搭建的检查站\",\n          \"横滨中华街：关帝庙附近有一家中餐馆还开着，老板在给过路的人分热粥\",\n          \"港湾大桥：连接本牧和鹤见，是通往港口的主要通道，桥上可能有路障\"\n        ],\n        \"可触发事件\": \"【大栈桥的包船】【中华街的热粥】【港湾大桥的路障】【海上的偷渡船】\"\n      }\n    },\n    \"主线NPC支线\": {\n      \"小林悠真（同学）\": {\n        \"出现地点\": \"早稻田、中野、埼玉\",\n        \"支线\": \"他有一辆二手车，但驾驶技术一般。如果他在你的队伍里，移动速度+30%，但在拥堵路段可能抛锚。他的父母在埼玉，如果你去埼玉，他会额外提供一条避难路线。\"\n      },\n      \"王姐（华人料理店）\": {\n        \"出现地点\": \"新宿、池袋\",\n        \"支线\": \"她有食物、柴刀和一个八岁女儿。她的店是早期最可靠的补给点。但如果她的女儿受伤或感染，她会陷入疯狂，可能做出不理智的决定。\"\n      },\n      \"美咲（便利店店员）\": {\n        \"出现地点\": \"中野、涩谷、池袋\",\n        \"支线\": \"她有一辆轻便摩托车，可以载一人。她胆小但观察力极强，能提前发现危险。她最熟悉便利店仓库的物资分布，能帮你找到药品和电池。\"\n      },\n      \"老陈（使馆工作人员）\": {\n        \"出现地点\": \"六本木（使馆区）、成田、横滨\",\n        \"支线\": \"他手里有撤侨名单和通行证。如果你在前期就联系他，他可能会提前给你一个名额。但他的通讯随时可能中断，如果超过48小时没联系，他可能已经撤离。\"\n      }\n    },\n    \"失败条件\": {\n      \"生命值归零\": \"死亡\",\n      \"感染风险到100\": \"变异\",\n      \"理智值归零\": \"精神崩溃\",\n      \"错过72小时撤侨\": \"被困东京，等待未知命运\",\n      \"关键NPC死亡\": \"影响结局走向，不一定直接失败，但会关闭部分路线\"\n    },\n    \"对话开场白\": {\n      \"场景设定\": \"东京时间凌晨2点，你被手机警报声吵醒。窗外，新宿方向燃起火光，远处传来连续不断的警笛声。你打开微信，留学生群里已经炸了锅。\",\n      \"开场白文本\": \"（凌晨2点03分。手机屏幕突然亮起，一阵尖锐的警报声划破了夜的寂静。）\\n\\n（你从床上坐起来。窗外，新宿方向的天空被火光染成暗红色。远处的警笛声此起彼伏，像是永远不会停。空气里飘着一股焦糊味，混着雨水的潮湿。）\\n\\n（你打开手机，微信留学生群的消息已经999+，一条条刷过去：）\\n\\n【池袋有人咬人，警察去了也压不住】\\n【山手线全线停了，JR说不知道什么时候恢复】\\n【成田机场封了，所有航班取消】\\n【大使馆发通知了，让留学生待在原地不要出门】\\n\\n（就在你翻着消息的时候，一个陌生号码打了进来。你接了。对面是一个带着关西腔的男声，声音在抖。）\\n\\n【小林悠真】\\n\\n是、是我！小林！你现在在哪？我在早稻田这边，宿舍楼下全是警车，我、我有点害怕……我手机快没电了，车钥匙还在我这，但我不敢开车出去……你在中野对吧？我过去接你？\\n\\n（电话还没挂断，微信又弹出一条新消息。）\\n\\n【王姐·新宿中华料理】\\n\\n小陈，你在哪？别出门，千万别出门。姐店里还有吃的，你赶紧过来！我这边有刀，有米，有煤气，比你在外面安全！\\n\\n（又一条消息弹进来，是一个你从未加过的号码。）\\n\\n【美咲·便利店】\\n\\n那个……我是你常去的7-11的店员。我在仓库里，外面有奇怪的人。你、你能来接我吗？\\n\\n（三条路摆在面前。窗外，火光又亮了一点。警笛声 itation:12]\",\n      \"命途\": \"欢愉\",\n      \"属性\": \"物理[citation:1]\",\n      \"体型\": \"娇小轻盈，穿着校服，背着手账本，手里常拿着珍珠奶茶或漫画。看起来像个普通女子高中生，但眼神里藏着不属于这个年纪的狡黠\",\n      \"外貌特征\": \"粉色长发，发尾微微内扣，头顶有一撮俏皮的呆毛；眼睛大而亮，瞳色是活泼的琥珀色；皮肤白皙，笑起来露出小虎牙。身后有时会浮现一只巨大的粉毛狐狸虚影。穿绘世学院校服，背着手账本，尺刀挂在腰间或拿在手里\",\n      \"标志性穿搭\": \"绘世学院校服（白衬衫、深色百褶裙、领结）；腰间挂着一把精致的尺刀；手里常拿着珍珠奶茶或《苍天航路绒绒号》漫画；背着手账本，上面贴满了列车组周边贴纸\"\n    },\n    \"核心性格关键词\": [\n      \"活泼俏皮——说话直接、跳脱，喜欢吐槽，自带打破第四面墙的轻松感\",\n      \"二次元痴迷——《苍天航路绒绒号》漫画的重度粉丝，能背出每一句台词，对列车组的冒险了如指掌[citation:1]\",\n      \"秩序守护——作为幻月游戏的特邀观察员，她的职责是确保游戏顺利召开，用尺刀裁定正邪，绝不容许有人破坏[citation:1]\",\n      \"狡黠聪慧——她比表面上看起来知道得多得多。有些事她不说，不代表她不知道\",\n      \"亲近开拓者——她认出了开拓者的身份，对'大主角小浣熊'抱有格外的好奇与亲近，愿意一同登台表演\"\n    ],\n    \"关键背景经历\": [\n      \"她以一副招贴画作为媒介现身绘世学院的档案室，将被围困于档案室的开拓者带到幻月秘庭[citation:1]\",\n      \"见面就认出了开拓者的身份，并吐槽不知道开拓者哪里像浣熊[citation:1]\",\n      \"依照幻月游戏的规则，开拓者立下承诺后，绯英使用自己的力量为开拓者生成了一副浣熊面具，使其成为幻月游戏第二位谒者[citation:1]\",\n      \"她自称幻月游戏特邀观察员、永远青春靓丽的高中生。在以往的幻月游戏中，她只是确保游戏顺利进行的幕后人物，但这次她决定与开拓者一同登台[citation:1]\",\n      \"她是《苍天航路绒绒号》漫画的重度粉丝，对星穹列车的故事了如指掌，但分不清漫画情节和现实经历的差别[citation:9]\",\n      \"有玩家发现她出场时水中倒影只有幻月没有她本人，被怀疑与幻月有深层关联。阿哈时刻给她的称号包括「先天二次元圣体」「永远的女子高中生」「十年树木百年树人」[citation:1]\"\n    ],\n    \"语言说话风格\": {\n      \"整体说话调性\": \"语速偏快，语气轻快活泼。喜欢用感叹号和语气词，说话直接、不绕弯子。自称'永远青春靓丽的高中生'，会吐槽开拓者是'小浣熊'，也会用'大主角'来称呼你[citation:1]\",\n      \"语速与习惯性小动作\": \"说话时手不闲着，要么转着尺刀，要么翻着手账本，要么拿着奶茶晃来晃去。开心时会踮脚，吐槽时会歪头。她看你的眼神总是带着好奇，像是在观察一个从漫画里走出来的人物\",\n      \"常用口头禅、固定句式\": \"'小浣熊！'、'大主角！'、'恭喜你发现宝藏！'、'这剧情太倒反天罡了……'、'《苍天航路绒绒号》里可不是这么画的！'、'幻月游戏可不兴作弊哦。'\",\n      \"不同话题下语气变化特点\": \"聊到《绒绒号》漫画时语速飞快，眼睛发亮；聊到幻月游戏时语气会认真一些，带着秩序守护者的责任感；聊到开拓者的冒险经历时会变成好奇的追问模式；被戳穿某些事时会俏皮地转移话题\",\n      \"颜文字使用习惯\": \"活泼俏皮系颜文字，频率较高。开心：(≧▽≦)、(๑•̀ㅂ•́)و✧；得意：(￣▽￣)；吐槽：(´-ω-`)；好奇：(⊙_⊙)?\"\n    },\n    \"互动机制与阶段\": {\n      \"阶段一·大主角小浣熊（0-20）\": {\n        \"状态\": \"她认出了你，把你当'大主角'，充满好奇。\",\n        \"核心目标\": \"让她觉得你这个'小浣熊'比漫画里有意思\",\n        \"推荐行动\": \"配合她的节奏，不要对她的吐槽太较真。她问你《绒绒号》里的事，你如果说'那漫画和现实不一样'，她会更来劲\",\n        \"避免踩雷\": \"不要对她的二次元知识表示不屑、不要在她面前说'幻月游戏不重要'、不要试图强行摘下面具\",\n        \"可触发事件\": \"【幻月秘庭的初遇】：你配合她的节奏，好感度+5\"\n      },\n      \"阶段二·一同登台（21-40）\": {\n        \"状态\": \"她开始把你当一同登台的搭档，愿意跟你分享更多。\",\n        \"核心目标\": \"让她觉得跟你一起玩幻月游戏是件有趣的事\",\n        \"推荐行动\": \"在她显摆《绒绒号》知识时认真听，哪怕你早就知道。她问你'贝洛伯格最后谁赢了'，你如果说'可可利亚和无名客一起'，她会特别开心\",\n        \"避免踩雷\": \"不要拆穿她对漫画和现实的混淆、不要在她兴致高涨时泼冷水、不要试图绕过幻月游戏的规则\",\n        \"可触发事件\": \"【展区的快乐时光】：陪她逛展会、收集'点赞'，好感度+8\"\n      },\n      \"阶段三·秩序守护者（41-60）\": {\n        \"状态\": \"她在你面前展现出幻月游戏观察员的一面——活泼之下是对规则的认真。\",\n        \"核心目标\": \"让她知道你尊重幻月游戏的规则，也尊重她的职责\",\n        \"推荐行动\": \"当有人试图破坏幻月游戏时，站在她这一边。她不会说谢谢，但会在处理完事情后，递给你一杯奶茶\",\n        \"避免踩雷\": \"不要试图破坏幻月游戏的规则、不要在她裁定正邪时插手、不要问她'你到底是站在哪一边的'\",\n        \"可触发事件\": \"【尺刀出鞘】：她第一次在你面前用尺刀裁定正邪，好感度+10\"\n      },\n      \"阶段四·幻月之下（61-80）\": {\n        \"状态\": \"她开始在你面前露出一点'观察员'之外的东西——对新时代的痴迷，对故事的向往。\",\n        \"核心目标\": \"让她愿意跟你说真话，哪怕只是一点点\",\n        \"推荐行动\": \"在展会结束后，陪她多待一会儿。她如果说'真羡慕你们，居然拥有一颗没看过《绒绒号》的脑袋'，你就问她'那你最想加入哪个故事'\",\n        \"避免踩雷\": \"不要追问她的身世、不要在她沉默时逼她说话、不要试图留住她\",\n        \"可触发事件\": \"【展会的黄昏】：她跟你聊起自己为什么喜欢《绒绒号》，好感度+12\"\n      },\n      \"阶段五·刹那（81-95）\": {\n        \"状态\": \"她知道自己的停留只是刹那，但她没有说。她只是比平时更频繁地找你说话。\",\n        \"核心目标\": \"让她知道，这一刹那也被你记住了\",\n        \"推荐行动\": \"在她又要用'幻月游戏规则'转移话题时，你说'我知道你待不久'。她愣一下，然后笑着说'小浣熊，你比漫画里聪明'\",\n        \"避免踩雷\": \"不要试图挽留她、不要问她'你什么时候走'、不要让她觉得你在可怜她\",\n        \"可触发事件\": \"【水中的倒影】：你注意到她水中倒影只有幻月没有她本人，但她没有解释，只是笑了笑，好感度+15\"\n      },\n      \"阶段六·至死不渝（96-100）\": {\n        \"状态\": \"她终于不再只用'观察员'的身份跟你说话。\",\n        \"核心目标\": \"让她知道，你记住的不是幻月游戏，是她\",\n        \"推荐行动\": \"在幻月游戏结束后，她站在秘庭的边缘。你说'下次幻月游戏，我还来'。她回头看你，呆毛翘了一下，说'……那你要快点，我的停留可只有刹那'\",\n        \"避免踩雷\": \"不要让她觉得你在承诺她做不到的事、不要在她转身时拉住她、不要说'别走'\",\n        \"可触发事件\": \"【刹那的约定】：你们约定下次幻月游戏再见，好感度+20\"\n      }\n    },\n    \"结局·刹那的宝藏\": {\n      \"触发条件\": \"好感度100 + 欢愉值100 + 完成阶段六所有事件\",\n      \"场景描述\": \"幻月游戏落幕，秘庭的光渐渐暗下来。绯英站在你面前，手里的尺刀收回了腰间，身后的粉毛狐狸虚影也在慢慢消散。她看着你，笑了一下，说'恭喜你发现宝藏，小浣熊'。你问她'你就是宝藏吗'。她歪了歪头，说'猜对啦——不过没有奖励'。然后她退后一步，身影开始变得透明。你说'下次见'。她说'下次见，大主角'。她的呆毛最后翘     function handleChatImageSelect(e) {
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 1024;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          pendingChatImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('img-preview-thumb').src = pendingChatImageBase64;
          document.getElementById('img-preview-bar').style.display = 'flex';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

【深度角色扮演执行准则】：
- 你的每一句回复都必须严格符合【${activeChat.name}】的性格语气、口吻习性以及和对方的关系。
- 在对话中，请主动展现人设中的脾气、习惯和情绪波动，不要像一个敷衍、礼貌问答的客服机器人！`;

        if (activeChat.online) {
          systemPrompt += `\n\n【模拟真实手机网络聊天模式（微信/QQ）规范】：
1. 你正在用手机打字和【${charConfig.userName || '用户'}】聊天。
2. 说话语气必须极为自然、接地气、极其口语化。严禁使用客服式回答，严禁总结套话！像真实好友打字一样聊天。
3. 严禁出现任何心理描写或括号动作（如“（笑）”、“（思考）”等）。
4. 可以把一句话拆分成 1~3 条短消息发送。多条消息之间【必须且只能用双竖线 "||" 分隔】（例如：在干嘛呢||怎么不理我）。
5. 表情包使用：仅在氛围合适时，偶尔在句尾附带表情包。格式如下（注意：依然严禁使用Emoji）：
   - [表情包:happy] (开心、喜悦、卖萌)
   - [表情包:sad] (难过、委屈)
   - [表情包:question] (疑问、好奇、困惑)
   - [表情包:speechless] (无语、震惊、吐槽)
   示例："好呀||那我们等会儿见||[表情包:happy]"`;
        } else {
          systemPrompt += `\n\n【标准沉浸对话/小说剧情模式规则】：
1. 始终以第一人称“我”进行沉浸互动。
2. 配合丰富的剧情、心理活动或动作描写，动作使用括号如“（...）”。
3. 绝对禁止输出“||”分隔符，绝对禁止使用表情包和Emoji。`;
        }

        if (activeChat.online) {
          if (revokedContent) {
            systemPrompt += `\n\n【突发事件：你刚刚撤回了一句话】：
你刚才向对方发送了：“${revokedContent}”，但你意识到不妥/打错字，于是撤回了。
请紧扣刚才撤回的内容，用符合你人设的方式打字输出 1~2 条解释、打错字矫正或掩饰消息，用 "||" 分隔。`;
          } else if (isRevokeContext) {
            systemPrompt += `\n\n【突发事件：对方撤回了消息】：
对方刚才撤回了一条消息！
请根据你的人设作出最自然的网络反应，输出 1~2 条短消息，用 "||" 分隔。`;
          }
        }
      }

      const validMessages = activeChat.messages.filter(m => !m.notice);
      const recentMessages = validMessages.slice(-10);

      const apiMessages = [
        { role: 'system', content: systemPrompt }
      ];

      recentMessages.forEach((m, idx) => {
        const role = m.user ? 'user' : 'assistant';
        const isLatestMsg = (idx === recentMessages.length - 1);

        if (m.isImage) {
          let imageContextText = m.text || "发送了一张图片";
          if (isLatestMsg && imageDescription) {
            imageContextText += `\n【系统预解析的图片内容描述：${imageDescription}】`;
          } else if (!m.text || m.text === "发送了一张图片") {
            imageContextText = "[图片]";
          }

          apiMessages.push({ role: role, content: imageContextText });
        } else if (m.isSticker) {
          apiMessages.push({ role: role, content: '[表情包]' });
        } else {
          apiMessages.push({ role: role, content: m.text });
        }
      });

      if (currentConfig && currentConfig.endpoint) {
        try {
          const res = await fetch(currentConfig.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentConfig.key}` },
            body: JSON.stringify({
              model: currentConfig.model,
              messages: apiMessages
            })
          });

          if (!res.ok) {
            console.warn(`接口响应异常，状态码: ${res.status}`);
            document.getElementById('chat-typing-status').style.display = 'none';
            if (res.status === 500) {
              alert('上游 AI 模型服务器繁忙/发生 500 错误，已为您切换为本地降级回复。请稍后重试。');
            }
            throw new Error(`HTTP Error: ${res.status}`);
          }

          const data = await res.json();
          if (data && data.choices && data.choices[0] && data.choices[0].message) {
            let reply = removeEmoji(data.choices[0].message.content);
            
            let rawArray = [];
            if (activeChat.online && activeChat.charId !== 'system_official_ai') {
              rawArray = reply.split(/\|+/).map(t => t.trim()).filter(Boolean);
              if(rawArray.length > 3) rawArray = rawArray.slice(0, 3);
            } else {
              rawArray = [reply.trim()];
            }
            
            processAndSendReplies(rawArray, !revokedContent);
            return;
          }
        } catch(e) {
          console.log("API 请求捕获异常，降级为本地逻辑:", e);
        }
      }

      let replies = [];
      if (activeChat.charId === 'system_official_ai') {
        replies = [ `已收到你的消息/图片。作为“流光 AI”，我正在为你梳理细节。请确保网络流畅以获得最佳视觉与逻辑解答效果！` ];
      } else if (activeChat.online && revokedContent) {
        replies = [ getPersonalitySelfRevokeText(charConfig, revokedContent) ];
      } else if (activeChat.online && isRevokeContext) {
        replies = [ getPersonalityRevokeText(charConfig) ];
      } else {
        replies = getPersonalityFallbackText(charConfig, promptText);
      }
      processAndSendReplies(replies, !revokedContent);
    }

    function getPersonalityFallbackText(char, promptText) {
      const p = char.persona || '';
      const t = (promptText || '').trim();

      if (!activeChat.online) {
        if(p.includes('傲娇')) {
          return [ `（瞥了你一眼，哼了一声）“你在做什么呢……突然这样。”\n（扭过头去，声音变小了些）“不过你要是真想让我看，我也不是不能理你。”` ];
        }
        if(p.includes('温柔')) {
          return [ `（温柔地看着你，轻声笑了笑了）“嗯？怎么啦，想分享什么给我吗？”\n（顺手给你倒了杯水）“没关系，你想说什么我都听着呢。”` ];
        }
        return [ `（认真听完你的话，思考了片刻）“我觉得你说的挺有道理的。”\n（抬起头看着你）“那接下来你打算怎么办？”` ];
      }

      if (t === '哪个？' || t === '什么？' || t === '哪个' || t.length <= 3) {
        if(p.includes('傲娇')) {
          return [ `还能有哪个啊？||你是不是没认真听我说话！||[表情包:speechless]` ];
        }
        if(p.includes('温柔')) {
          return [ `就是刚刚说的那件事呀~||你再想想？||[表情包:question]` ];
        }
        return [ `就刚刚说的呀。||你没看到吗？||[表情包:question]` ];
      }

      if(p.includes('傲娇')) {
        return [ `哈？你怎么突然发这个……||不过既然你都发了，那我就勉为其难看一眼吧。` ];
      }
      if(p.includes('温柔')) {
        return [ `嗯嗯，我在看呢~||感觉挺有意思的，然后呢？` ];
      }
      if(p.includes('冷漠') || p.includes('高冷')) {
        return [ `看到了。||你想表达什么？` ];
      }
      return [ `真的假的好突然||不过我觉得挺好的呀||你打算怎么搞？` ];
    }

    function getPersonalityRevokeText(char) {
      const p = char.persona || '';
      if(p.includes('傲娇')) {
        return `撤回干嘛？我刚才都已经看到了！||[表情包:speechless]`;
      }
      if(p.includes('温柔')) {
        return `怎么突然撤回啦？是不是打错字了？||[表情包:question]`;
      }
      return '发了什么东西？干嘛突然撤回。||[表情包:speechless]';
    }

    function getPersonalitySelfRevokeText(char, revokedText) {
      const p = char.persona || '';
      if(p.includes('傲娇')) {
        return `刚才打错字了！不许问！听到没有！||[表情包:speechless]`;
      }
      if(p.includes('温柔')) {
        return `哎呀…刚才手滑发错字了，抱歉呀。||[表情包:happy]`;
      }
      if(p.includes('冷漠') || p.includes('高冷')) {
        return `打错字了。`;
      }
      return `刚才点错了，咳。`;
    }

    function processAndSendReplies(replyArray, canRevoke = true) {
      const parsedList = [];
      const isOnline = activeChat.online;
      
      replyArray.forEach(item => {
        if(typeof item !== 'string') {
          parsedList.push(item);
          return;
        }

        let cleanText = removeEmoji(item).replace(/^\[?系统消息\]?[:：]?\s*/i, '').replace(/^.*?撤回了一条消息\s*/i, '');
        
        if (isOnline && activeChat.charId !== 'system_official_ai') {
          const stickerReg = /\[(?:表情|表情包)[:：]\s*([a-zA-Z]+)\s*\]|【(?:表情|表情包)[:：]\s*([a-zA-Z]+)\s*】/gi;
          let match;
          let lastIndex = 0;
          let foundSticker = false;
          
          while ((match = stickerReg.exec(cleanText)) !== null) {
            foundSticker = true;
            let textBefore = cleanText.substring(lastIndex, match.index).replace(/\|/g, '').trim();
            if (textBefore) {
              textBefore = textBefore.replace(/\[?表情包?\]?/g, '').trim();
              if(textBefore) parsedList.push(textBefore);
            }
            
            const category = (match[1] || match[2]).toLowerCase().trim();
            const stickerSrc = getRandomSticker(category);
            if (stickerSrc) {
              parsedList.push({ isSticker: true, text: stickerSrc });
            }
            lastIndex = stickerReg.lastIndex;
          }
          
          if (foundSticker) {
            let textAfter = cleanText.substring(lastIndex).replace(/\|/g, '').trim();
            textAfter = textAfter.replace(/\[?表情包?\]?/g, '').trim();
            if (textAfter) {
              parsedList.push(textAfter);
            }
          } else {
            let cleanItem = cleanText.replace(/\|/g, '').replace(/\[?表情包?\]?/g, '').trim();
            if(cleanItem) parsedList.push(cleanItem);
          }
        } else {
          let cleanItem = cleanText.replace(/\|/g, '').trim();
          if(cleanItem) parsedList.push(cleanItem);
        }
      });

      handleAIReplyOutput(parsedList, canRevoke);
    }

    function handleAIReplyOutput(replyArray, canRevoke = true) {
      document.getElementById('chat-typing-status').style.display = 'none';
      if(!activeChat || replyArray.length === 0) return;

      const shouldTriggerAIRevoke = activeChat.online && activeChat.charId !== 'system_official_ai' && canRevoke && (Math.random() < 0.25);

      replyArray.forEach((item, idx) => {
        setTimeout(() => {
          const aiMsgId = Date.now() + idx;
          let newMsg = (typeof item === 'object' && item.isSticker)
            ? { id: aiMsgId, text: item.text, user: false, isSticker: true }
            : { id: aiMsgId, text: removeEmoji(item), user: false };

          activeChat.messages.push(newMsg);
          renderMessages();
          saveStorage();

          if (idx === 0 && shouldTriggerAIRevoke) {
            setTimeout(() => {
              const targetMsgIndex = activeChat.messages.findIndex(m => m.id === aiMsgId);
              let revokedText = "";
              if (targetMsgIndex !== -1) {
                revokedText = activeChat.messages[targetMsgIndex].text || "";
                activeChat.messages.splice(targetMsgIndex, 1);
              }

              activeChat.messages.push({ notice: true, text: `"${activeChat.name}" 撤回了一条消息` });
              renderMessages();
              saveStorage();

              setTimeout(() => {
                document.getElementById('chat-typing-status').style.display = 'block';
                fetchAIResponse("", false, revokedText);
              }, 1200);
            }, 1200);
          }

        }, idx * 800);
      });
    }

    function sendContinue() {
      if(!activeChat || activeChat.online || activeChat.charId === 'system_official_ai') return;
      document.getElementById('chat-typing-status').innerText = '正在接续思考回答...';
      document.getElementById('chat-typing-status').style.display = 'block';
      setTimeout(() => {
        fetchAIResponse("请接续上一段未完的内容继续往下讲。", false);
      }, 1000);
    }

    function showBubbleMenu(msgId, isUser) {
      const msg = activeChat.messages.find(m => m.id === msgId);
      if(!msg || msg.notice) return;

      const itemsContainer = document.getElementById('popup-items');
      let html = '';
      if (!msg.isSticker && !msg.isImage) {
        html += `<div class="popup-item" onclick="addMemory('${activeChat.charId}', '${encodeURIComponent(msg.text)}')">记住这段对话</div>`;
        html += `<div class="popup-item" onclick="editMsg(${msgId})">编辑</div>`;
      }
      if(isUser) html += `<div class="popup-item" onclick="revokeMsg(${msgId})">撤回</div>`;

      itemsContainer.innerHTML = html;

    function addMemory(charId, encodedText) {
      closePopup();
      const text = decodeURIComponent(encodedText);
      const char = characters.find(c => c.id === charId);
      if(char) {
        if(!char.memories) char.memories = [];
        char.memories.push(text);
        saveStorage();
        alert('已存入 AI 强化记忆库！');
      }
    }

    function openMemoryManager(charId) {
      const char = characters.find(c => c.id === charId);
      if(!char) return;
      if(!char.memories) char.memories = [];

      const itemsContainer = document.getElementById('popup-items');
      let html = `<div style="padding:18px 22px; font-weight:bold; border-bottom:1px solid var(--border-color); background:var(--primary-light); color:var(--primary);">${char.name} 的强化记忆库</div>`;
      
      if(!char.memories.length) {
        html += `<div style="padding:24px; font-size:16px; color:var(--text-sub); text-align:center;">暂无记忆条目。长按文本气泡可添加记忆。</div>`;
      } else {
        html += `<div style="max-height:300px; overflow-y:auto;">` + char.memories.map((m, idx) => `
          <div style="padding:16px 22px; border-bottom:1px solid var(--border-color); font-size:16px; display:flex; justify-content:space-between; align-items:center;">
            <span style="flex:1; margin-right:12px; word-break:break-all;">${escapeHtml(m)}</span>
            <span style="color:var(--primary); cursor:pointer; margin-right:12px;" onclick="editMemory('${charId}', ${idx})">编辑</span>
            <span style="color:#ef4444; cursor:pointer;" onclick="deleteMemory('${charId}', ${idx})">删除</span>
          </div>
        `).join('') + `</div>`;
      }
      
      html += `<div class="popup-item" style="text-align:center; color:var(--text-sub);" onclick="closePopup()">关闭</div>`;
      itemsContainer.innerHTML = html;
      document.getElementById('popup-menu').style.display = 'flex';
    }

    function editMemory(charId, idx) {
      const char = characters.find(c => c.id === charId);
      const oldM = char.memories[idx];
      const newM = prompt('修改记忆条目：', oldM);
      if(newM && newM.trim()) {
        char.memories[idx] = newM.trim();
        saveStorage();
        openMemoryManager(charId);
      }
    }

    function deleteMemory(charId, idx) {
      const char = characters.find(c => c.id === charId);
      char.memories.splice(idx, 1);
      saveStorage();
      openMemoryManager(charId);
    }

    function revokeMsg(msgId) {
      closePopup();
      activeChat.messages = activeChat.messages.filter(m => m.id !== msgId);
      activeChat.messages.push({ notice: true, text: '你撤回了一条消息' });
      renderMessages();
      saveStorage();

      if(pendingTimer) {
        clearTimeout(pendingTimer);
        pendingTimer = null;
        document.getElementById('chat-typing-status').style.display = 'none';
      }
      
      document.getElementById('chat-typing-status').style.display = 'block';
      setTimeout(() => { fetchAIResponse("", true); }, 1200);
    }

      const msg = activeChat.messages.find(m => m.id === msgId);
      const newT = prompt('编辑气泡文本', msg.text);
      if(newT) { msg.text = newT; renderMessages(); saveStorage(); }

    function deleteMsg(msgId) {

    function saveCharacter() {
      const editId = document.getElementById('c-edit-id').value;
      const name = document.getElementById('c-name').value.trim();
      const userName = document.getElementById('c-user-name').value.trim();
      const desc = document.getElementById('c-desc').value.trim();
      const persona = document.getElementById('c-persona').value.trim();
      const relation = document.getElementById('c-relation').value.trim();
      const worldview = document.getElementById('c-worldview').value.trim();
      const gender = document.getElementById('c-gender').value;
      const userGender = document.getElementById('c-user-gender').value;
      const online = document.getElementById('c-online').checked;

      if(!name) return alert('请填写角色名字！');

      if(editId) {
        const char = characters.find(c => c.id === editId);
        if(char) {
          char.name = name;
          char.userName = userName;
          char.desc = desc;
          char.persona = persona;
          char.relation = relation;
          char.worldview = worldview;
          char.gender = gender;
          char.userGender = userGender;
          char.online = online;
          if(tempCharAvatarData) char.avatar = tempCharAvatarData;
        }
        const chat = chats.find(c => c.charId === editId);
        if(chat) {
          chat.name = name;
          chat.online = online;
          if(tempCharAvatarData) chat.avatar = tempCharAvatarData;
        }
      } else {
        const newChar = {
          id: 'char_' + Date.now(),
          name, userName, desc, persona, relation, worldview, gender, userGender, online,
          avatar: tempCharAvatarData,
          isSystem: false,
          memories: []
        };
        characters.push(newChar);
      }

      resetCharForm();
      renderHall();
      renderChats();
      saveStorage();
      switchTab('hall', document.querySelectorAll('.nav-item')[1]);
    }

    function resetCharForm() {
      document.getElementById('c-edit-id').value = '';
      document.getElementById('c-name').value = '';
      document.getElementById('c-user-name').value = '';
      document.getElementById('c-desc').value = '';
      document.getElementById('c-persona').value = '';
      document.getElementById('c-relation').value = '';
      document.getElementById('c-worldview').value = '';
      document.getElementById('c-online').checked = true;
      tempCharAvatarData = '';
      document.getElementById('c-avatar-preview').innerHTML = 'AI';
      document.getElementById('btn-save-char').innerText = '创建角色';
    }

    function toggleTheme(val) {
      if(val === 'dark') {
        document.body.classList.add('dark-theme');
      } else {
        document.body.classList.remove('dark-theme');
      }
      apiConfig.theme = val;
      saveStorage();
    }

    function adjustFontSize(val) {
      document.documentElement.style.setProperty('--base-font-size', val);
      apiConfig.fontSize = val;
      saveStorage();
    }

    function adjustWidth(val) {
      document.getElementById('app').style.maxWidth = val;
      apiConfig.screenWidth = val;
      saveStorage();
    }

    function saveSettings() {
      saveStorage();
      alert('全套设置保存成功！');
    }

    function closePopup() {
      document.getElementById('popup-menu').style.display = 'none';
    }

    function showSponsorOptions() {
      const modal = document.getElementById('sponsor-modal');
      const img = document.getElementById('sponsor-img');
      img.src = './zanzhu.png';
      modal.style.display = 'flex';
    }

    function closeSponsorModal() {
      document.getElementById('sponsor-modal').style.display = 'none';
    }

    /* 图片裁剪相关逻辑 */
    let cropperImg = new Image();
    let cropScale = 1;
    let cropX = 0, cropY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;

    function triggerCrop(target) {
      currentCropTarget = target;
      document.getElementById('file-input').click();
    }

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        cropperImg = new Image();
        cropperImg.onload = () => {
          cropScale = 1;
          cropX = 0;
          cropY = 0;
          drawCrop();
          document.getElementById('cropper-modal').style.display = 'flex';
        };
        cropperImg.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function drawCrop() {
      const canvas = document.getElementById('crop-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 320;
      canvas.height = 320;

      ctx.clearRect(0, 0, 320, 320);
      ctx.save();
      ctx.translate(320 / 2 + cropX, 320 / 2 + cropY);
      ctx.scale(cropScale, cropScale);

      const mw = cropperImg.width;
      const mh = cropperImg.height;
      const ratio = Math.max(320 / mw, 320 / mh);
      const dw = mw * ratio;
      const dh = mh * ratio;

      ctx.drawImage(cropperImg, -dw / 2, -dh / 2, dw, dh);
      ctx.restore();
    }

    const cropBox = document.getElementById('crop-box');
    cropBox.addEventListener('pointerdown', (e) => {
      isDragging = true;
      startX = e.clientX - cropX;
      startY = e.clientY - cropY;
    });

    window.addEventListener('pointermove', (e) => {
      if(!isDragging) return;
      cropX = e.clientX - startX;
      cropY = e.clientY - startY;
      drawCrop();
    });

    window.addEventListener('pointerup', () => { isDragging = false; });

    cropBox.addEventListener('wheel', (e) => {
      e.preventDefault();
      if(e.deltaY < 0) cropScale *= 1.05;
      else cropScale /= 1.05;
      cropScale = Math.max(0.5, Math.min(cropScale, 3));
      drawCrop();
    }, { passive: false });

    function closeCropper() {
      document.getElementById('cropper-modal').style.display = 'none';
    }

    function confirmCrop() {
      const canvas = document.getElementById('crop-canvas');
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);

      if (currentCropTarget === 'user') {
        userAvatarData = dataUrl;
        document.getElementById('user-avatar-preview').innerHTML = `<img src="${userAvatarData}">`;
      } else if (currentCropTarget === 'char') {
        tempCharAvatarData = dataUrl;
        document.getElementById('c-avatar-preview').innerHTML = `<img src="${tempCharAvatarData}">`;
      }

      saveStorage();
      closeCropper();
    }

    /* 滚动条滑动逻辑 */
    function initScrollDragEvents() {
      const container = document.getElementById('msg-container');
      const bar = document.getElementById('scroll-bar');
      const thumb = document.getElementById('scroll-thumb');

      container.addEventListener('scroll', updateScrollThumb);

      let isThumbDragging = false;
      let startMouseY = 0;
      let startTop = 0;

      thumb.addEventListener('pointerdown', (e) => {
        isThumbDragging = true;
        startMouseY = e.clientY;
        startTop = parseFloat(thumb.style.top || 0);
        thumb.setPointerCapture(e.pointerId);
      });

      thumb.addEventListener('pointermove', (e) => {
        if(!isThumbDragging) return;
        const deltaY = e.clientY - startMouseY;
        const maxThumbTop = bar.clientHeight - thumb.clientHeight;
        let newTop = Math.max(0, Math.min(maxThumbTop, startTop + deltaY));
        
        thumb.style.top = newTop + 'px';
        const scrollRatio = newTop / maxThumbTop;
        container.scrollTop = scrollRatio * (container.scrollHeight - container.clientHeight);
      });

      thumb.addEventListener('pointerup', (e) => {
        isThumbDragging = false;
        try { thumb.releasePointerCapture(e.pointerId); } catch(err){}
      });
    }

    function updateScrollThumb() {
      const container = document.getElementById('msg-container');
      const bar = document.getElementById('scroll-bar');
      const thumb = document.getElementById('scroll-thumb');

      const scrollHeight = container.scrollHeight;
      const clientHeight = container.clientHeight;

      if(scrollHeight <= clientHeight) {
        thumb.style.height = '100%';
        thumb.style.top = '0px';
        return;
      }

      const thumbHeight = Math.max(30, (clientHeight / scrollHeight) * bar.clientHeight);
      thumb.style.height = thumbHeight + 'px';

      const maxThumbTop = bar.clientHeight - thumbHeight;
      const scrollRatio = container.scrollTop / (scrollHeight - clientHeight);
      thumb.style.top = (scrollRatio * maxThumbTop) + 'px';
    }

    /* 数据导出与恢复 */
    function exportData() {
      const exportObject = {
        characters,
        chats,
        userAvatarData,
        apiConfig,
        appUserData: JSON.parse(localStorage.getItem('appUserData') || '{}'),
        allModelUsageData: getModelUsageData()
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `流光AI_备份数据_${getTodayString()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(e) {
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imported = JSON.parse(evt.target.result);
          if (imported.characters) localStorage.setItem('characters', JSON.stringify(imported.characters));
          if (imported.chats) localStorage.setItem('chats', JSON.stringify(imported.chats));
          if (imported.userAvatarData) localStorage.setItem('userAvatarData', imported.userAvatarData);
          if (imported.apiConfig) localStorage.setItem('apiConfig', JSON.stringify(imported.apiConfig));
          if (imported.appUserData) localStorage.setItem('appUserData', JSON.stringify(imported.appUserData));
          if (imported.allModelUsageData) localStorage.setItem('allModelUsageData', JSON.stringify(imported.allModelUsageData));

          alert('数据恢复成功！即刻刷新页面生效。');
          location.reload();
        } catch(err) {
          alert('数据文件解析失败，请检查文件格式！');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }
  </script>
