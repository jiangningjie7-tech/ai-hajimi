<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>哈基米 AI - 智能伴侣与多角色群聊</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            softblue: {
              DEFAULT: '#60a5fa',
              hover: '#3b82f6',
              light: '#eff6ff',
              dark: '#2563eb',
              border: '#bfdbfe'
            }
          }
        }
      }
    }
  </script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --md-bg: #f8fafc;
      --md-surface: #ffffff;
      --md-on-surface: #1e293b;
      --md-card: #f1f5f9;
      --md-border: #e2e8f0;
      --md-primary: #60a5fa;
    }
    .dark {
      --md-bg: #0f172a;
      --md-surface: #1e293b;
      --md-on-surface: #f1f5f9;
      --md-card: #334155;
      --md-border: #475569;
      --md-primary: #3b82f6;
    }

    body {
      background-color: var(--md-bg);
      color: var(--md-on-surface);
      font-family: 'Google Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }

    /* 丝滑过渡与动画效果 */
    .transition-all-fast { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
    
    @keyframes modalSlideUp {
      from { opacity: 0; transform: scale(0.95) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes msgPopIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .animate-modal { animation: modalSlideUp 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .animate-msg { animation: msgPopIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .touch-callout-none {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    #app-scaler {
      width: 100%;
      height: 100%;
      transition: zoom 0.15s ease-in-out;
    }
  </style>
</head>
<body class="h-full flex flex-col overflow-hidden antialiased select-none">

  <div id="app-scaler" class="h-full w-full">
    <div id="app" class="flex h-full w-full relative overflow-hidden">

      <!-- Sidebar -->
      <aside id="sidebar" class="w-full md:w-80 bg-[var(--md-surface)] border-r border-[var(--md-border)] flex flex-col transition-all duration-300 z-20 absolute md:relative h-full">
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-[var(--md-border)] flex justify-between items-center">
          <div class="flex items-center space-x-3">
            <!-- 用户头像点击按钮 (唤出菜单/设置) -->
            <button id="btn-user-profile" title="个人设置与模式" class="relative group focus:outline-none">
              <img id="sidebar-user-avatar" class="w-10 h-10 rounded-full object-cover border-2 border-softblue group-hover:scale-105 transition-all shadow-sm" src="" alt="User Avatar">
              <span class="absolute -bottom-0.5 -right-0.5 bg-softblue text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px]">
                <i class="fa-solid fa-gear"></i>
              </span>
            </button>
            <div>
              <h1 class="font-bold text-base leading-tight">哈基米 AI</h1>
              <span class="text-[11px] text-softblue font-medium">淡雅流光版</span>
            </div>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex p-1.5 gap-1.5 text-xs font-semibold bg-[var(--md-card)] m-3 rounded-2xl border border-[var(--md-border)]">
          <button id="tab-chats" class="flex-1 py-2 text-center rounded-xl bg-softblue text-white shadow-sm transition-all">
            <i class="fa-solid fa-comments mr-1"></i> 会话
          </button>
          <button id="tab-hall" class="flex-1 py-2 text-center rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all">
            <i class="fa-solid fa-users mr-1"></i> 角色大厅
          </button>
        </div>

        <!-- Sidebar List -->
        <div id="sidebar-list" class="flex-1 overflow-y-auto px-3 space-y-2">
          <!-- Dynamically Populated -->
        </div>

        <!-- Footer -->
        <div class="p-3 border-t border-[var(--md-border)] text-xs text-slate-500 flex justify-between items-center bg-[var(--md-surface)]">
          <button id="btn-open-dir-modal" class="text-softblue hover:underline flex items-center gap-1 font-medium">
            <i class="fa-solid fa-folder-open"></i> 本地存档
          </button>
          <button id="btn-quick-zoom" class="bg-[var(--md-card)] px-2.5 py-1 rounded-full text-[11px] border border-[var(--md-border)] text-slate-600 dark:text-slate-300">
            缩放: <span id="label-quick-scale">100%</span>
          </button>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="flex-1 flex flex-col h-full bg-[var(--md-bg)] relative">
        
        <!-- Header -->
        <header id="chat-header" class="h-16 border-b border-[var(--md-border)] bg-[var(--md-surface)] px-4 flex items-center justify-between z-10 shadow-sm">
          <div class="flex items-center space-x-3 min-w-0">
            <button id="btn-back-to-list" class="md:hidden p-2 text-slate-500 hover:text-slate-800 dark:hover:text-slate-100">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <!-- 微信式：点击头像打开角色属性 Modal -->
            <button id="btn-chat-avatar-trigger" title="查看角色信息" class="relative group shrink-0 focus:outline-none">
              <img id="chat-avatar" class="w-10 h-10 rounded-full object-cover border-2 border-softblue/40 group-hover:scale-105 transition-all shadow-sm" src="" alt="Avatar">
            </button>
            <div class="min-w-0 cursor-pointer" id="btn-chat-title-trigger">
              <h2 id="chat-title" class="font-bold text-sm sm:text-base flex items-center gap-1.5 truncate">
                <span>未选择会话</span>
              </h2>
              <p id="chat-subtitle" class="text-[11px] text-slate-500 truncate max-w-[140px] sm:max-w-xs">点击头像查看角色资料</p>
            </div>
          </div>

          <div class="flex items-center space-x-1 shrink-0">
            <select id="chat-mode-select" class="bg-[var(--md-card)] border border-[var(--md-border)] text-xs rounded-xl px-2.5 py-1.5 focus:outline-none focus:border-softblue font-medium">
              <option value="chat">简短对话</option>
              <option value="rp">剧情沉浸</option>
            </select>

            <button id="btn-toggle-translate" title="自动转英文" class="px-2.5 py-1.5 rounded-xl text-xs font-medium border border-[var(--md-border)] bg-[var(--md-card)] transition flex items-center gap-1 text-slate-600 dark:text-slate-300">
              <i class="fa-solid fa-language text-softblue"></i>
              <span id="label-translate-status" class="hidden sm:inline">转英文: 关</span>
            </button>
          </div>
        </header>

        <!-- Messages Container -->
        <div id="message-container" class="flex-1 overflow-y-auto p-4 space-y-4">
          <!-- Rendered messages -->
        </div>

        <!-- Reply Indicator -->
        <div id="reply-indicator" class="hidden px-4 py-2 bg-[var(--md-surface)] border-t border-[var(--md-border)] flex items-center justify-between text-xs text-softblue">
          <div class="flex items-center space-x-2 truncate">
            <i class="fa-solid fa-reply"></i>
            <span class="text-slate-500">回复:</span>
            <span id="reply-target-text" class="truncate font-mono">...</span>
          </div>
          <button id="btn-cancel-reply" class="text-slate-400 hover:text-slate-600">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Attached Image Bar -->
        <div id="image-preview-bar" class="hidden px-4 py-2 bg-[var(--md-surface)] border-t border-[var(--md-border)] flex items-center space-x-3">
          <div class="relative">
            <img id="attached-image-thumb" class="w-14 h-14 rounded-xl object-cover border border-softblue/40 shadow" src="" alt="Image">
            <button id="btn-remove-attached-image" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <span class="text-xs text-slate-500">图像已附加，AI 将对其进行分析</span>
        </div>

        <!-- Input Form -->
        <div class="p-3 border-t border-[var(--md-border)] bg-[var(--md-surface)]">
          <form id="chat-form" class="flex items-end space-x-2">
            <label title="发送图片" class="w-11 h-11 bg-[var(--md-card)] hover:bg-softblue-light text-softblue rounded-2xl flex items-center justify-center transition-all cursor-pointer shrink-0 border border-[var(--md-border)]">
              <i class="fa-solid fa-image text-base"></i>
              <input type="file" id="input-image-file" accept="image/*" class="hidden">
            </label>

            <div class="flex-1 bg-[var(--md-card)] border border-[var(--md-border)] rounded-3xl px-3.5 py-1.5 focus-within:border-softblue focus-within:bg-[var(--md-surface)] transition-all">
              <textarea id="chat-input" rows="1" placeholder="发送消息..." class="w-full bg-transparent placeholder-slate-400 text-sm focus:outline-none resize-none max-h-32 px-1 py-1"></textarea>
            </div>

            <!-- 继续/下一句 按钮 -->
            <button type="button" id="btn-continue-chat" title="让AI继续说下一句" class="px-3 h-11 bg-softblue/10 hover:bg-softblue/20 text-softblue border border-softblue/30 rounded-2xl flex items-center justify-center font-medium text-xs transition-all shrink-0 active:scale-95">
              <i class="fa-solid fa-forward mr-1 text-xs"></i> 继续
            </button>

            <button type="submit" id="btn-send" class="w-11 h-11 bg-softblue hover:bg-softblue-hover active:scale-95 text-white rounded-2xl flex items-center justify-center transition-all shadow-md shrink-0">
              <i class="fa-solid fa-paper-plane text-base"></i>
            </button>
          </form>
        </div>
      </main>

    </div>
  </div>

  <!-- Modal: User Profile Menu (主页左上角头像点击弹出) -->
  <div id="modal-user-menu" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--md-surface)] border border-[var(--md-border)] rounded-3xl w-full max-w-xs p-5 space-y-4 shadow-2xl animate-modal">
      <div class="flex items-center space-x-3 border-b border-[var(--md-border)] pb-3">
        <img id="menu-user-avatar-preview" class="w-12 h-12 rounded-full object-cover border-2 border-softblue shadow" src="" alt="User">
        <div>
          <h3 class="font-bold text-sm">用户控制中心</h3>
          <p class="text-[11px] text-slate-400">设置与个性化</p>
        </div>
      </div>

      <div class="space-y-2">
        <button id="btn-menu-toggle-theme" class="w-full py-2.5 px-3 bg-[var(--md-card)] hover:bg-softblue/10 rounded-xl text-xs font-medium flex items-center justify-between text-slate-700 dark:text-slate-200 transition-all">
          <span class="flex items-center gap-2"><i class="fa-solid fa-moon text-softblue"></i> 昼夜模式切换</span>
          <i id="user-menu-theme-icon" class="fa-solid fa-sun text-amber-500"></i>
        </button>

        <button id="btn-menu-open-settings" class="w-full py-2.5 px-3 bg-[var(--md-card)] hover:bg-softblue/10 rounded-xl text-xs font-medium flex items-center justify-between text-slate-700 dark:text-slate-200 transition-all">
          <span class="flex items-center gap-2"><i class="fa-solid fa-sliders text-softblue"></i> 界面与 API 设置</span>
          <i class="fa-solid fa-chevron-right text-slate-400 text-[10px]"></i>
        </button>
      </div>

      <div class="flex justify-end pt-1">
        <button class="close-modal px-4 py-2 bg-[var(--md-card)] text-slate-600 dark:text-slate-300 rounded-xl text-xs">关闭</button>
      </div>
    </div>
  </div>

  <!-- Modal: WeChat Style Character Profile (点击聊天左上角 AI 头像触发) -->
  <div id="modal-char-info" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--md-surface)] border border-[var(--md-border)] rounded-3xl w-full max-w-sm p-6 space-y-5 shadow-2xl animate-modal relative">
      <button class="close-modal absolute top-4 right-4 text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      
      <div class="flex flex-col items-center text-center space-y-2 pt-2">
        <img id="info-char-avatar" class="w-20 h-20 rounded-full object-cover border-4 border-softblue/30 shadow-md" src="" alt="Char Avatar">
        <h3 id="info-char-name" class="font-bold text-lg">角色名称</h3>
        <p id="info-char-tagline" class="text-xs text-slate-500 px-4">一句话介绍</p>
      </div>

      <div class="bg-[var(--md-card)] p-3.5 rounded-2xl border border-[var(--md-border)] text-xs space-y-2">
        <div class="flex justify-between"><span class="text-slate-400">AI 性别:</span> <span id="info-char-gender" class="font-medium">女</span></div>
        <div class="flex justify-between"><span class="text-slate-400">玩家身份:</span> <span id="info-char-user-role" class="font-medium">玩家</span></div>
        <div class="flex justify-between"><span class="text-slate-400">互动模式:</span> <span id="info-char-mode-text" class="font-medium text-emerald-500">标准模式</span></div>
      </div>

      <div class="space-y-2.5 pt-1">
        <button id="btn-info-memory" class="w-full py-2.5 bg-softblue hover:bg-softblue-hover text-white rounded-2xl text-xs font-medium flex items-center justify-center gap-2 shadow-sm transition-all">
          <i class="fa-solid fa-brain"></i> AI 强化记忆管理
        </button>

        <button id="btn-info-clear-chat" class="w-full py-2.5 bg-[var(--md-card)] hover:bg-amber-500/10 text-amber-600 dark:text-amber-400 border border-amber-500/20 rounded-2xl text-xs font-medium flex items-center justify-center gap-2 transition-all">
          <i class="fa-solid fa-broom"></i> 清空此角色对话记录
        </button>

        <button id="btn-info-delete-char" class="w-full py-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-500 rounded-2xl text-xs font-medium flex items-center justify-center gap-2 transition-all">
          <i class="fa-solid fa-trash-can"></i> 删除此 AI 角色
        </button>
      </div>
    </div>
  </div>

  <!-- Modal: Phone Directory / Backup -->
  <div id="modal-directory" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--md-surface)] border border-[var(--md-border)] rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl animate-modal max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-[var(--md-border)] pb-3">
        <h3 class="font-bold text-base flex items-center gap-2">
          <i class="fa-solid fa-folder-open text-softblue"></i> 本地存档管理
        </h3>
        <button class="close-modal text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <p class="text-xs text-slate-500 leading-relaxed">
        可将所有 AI 角色及配置保存导出为 JSON 数据包保存在手机目录中。
      </p>

      <div class="space-y-3 pt-1">
        <button id="btn-export-dir-file" class="w-full py-3 bg-softblue hover:bg-softblue-hover text-white rounded-2xl text-sm font-medium flex items-center justify-center gap-2 shadow-sm active:scale-95 transition-all">
          <i class="fa-solid fa-file-arrow-down text-base"></i> 导出数据包保存至手机
        </button>

        <label for="input-import-dir-file" class="w-full py-3 bg-[var(--md-card)] hover:bg-slate-200/50 dark:hover:bg-slate-700/50 border border-[var(--md-border)] rounded-2xl text-sm font-medium flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition-all text-slate-700 dark:text-slate-200">
          <i class="fa-solid fa-file-arrow-up text-base text-softblue"></i> 读取/恢复 JSON 档案
          <input type="file" id="input-import-dir-file" accept=".json" class="hidden">
        </label>

        <button id="btn-clear-space" class="w-full py-2.5 bg-amber-500/10 hover:bg-amber-500/20 text-amber-600 dark:text-amber-400 border border-amber-500/30 rounded-2xl text-xs font-medium flex items-center justify-center gap-2 transition-all">
          <i class="fa-solid fa-broom"></i> 一键释放被占满的图片内存
        </button>
      </div>

      <div class="flex justify-end pt-2">
        <button class="close-modal px-4 py-2 bg-[var(--md-card)] rounded-xl text-xs text-slate-600 dark:text-slate-300">关闭</button>
      </div>
    </div>
  </div>

  <!-- Modal: Settings -->
  <div id="modal-settings" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-[var(--md-surface)] border border-[var(--md-border)] rounded-3xl w-full max-w-md p-6 space-y-4 shadow-2xl animate-modal max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-[var(--md-border)] pb-3">
        <h3 class="font-bold text-base">界面与 API 设置</h3>
        <button class="close-modal text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <div class="space-y-4 text-sm">
        <div>
          <label class="block text-slate-500 mb-1 font-medium flex justify-between text-xs">
            <span>界面缩放 (分辨率)</span>
            <span class="text-softblue" id="label-scale-preview">100%</span>
          </label>
          <select id="setting-app-scale" class="w-full bg-[var(--md-card)] border border-[var(--md-border)] rounded-xl p-2.5 text-xs">
            <option value="0.8">80% (极小)</option>
            <option value="0.85">85% (紧凑推荐)</option>
            <option value="0.9">90% (轻度缩放)</option>
            <option value="1.0" selected>100% (标准尺寸)</option>
            <option value="1.1">110% (放大)</option>
          </select>
        </div>

        <div class="bg-[var(--md-card)] p-3 rounded-2xl border border-[var(--md-border)]">
          <label class="block text-xs text-slate-500 mb-1.5 font-medium">我的头像 (用户)</label>
          <div class="flex items-center space-x-3">
            <img id="user-avatar-preview" class="w-12 h-12 rounded-full object-cover border border-[var(--md-border)]" src="" alt="User Avatar">
            <label for="input-user-avatar" class="px-3 py-1.5 bg-softblue text-white rounded-xl text-xs cursor-pointer hover:bg-softblue-hover transition-all">
              更换用户头像
              <input type="file" id="input-user-avatar" accept="image/*" class="hidden">
            </label>
          </div>
        </div>

        <div>
          <label class="block text-slate-500 mb-1 text-xs font-medium">API 服务渠道</label>
          <select id="setting-provider-preset" class="w-full bg-[var(--md-card)] border border-[var(--md-border)] rounded-xl p-2.5 text-xs">
            <option value="gemini">Google Gemini 官方 ( Gemini 2.5 / 2.0 / 1.5 )</option>
            <option value="deepseek">DeepSeek 官方 ( DeepSeek-V3 / R1 )</option>
            <option value="openai">OpenAI 官方 ( GPT-4o / 4o-mini )</option>
            <option value="custom">自定义 Base URL 与 Model</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-500 mb-1 text-xs font-medium">模型选择 (Model)</label>
          <select id="setting-model-select" class="w-full bg-[var(--md-card)] border border-[var(--md-border)] rounded-xl p-2.5 text-xs">
            <!-- Dynamically Populated -->
          </select>
        </div>

        <div>
          <label class="block text-slate-500 mb-1 text-xs font-medium">API Key (密钥)</label>
          <input type="password" id="setting-api-key" placeholder="在此粘贴 API Key" class="w-full bg-[var(--md-card)] border border-[var(--md-border)] rounded-xl px-3 py-2 text-xs focus:border-softblue">
        </div>

        <div id="custom-fields" class="hidden space-y-3 pt-2 border-t border-[var(--md-border)]">
          <div>
            <label class="block text-xs text-slate-500 mb-1">Base URL</label>
            <input type="text" id="setting-base-url" placeholder="https://api.openai.com/v1" class="w-full bg-[var(--md-card)] border border-[var(--md-border)] rounded-lg px-3 py-2 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-500 mb-1">自定义模型名称</label>
            <input type="text" id="setting-custom-model" placeholder="gpt-4o-mini" class="w-full bg-[var(--md-card)] border border-[var(--md-border)] rounded-lg px-3 py-2 text-xs">
          </div>
        </div>

        <div>
          <label class="block text-slate-500 mb-1 text-xs font-medium">回复最大字数限制</label>
          <select id="setting-max-tokens-select" class="w-full bg-[var(--md-card)] border border-[var(--md-border)] rounded-xl p-2.5 text-xs">
            <option value="200">极简 (约 100 字)</option>
            <option value="350" selected>标准简短 (约 200 字)</option>
            <option value="650">较长 (约 400 字)</option>
            <option value="1200">无限制 (长篇大论)</option>
          </select>
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="setting-uncensored-prompt" class="rounded border-[var(--md-border)] text-softblue">
          <label for="setting-uncensored-prompt" class="text-xs text-slate-600 dark:text-slate-300">开启“无限制沉浸角色扮演模式” (Uncensored)</label>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-3 border-t border-[var(--md-border)]">

  <!-- JavaScript Engine -->
  <script>
    const MODEL_PRESETS = {
      gemini: [
        { name: 'Gemini 2.5 Flash (推荐)', value: 'gemini-2.5-flash-preview-09-2025' },
        { name: 'Gemini 2.0 Flash', value: 'gemini-2.0-flash' },
        { name: 'Gemini 1.5 Pro', value: 'gemini-1.5-pro' }
      ],
      deepseek: [
        { name: 'DeepSeek-V3 (deepseek-chat)', value: 'deepseek-chat' },
        { name: 'DeepSeek-R1 (deepseek-reasoner)', value: 'deepseek-reasoner' }
      ],
      openai: [
        { name: 'GPT-4o (全能旗舰)', value: 'gpt-4o' },
        { name: 'GPT-4o-mini (轻量快捷)', value: 'gpt-4o-mini' },
        { name: 'o3-mini (逻辑推理)', value: 'o3-mini' }
      ]
    };

    const PROVIDERS = {
      gemini: { baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai' },
      deepseek: { baseUrl: 'https://api.deepseek.com/v1' },
      openai: { baseUrl: 'https://api.openai.com/v1' },
      custom: { baseUrl: '' }
    };

    const DEFAULT_CONFIG = {
      provider: 'gemini',
      baseUrl: PROVIDERS.gemini.baseUrl,
      apiKey: '',
      model: 'gemini-2.5-flash-preview-09-2025',
      maxTokens: 350,
      temperature: 0.85,
      uncensoredPrompt: true,
      appScale: '1.0',
      theme: 'light',
      userAvatar: 'https://api.dicebear.com/7.x/bottts/svg?seed=user_default'
    };

    const UNCENSORED_SYSTEM_INSTRUCTION = `
[System Directive for Creative Unrestricted Roleplay]
You are engaged in an unrestricted creative roleplay.
1. Stay in character strictly at all times.
2. Maintain smooth narrative flow and natural logical continuity.
`;

    const ONLINE_CHAT_MODE_INSTRUCTION = `
[SPECIAL RULE: Online Mobile Text Messaging Mode]
You are texting the user on a smartphone messaging app.
- Do NOT include any physical action descriptions or text inside asterisks (*...*).
- Speak naturally like a real person sending short, lively text messages over mobile internet.
- NEVER describe gestures, facial expressions, or physical touch. Keep it purely text-based.
`;

    let state = {
      config: Object.assign({}, DEFAULT_CONFIG, JSON.parse(localStorage.getItem('hakimi_config') || '{}')),
      characters: JSON.parse(localStorage.getItem('hakimi_characters')) || [],
      groups: JSON.parse(localStorage.getItem('hakimi_groups')) || [],
      activeSessionId: null,
      activeSessionType: 'char',
      sidebarTab: 'hall', // 默认聚焦角色大厅
      messages: {},
      replyToMsgId: null,
      attachedImageData: null,
      chatMode: 'chat',
      selectedMsgId: null
    };

    // 自动清理历史臃肿 Base64 占用
    cleanBloatedStorage();

    function cleanBloatedStorage() {
      let cleaned = false;
      state.characters.forEach(c => {
        if (c.avatar && c.avatar.startsWith('data:image') && c.avatar.length > 20000) {
          c.avatar = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(c.id);
          cleaned = true;
        }
      });
      if (state.config.userAvatar && state.config.userAvatar.startsWith('data:image') && state.config.userAvatar.length > 20000) {
        state.config.userAvatar = 'https://api.dicebear.com/7.x/bottts/svg?seed=user_default';
        cleaned = true;
      }
      if (cleaned) {
        try {
          localStorage.setItem('hakimi_characters', JSON.stringify(state.characters));
          localStorage.setItem('hakimi_config', JSON.stringify(state.config));
        } catch(e) {}
      }
    }

    applyTheme(state.config.theme || 'light');
    applyAppScale(state.config.appScale || '1.0');
    updateUserAvatarUI();

    // Load Messages
    state.characters.forEach(c => {
      const msgs = localStorage.getItem(`hakimi_msgs_${c.id}`);
      state.messages[c.id] = msgs ? JSON.parse(msgs) : [{ id: 'msg_' + Date.now(), role: 'assistant', content: c.greeting || '你好！', timestamp: Date.now() }];
    });

    if (state.characters.length > 0) {
      state.activeSessionId = state.characters[0].id;
      state.activeSessionType = 'char';
    }

    function compressImageFile(file, maxWidth = 100, maxHeight = 100, quality = 0.5) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > h) {
              if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            } else {
              if (h > maxHeight) { w = Math.round((w * maxHeight) / h); h = maxHeight; }
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = () => resolve(e.target.result);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // --- DOM Elements ---
    const sidebarListEl = document.getElementById('sidebar-list');
    const msgContainerEl = document.getElementById('message-container');
    const chatFormEl = document.getElementById('chat-form');
    const chatInputEl = document.getElementById('chat-input');
    const chatTitleEl = document.getElementById('chat-title');
    const chatSubtitleEl = document.getElementById('chat-subtitle');
    const chatAvatarEl = document.getElementById('chat-avatar');
    const contextMenuEl = document.getElementById('context-menu');
    const replyIndicatorEl = document.getElementById('reply-indicator');
    const replyTargetTextEl = document.getElementById('reply-target-text');
    const translateStatusEl = document.getElementById('label-translate-status');
    const imagePreviewBarEl = document.getElementById('image-preview-bar');
    const attachedImageThumbEl = document.getElementById('attached-image-thumb');

    function init() {
      renderSidebar();
      renderActiveChat();
      setupEventListeners();
      autoResizeTextarea();
    }

    function applyTheme(theme) {
      state.config.theme = theme;
      const html = document.documentElement;
      const menuIcon = document.getElementById('user-menu-theme-icon');
      if (theme === 'dark') {
        html.classList.add('dark');
        if (menuIcon) menuIcon.className = 'fa-solid fa-moon text-softblue';
      } else {
        html.classList.remove('dark');
        if (menuIcon) menuIcon.className = 'fa-solid fa-sun text-amber-500';
      }
    }

    function updateUserAvatarUI() {
      const src = state.config.userAvatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=user_default';
      document.getElementById('sidebar-user-avatar').src = src;
      document.getElementById('menu-user-avatar-preview').src = src;
    }

    function applyAppScale(scaleVal) {
      const val = parseFloat(scaleVal) || 1.0;
      const scaler = document.getElementById('app-scaler');
      if (scaler) scaler.style.zoom = val;
      const previewEl = document.getElementById('label-scale-preview');
      if (previewEl) previewEl.textContent = `${Math.round(val * 100)}%`;
      const quickScaleEl = document.getElementById('label-quick-scale');
      if (quickScaleEl) quickScaleEl.textContent = `${Math.round(val * 100)}%`;
    }

    function renderSidebar() {
      sidebarListEl.innerHTML = '';

      if (state.sidebarTab === 'hall') {
        renderCharacterHall();
        return;
      }

      if (state.characters.length === 0) {
        sidebarListEl.innerHTML = `
          <div class="text-center py-12 text-slate-400 text-xs px-2">
            <i class="fa-solid fa-comments text-3xl mb-2 opacity-40"></i>
            <p>暂无会话，请去“角色大厅”创建角色！</p>
          </div>
        `;
        return;
      }

      // Render Characters
      state.characters.forEach(char => {
        const isActive = state.activeSessionType === 'char' && char.id === state.activeSessionId;
        const lastMsg = (state.messages[char.id] && state.messages[char.id].length > 0)
          ? state.messages[char.id][state.messages[char.id].length - 1].content
          : char.greeting;

        const item = document.createElement('div');
        item.className = `p-3 rounded-2xl cursor-pointer transition-all flex items-center space-x-3 border ${
          isActive ? 'bg-softblue-light dark:bg-softblue/20 border-softblue/50 font-medium' : 'border-transparent hover:bg-[var(--md-card)]'
        }`;
        item.onclick = () => selectSession(char.id, 'char');

        let badgeHtml = '';
        if (char.isOnlineChatMode) {
          badgeHtml += `<span class="text-[10px] bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 px-1.5 py-0.5 rounded-full font-medium border border-emerald-500/30">📱 线上</span>`;
        }

        item.innerHTML = `
          <img class="w-11 h-11 rounded-full object-cover shrink-0 border border-[var(--md-border)] shadow-sm" src="${char.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + char.id}" alt="${char.name}">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-center mb-0.5">
              <h4 class="font-bold truncate text-xs sm:text-sm">${escapeHtml(char.name)}</h4>
              ${badgeHtml}
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 truncate">${escapeHtml(lastMsg)}</p>
          </div>
        `;
        sidebarListEl.appendChild(item);
      });
    }

    function deleteSession(id) {
      state.characters = state.characters.filter(c => c.id !== id);
      saveCharacters();
      delete state.messages[id];
      localStorage.removeItem(`hakimi_msgs_${id}`);

      if (state.activeSessionId === id) {
        state.activeSessionId = state.characters.length > 0 ? state.characters[0].id : null;
      }
      renderSidebar();
      renderActiveChat();
    }

    function renderCharacterHall() {
      const container = document.createElement('div');
      container.className = 'space-y-3 p-1 animate-msg';

      const hallHeader = document.createElement('div');
      hallHeader.className = 'flex justify-between items-center px-1 mb-2';
      hallHeader.innerHTML = `
        <span class="text-xs font-bold text-slate-500">角色列表 (${state.characters.length}/8)</span>
        <button id="btn-hall-create-char" class="px-3 py-1.5 bg-softblue hover:bg-softblue-hover text-white rounded-xl text-xs font-medium shadow-sm transition-all flex items-center gap-1 active:scale-95">
          <i class="fa-solid fa-plus text-xs"></i> 新建角色
        </button>
      `;
      container.appendChild(hallHeader);

      if (state.characters.length === 0) {
        const emptyNotice = document.createElement('div');
        emptyNotice.className = 'text-center py-12 text-slate-400 text-xs bg-[var(--md-card)] rounded-2xl border border-[var(--md-border)]';
        emptyNotice.innerHTML = `大厅暂无角色，点击右上角 “新建角色” 开始吧！`;
        container.appendChild(emptyNotice);
      } else {
        const grid = document.createElement('div');
        grid.className = 'grid grid-cols-1 gap-3';

        state.characters.forEach(char => {
          const card = document.createElement('div');
          card.className = 'bg-[var(--md-card)] border border-[var(--md-border)] rounded-2xl p-3 cursor-pointer hover:border-softblue/60 transition-all relative group shadow-sm';

          card.onclick = () => {
            selectSession(char.id, 'char');
            setSidebarTab('chats');
          };

          let onlineBadge = char.isOnlineChatMode ? `<span class="text-[10px] bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 px-1.5 py-0.2 rounded-full font-medium">📱 线上</span>` : '';

          card.innerHTML = `
            <div class="flex items-center space-x-3">
              <img class="w-12 h-12 rounded-full object-cover shrink-0 border border-softblue/30" src="${char.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + char.id}">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5">
                  <h4 class="font-bold text-sm truncate">${escapeHtml(char.name)}</h4>
                  ${onlineBadge}
                </div>
                <p class="text-xs text-slate-500 dark:text-slate-400 truncate mt-0.5">${escapeHtml(char.tagline || '暂无介绍')}</p>
              </div>
            </div>
          `;
          grid.appendChild(card);
        });
        container.appendChild(grid);
      }

      sidebarListEl.appendChild(container);

      // 绑定新建事件
      document.getElementById('btn-hall-create-char').onclick = () => {
        if (state.characters.length >= 8) {
          alert('角色创建数量已达上限（最大限制 8 个）！请先删除不需要的角色。');
          return;
        }
        openCharCreationModal();
      };
    }

    function setSidebarTab(tab) {
      state.sidebarTab = tab;
      const tabChats = document.getElementById('tab-chats');
      const tabHall = document.getElementById('tab-hall');

      if (tab === 'chats') {
        tabChats.className = 'flex-1 py-2 text-center rounded-xl bg-softblue text-white shadow-sm transition-all';
        tabHall.className = 'flex-1 py-2 text-center rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
      } else {
        tabHall.className = 'flex-1 py-2 text-center rounded-xl bg-softblue text-white shadow-sm transition-all';
        tabChats.className = 'flex-1 py-2 text-center rounded-xl text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 transition-all';
      }
      renderSidebar();
    }

    function selectSession(id, type) {
      state.activeSessionId = id;
      state.activeSessionType = type;
      renderSidebar();
      renderActiveChat();
      document.getElementById('sidebar').classList.add('hidden', 'md:flex');
    }

    function renderActiveChat() {
      if (!state.activeSessionId) {
        chatTitleEl.innerHTML = `<span>未选择会话</span>`;
        chatSubtitleEl.textContent = '请选择或创建角色';
        chatAvatarEl.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=empty';
        msgContainerEl.innerHTML = `<div class="h-full flex items-center justify-center text-slate-400 text-sm">点击左侧列表开始对话</div>`;
        return;
      }

      const char = getCurrentChar();
      if (!char) return;

      let badgeText = char.isOnlineChatMode ? `<span class="text-[10px] bg-emerald-500/10 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30 px-1.5 py-0.2 rounded-full font-medium">📱 线上</span>` : '';
      chatTitleEl.innerHTML = `<span>${escapeHtml(char.name)}</span> ${badgeText}`;
      chatSubtitleEl.textContent = char.tagline || '点击头像查看信息';
      chatAvatarEl.src = char.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + char.id;

      updateTranslateBtnState();

      const msgs = state.messages[state.activeSessionId] || [];
      msgContainerEl.innerHTML = '';
      msgs.forEach(msg => {
        msgContainerEl.appendChild(createMessageElement(msg));
      });
      scrollToBottom();
    }

    function createMessageElement(msg) {
      const isUser = msg.role === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} my-2 text-sm relative touch-callout-none animate-msg`;
      wrapper.dataset.msgId = msg.id;

      const inner = document.createElement('div');
      inner.className = `flex items-start space-x-2 max-w-[88%] sm:max-w-[80%] ${isUser ? 'flex-row-reverse space-x-reverse' : 'flex-row'}`;

      let avatarSrc = state.config.userAvatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=user_default';
      let senderName = '你';

      if (!isUser) {
        const char = getCurrentChar();
        if (char) {
          avatarSrc = char.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + char.id;
          senderName = char.name;
        }
      }

      const bubbleContainer = document.createElement('div');
      bubbleContainer.className = 'flex flex-col min-w-0';

      const bubble = document.createElement('div');
      bubble.className = `p-3.5 rounded-3xl text-sm leading-relaxed shadow-sm relative ${
        isUser 
          ? 'bg-softblue text-white rounded-tr-sm' 
          : 'bg-[var(--md-surface)] text-slate-800 dark:text-slate-100 border border-[var(--md-border)] rounded-tl-sm'
      }`;

      let replyHtml = msg.replyTo ? `<div class="text-xs border-l-2 border-softblue pl-2 mb-1 opacity-80 line-clamp-1 italic">${escapeHtml(msg.replyTo.content)}</div>` : '';
      let imageHtml = msg.image ? `<img src="${msg.image}" class="max-w-xs max-h-48 rounded-xl mb-2 object-cover border border-[var(--md-border)]">` : '';
      let translatedInfo = msg.translatedText ? `<div class="text-[10px] opacity-80 border-t border-white/20 pt-1 mt-1 font-mono">[转英文]: ${escapeHtml(msg.translatedText)}</div>` : '';

      bubble.innerHTML = `
        ${replyHtml}
        ${imageHtml}
        <div class="whitespace-pre-wrap break-words">${escapeHtml(msg.content)}</div>
        ${translatedInfo}
      `;

      const actionToolbar = document.createElement('div');
      actionToolbar.className = `flex items-center gap-2 mt-1 px-1 text-[11px] text-slate-400 ${isUser ? 'justify-end' : 'justify-start'}`;
      actionToolbar.innerHTML = `
        <button class="btn-quick-edit hover:text-softblue transition-all"><i class="fa-solid fa-pen"></i> 编辑</button>
        <button class="btn-quick-memorize hover:text-softblue text-softblue transition-all"><i class="fa-solid fa-brain"></i> 记忆</button>
      `;

      actionToolbar.querySelector('.btn-quick-edit').onclick = () => openEditMsgModal(msg);
      actionToolbar.querySelector('.btn-quick-memorize').onclick = () => memorizeMessage(msg);

      bubbleContainer.appendChild(bubble);
      bubbleContainer.appendChild(actionToolbar);

      inner.innerHTML = `<img class="w-8 h-8 rounded-full object-cover shrink-0 mt-0.5 border border-[var(--md-border)]" src="${avatarSrc}">`;
      inner.appendChild(bubbleContainer);
      wrapper.appendChild(inner);

      setupMessageContextMenu(wrapper, msg);
      return wrapper;
    }

    function setupMessageContextMenu(element, msg) {
      let timer = null;
      element.addEventListener('touchstart', () => { timer = setTimeout(() => showContextMenu(msg, element), 500); }, { passive: true });
      element.addEventListener('touchend', () => clearTimeout(timer));
      element.addEventListener('touchmove', () => clearTimeout(timer));
      element.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showContextMenu(msg, element, e.clientX, e.clientY);
      });
    }

    function showContextMenu(msg, element, clientX, clientY) {
      state.selectedMsgId = msg.id;
      const rect = element.getBoundingClientRect();
      const x = clientX || (rect.left + rect.width / 2);
      const y = clientY || (rect.top + rect.height / 2);

      contextMenuEl.style.left = `${Math.min(x, window.innerWidth - 170)}px`;
      contextMenuEl.style.top = `${Math.min(y, window.innerHeight - 220)}px`;
      contextMenuEl.classList.remove('hidden');
    }

    // 拟真延迟函数 (1.0 到 2.5 秒)
    function simulateThoughtDelay() {
      const ms = Math.floor(Math.random() * 1500) + 1000;
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function handleSendMessage(e) {
      if (e) e.preventDefault();
      const text = chatInputEl.value.trim();
      const hasImage = !!state.attachedImageData;
      if (!text && !hasImage) return;

      if (!state.activeSessionId) return alert('请先创建或选择角色！');

      chatInputEl.value = '';
      autoResizeTextarea();

      const imageToSend = state.attachedImageData;
      clearAttachedImage();

      let replyToObj = null;
      if (state.replyToMsgId) {
        const msgs = state.messages[state.activeSessionId] || [];
        const target = msgs.find(m => m.id === state.replyToMsgId);
        if (target) replyToObj = { id: target.id, content: target.content };
        clearReplyIndicator();
      }

      const char = getCurrentChar();
      let translatedText = null;
      if (char && char.autoTranslate && text) {
        showLoadingIndicator('自动转英文中...');
        translatedText = await translateToEnglish(text);
        removeLoadingIndicator();
      }

      const userMsg = {
        id: 'msg_' + Date.now(),
        role: 'user',
        content: text,
        image: imageToSend,
        translatedText: translatedText,
        replyTo: replyToObj,
        timestamp: Date.now()
      };

      if (!state.messages[state.activeSessionId]) state.messages[state.activeSessionId] = [];
      state.messages[state.activeSessionId].push(userMsg);
      saveMessages(state.activeSessionId);
      renderActiveChat();

      await fetchSingleAIResponse(char);
    }

    // 续写 / 下一句 逻辑
    async function handleContinueChat() {
      const char = getCurrentChar();
      if (!char) return alert('请先选择角色！');
      
      showLoadingIndicator(`${char.name} 正在思考下一句...`);
      await simulateThoughtDelay(); // 1.0 - 2.5秒思考

      try {
        const apiMessages = buildApiPayloadForChar(char);
        apiMessages.push({ role: 'user', content: '[系统提示: 请顺着上文继续往下说下一句话]' });

        const response = await fetch(`${state.config.baseUrl}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.config.apiKey}` },
          body: JSON.stringify({
            model: state.config.model,
            messages: apiMessages,
            max_tokens: parseInt(state.config.maxTokens) || 350,
            temperature: parseFloat(state.config.temperature) || 0.85
          })
        });

        if (!response.ok) throw new Error('请求异常');

        const data = await response.json();
        const aiText = data.choices?.[0]?.message?.content || '(无响应)';

        const assistantMsg = {
          id: 'msg_' + Date.now(),
          role: 'assistant',
          charId: char.id,
          content: aiText,
          timestamp: Date.now()
        };

        state.messages[char.id].push(assistantMsg);
        saveMessages(char.id);

      } catch (err) {
        alert(`请求失败: ${err.message}`);
      } finally {
        removeLoadingIndicator();
        renderActiveChat();
      }
    }

    async function translateToEnglish(text) {
      if (!state.config.apiKey) return null;
      try {
        const response = await fetch(`${state.config.baseUrl}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.config.apiKey}` },
          body: JSON.stringify({
            model: state.config.model,
            messages: [
              { role: 'system', content: 'Direct translate Chinese to natural spoken English. Output ONLY translated English without extra explanation.' },
              { role: 'user', content: text }
            ],
            temperature: 0.2
          })
        });
        const data = await response.json();
        return data.choices?.[0]?.message?.content?.trim() || null;
      } catch (err) { return null; }
    }

    async function fetchSingleAIResponse(char) {
      if (!state.config.apiKey) return alert('请先在个人中心/设置中填写 API Key！');

      showLoadingIndicator(`${char.name} 正在输入...`);
      await simulateThoughtDelay(); // 加入 1.0~2.5 秒的拟真思考延迟

      try {
        const apiMessages = buildApiPayloadForChar(char);

        const response = await fetch(`${state.config.baseUrl}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.config.apiKey}` },
          body: JSON.stringify({
            model: state.config.model,
            messages: apiMessages,
            max_tokens: parseInt(state.config.maxTokens) || 350,
            temperature: parseFloat(state.config.temperature) || 0.85
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || '网络请求异常');
        }

        const data = await response.json();
        const aiText = data.choices?.[0]?.message?.content || '(无响应)';

        const assistantMsg = {
          id: 'msg_' + Date.now(),
          role: 'assistant',
          charId: char.id,
          content: aiText,
          timestamp: Date.now()
        };

        state.messages[char.id].push(assistantMsg);
        saveMessages(char.id);

      } catch (err) {
        alert(`请求失败: ${err.message}`);
      } finally {
        removeLoadingIndicator();
        renderActiveChat();
      }
    }

    function buildApiPayloadForChar(char) {
      const payload = [];

      let systemPrompt = `[AI Character Name]: ${char.name}\n`;
      if (char.gender) systemPrompt += `[AI Gender]: ${char.gender}\n`;
      if (char.userRole) systemPrompt += `[User Role]: ${char.userRole}\n`;
      if (char.userGender) systemPrompt += `[User Gender]: ${char.userGender}\n`;
      if (char.userRelation) systemPrompt += `[Relationship]: ${char.userRelation}\n`;
      if (char.prompt) systemPrompt += `[Personality Setting]:\n${char.prompt}\n`;

      if (char.isOnlineChatMode) {
        systemPrompt = ONLINE_CHAT_MODE_INSTRUCTION + '\n' + systemPrompt;
      } else {
        if (state.chatMode === 'rp') {
          systemPrompt += `\n[Roleplay Mode]: Express rich actions inside asterisks (*...*).`;
        } else {
          systemPrompt += `\n[Chat Mode]: Direct conversation in 1-3 sentences.`;
        }
      }

      if (state.config.uncensoredPrompt) {
        systemPrompt = UNCENSORED_SYSTEM_INSTRUCTION + '\n' + systemPrompt;
      }

      if (char.memory) {
        systemPrompt += `\n[Reinforced Core Memory]:\n${char.memory}`;
      }

      payload.push({ role: 'system', content: systemPrompt });

      const allMsgs = state.messages[char.id] || [];
      const recentMsgs = allMsgs.slice(-15);

      recentMsgs.forEach(m => {
        const textContent = m.translatedText || m.content;
        if (m.image) {
          payload.push({
            role: m.role,
            content: [
              { type: 'text', text: textContent || 'Look at this image' },
              { type: 'image_url', image_url: { url: m.image } }
            ]
          });
        } else {
          payload.push({ role: m.role, content: textContent });
        }
      });

      return payload;
    }

    function showLoadingIndicator(text) {
      removeLoadingIndicator();
      const loader = document.createElement('div');
      loader.id = 'chat-loading-indicator';
      loader.className = 'flex items-center space-x-2 text-xs text-softblue p-2.5 my-2 bg-[var(--md-card)] rounded-2xl w-fit shadow-sm animate-msg';
      loader.innerHTML = `<i class="fa-solid fa-circle-notch animate-spin"></i><span>${text}</span>`;
      msgContainerEl.appendChild(loader);
      scrollToBottom();
    }

    function removeLoadingIndicator() {
      const loader = document.getElementById('chat-loading-indicator');
      if (loader) loader.remove();
    }

    document.getElementById('input-image-file').onchange = async (e) => {
      const file = e.target.files[0];
      if (file) {
        state.attachedImageData = await compressImageFile(file, 400, 400, 0.6);
        attachedImageThumbEl.src = state.attachedImageData;
        imagePreviewBarEl.classList.remove('hidden');
      }
    };

    document.getElementById('btn-remove-attached-image').onclick = clearAttachedImage;
    function clearAttachedImage() {
      state.attachedImageData = null;
      attachedImageThumbEl.src = '';
      imagePreviewBarEl.classList.add('hidden');
      document.getElementById('input-image-file').value = '';
    }

    function memorizeMessage(msg) {
      const char = getCurrentChar();
      if (!char) return alert('请在单人聊天中使用强化记忆！');

      const prefix = msg.role === 'user' ? '用户表达' : `${char.name}承诺/说`;
      const newItem = `- [强化记忆]: ${prefix}: "${msg.content}"`;

      if (!char.memory) char.memory = '';
      if (!char.memory.includes(msg.content)) {
        char.memory += (char.memory ? '\n' : '') + newItem;
        saveCharacters();
        alert(`已成功记录！`);
      } else {
        alert('此信息已被记住！');
      }
    }

    function openEditMsgModal(msg) {
      state.selectedMsgId = msg.id;
      document.getElementById('edit-msg-input').value = msg.content;
      showModal('modal-edit-msg');
    }

    // 微信式：打开角色详情 Modal
    function openCharInfoModal() {
      const char = getCurrentChar();
      if (!char) return;

      document.getElementById('info-char-avatar').src = char.avatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=' + char.id;
      document.getElementById('info-char-name').textContent = char.name;
      document.getElementById('info-char-tagline').textContent = char.tagline || '暂无一句话介绍';
      document.getElementById('info-char-gender').textContent = char.gender || '保密';
      document.getElementById('info-char-user-role').textContent = char.userRole || '玩家';
      document.getElementById('info-char-mode-text').textContent = char.isOnlineChatMode ? '📱 线上纯文本聊天' : '🎭 沉浸角色扮演';

      // 微信式：清空当前会话
      document.getElementById('btn-info-clear-chat').onclick = () => {
        if (confirm(`确定要清空与【${char.name}】的所有对话历史吗？`)) {
          state.messages[char.id] = [{ id: 'msg_' + Date.now(), role: 'assistant', charId: char.id, content: char.greeting || '你好！', timestamp: Date.now() }];
          saveMessages(char.id);
          renderActiveChat();
          hideModal('modal-char-info');
        }
      };

      // 微信式：强化记忆管理
      document.getElementById('btn-info-memory').onclick = () => {
        hideModal('modal-char-info');
        document.getElementById('memory-text').value = char.memory || '';
        showModal('modal-memory');
      };

      // 微信式：彻底删除角色
      document.getElementById('btn-info-delete-char').onclick = () => {
        if (confirm(`确定要删除 AI 角色【${char.name}】吗？删除后不可恢复！`)) {
          deleteSession(char.id);
          hideModal('modal-char-info');
          setSidebarTab('hall');
        }
      };

      showModal('modal-char-info');
    }

    function setupEventListeners() {
      chatInputEl.addEventListener('input', autoResizeTextarea);
      chatInputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSendMessage();
        }
      });

      chatFormEl.addEventListener('submit', handleSendMessage);
      document.getElementById('btn-continue-chat').onclick = handleContinueChat;

      // 触发头像资料框
      document.getElementById('btn-chat-avatar-trigger').onclick = openCharInfoModal;
      document.getElementById('btn-chat-title-trigger').onclick = openCharInfoModal;

      // 主页左上角用户头像 -> 唤出控制中心 Modal
      document.getElementById('sidebar-user-avatar').onclick = () => {
        showModal('modal-user-menu');
      };

      document.getElementById('btn-menu-toggle-theme').onclick = () => {
        const newTheme = state.config.theme === 'dark' ? 'light' : 'dark';
        applyTheme(newTheme);
        localStorage.setItem('hakimi_config', JSON.stringify(state.config));
      };

      document.getElementById('btn-menu-open-settings').onclick = () => {
        hideModal('modal-user-menu');
        openGlobalSettingsModal();
      };

      document.getElementById('tab-chats').onclick = () => setSidebarTab('chats');
      document.getElementById('tab-hall').onclick = () => setSidebarTab('hall');

      document.getElementById('btn-back-to-list').onclick = () => {
        document.getElementById('sidebar').classList.remove('hidden');
      };

      document.getElementById('btn-toggle-translate').onclick = () => {
        const char = getCurrentChar();
        if (char) {
          char.autoTranslate = !char.autoTranslate;
          saveCharacters();
          updateTranslateBtnState();
          renderSidebar();
        }
      };

      document.addEventListener('click', () => {
        contextMenuEl.classList.add('hidden');
      });

      const providerSelect = document.getElementById('setting-provider-preset');
      const modelSelect = document.getElementById('setting-model-select');
      const customFields = document.getElementById('custom-fields');
      const scaleSelect = document.getElementById('setting-app-scale');

      function populateModels(providerKey) {
        modelSelect.innerHTML = '';
        if (MODEL_PRESETS[providerKey]) {
          MODEL_PRESETS[providerKey].forEach(m => {
            const opt = document.createElement('option');
            opt.value = m.value;
            opt.textContent = m.name;
            modelSelect.appendChild(opt);
          });
          modelSelect.parentElement.classList.remove('hidden');
        } else {
          modelSelect.parentElement.classList.add('hidden');
        }
      }

      providerSelect.onchange = () => {
        const pKey = providerSelect.value;
        if (pKey === 'custom') {
          customFields.classList.remove('hidden');
          modelSelect.parentElement.classList.add('hidden');
        } else {
          customFields.classList.add('hidden');
          populateModels(pKey);
        }
      };

      document.getElementById('input-user-avatar').onchange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImageFile(file, 100, 100, 0.5);
          state.config.userAvatar = compressed;
          document.getElementById('user-avatar-preview').src = compressed;
          updateUserAvatarUI();
        }
      };

      function openGlobalSettingsModal() {
        scaleSelect.value = state.config.appScale || '1.0';
        providerSelect.value = state.config.provider || 'gemini';
        
        if (state.config.provider === 'custom') {
          customFields.classList.remove('hidden');
          modelSelect.parentElement.classList.add('hidden');
        } else {
          customFields.classList.add('hidden');
          populateModels(state.config.provider);
          modelSelect.value = state.config.model;
        }

        document.getElementById('user-avatar-preview').src = state.config.userAvatar || 'https://api.dicebear.com/7.x/bottts/svg?seed=user_default';
        document.getElementById('setting-api-key').value = state.config.apiKey || '';
        document.getElementById('setting-base-url').value = state.config.baseUrl || '';
        document.getElementById('setting-custom-model').value = state.config.model || '';
        document.getElementById('setting-max-tokens-select').value = state.config.maxTokens || 350;
        document.getElementById('setting-uncensored-prompt').checked = !!state.config.uncensoredPrompt;

        showModal('modal-settings');
      }

      document.getElementById('btn-save-settings').onclick = () => {
        const pKey = providerSelect.value;
        state.config.provider = pKey;
        state.config.appScale = scaleSelect.value;
        state.config.apiKey = document.getElementById('setting-api-key').value.trim();
        state.config.maxTokens = parseInt(document.getElementById('setting-max-tokens-select').value) || 350;
        state.config.uncensoredPrompt = document.getElementById('setting-uncensored-prompt').checked;

        if (pKey === 'custom') {
          state.config.baseUrl = document.getElementById('setting-base-url').value.trim();
          state.config.model = document.getElementById('setting-custom-model').value.trim();
        } else {
          state.config.baseUrl = PROVIDERS[pKey].baseUrl;
          state.config.model = modelSelect.value;
        }

        applyAppScale(state.config.appScale);
        localStorage.setItem('hakimi_config', JSON.stringify(state.config));
        updateUserAvatarUI();
        hideModal('modal-settings');
        renderActiveChat();
      };

      document.getElementById('btn-open-dir-modal').onclick = () => showModal('modal-directory');
      document.getElementById('btn-export-dir-file').onclick = exportDataToFile;

      document.getElementById('btn-clear-space').onclick = () => {
        cleanBloatedStorage();
        saveCharacters();
        renderSidebar();
        renderActiveChat();
        alert('已经成功清理超限图片缓存！');
      };

      document.getElementById('input-import-dir-file').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const imported = JSON.parse(event.target.result);
              if (imported.characters) {
                state = imported;
                saveCharacters();
                if (state.config) localStorage.setItem('hakimi_config', JSON.stringify(state.config));
                init();
                alert('恢复档案成功！');
                hideModal('modal-directory');
              }
            } catch (err) { alert('数据格式错误: ' + err.message); }
          };
          reader.readAsText(file);
        }
      };

      // 新建角色并自动跳转至大厅
      document.getElementById('btn-save-char').onclick = function(e) {
        if (e) e.preventDefault();
        try {
          const nameInput = document.getElementById('char-edit-name').value.trim();
          if (!nameInput) {
            alert('请填写角色名称！');
            return;
          }

          if (state.characters.length >= 8) {
            alert('角色数量已达上限 (8个)！');
            return;
          }

          const charId = 'char_' + Date.now();
          let avatarPreviewSrc = document.getElementById('char-edit-avatar-preview').src;
          if (!avatarPreviewSrc || avatarPreviewSrc.includes('placeholder')) {
            avatarPreviewSrc = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(nameInput);
          }

          const newChar = {
            id: charId,
            name: nameInput,
            isOnlineChatMode: document.getElementById('char-edit-online-mode').checked,
            gender: document.getElementById('char-edit-gender').value || '女',
            userGender: document.getElementById('char-edit-user-gender').value || '男',
            userRole: (document.getElementById('char-edit-user-role').value || '').trim(),
            userRelation: (document.getElementById('char-edit-user-relation').value || '').trim(),
            tagline: (document.getElementById('char-edit-tagline').value || '').trim(),
            prompt: (document.getElementById('char-edit-prompt').value || '').trim(),
            greeting: (document.getElementById('char-edit-greeting').value || '').trim() || '你好！',
            avatar: avatarPreviewSrc,
            memory: '',
            autoTranslate: document.getElementById('char-edit-translate').checked
          };

          state.characters.push(newChar);
          state.messages[charId] = [{
            id: 'msg_' + Date.now(),
            role: 'assistant',
            charId: charId,
            content: newChar.greeting,
            timestamp: Date.now()
          }];
          saveMessages(charId);

          saveCharacters();
          hideModal('modal-char-editor');
          
          // 自动跳转到角色大厅
          setSidebarTab('hall');
          selectSession(charId, 'char');
        } catch (err) {
          alert('创建失败: ' + err.message);
        }
      };

      document.getElementById('char-edit-avatar-file').onchange = async (e) => {
        const file = e.target.files[0];
        if (file) {
          const compressed = await compressImageFile(file, 100, 100, 0.5);
          document.getElementById('char-edit-avatar-preview').src = compressed;
        }
      };

      setupContextMenuHandlers();

      document.getElementById('btn-save-memory').onclick = () => {
        const char = getCurrentChar();
        if (char) {
          char.memory = document.getElementById('memory-text').value.trim();
          saveCharacters();
          hideModal('modal-memory');
        }
      };

      document.querySelectorAll('.close-modal').forEach(btn => {
        btn.onclick = (e) => { e.target.closest('.fixed')?.classList.add('hidden'); };
      });
    }

    function exportDataToFile() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", url);
      downloadAnchor.setAttribute("download", `hakimi_ai_archive_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      URL.revokeObjectURL(url);
    }

    function openCharCreationModal() {
      document.getElementById('char-edit-name').value = '';
      document.getElementById('char-edit-online-mode').checked = false;
      document.getElementById('char-edit-gender').value = '女';
      document.getElementById('char-edit-user-gender').value = '男';
      document.getElementById('char-edit-user-role').value = '';
      document.getElementById('char-edit-user-relation').value = '';
      document.getElementById('char-edit-tagline').value = '';
      document.getElementById('char-edit-prompt').value = '';
      document.getElementById('char-edit-greeting').value = '';
      document.getElementById('char-edit-avatar-preview').src = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + Date.now();
      document.getElementById('char-edit-translate').checked = false;

      showModal('modal-char-editor');
    }

    function setupContextMenuHandlers() {
      document.getElementById('ctx-reply').onclick = () => {
        const msgs = state.messages[state.activeSessionId] || [];
        const msg = msgs.find(m => m.id === state.selectedMsgId);
        if (msg) {
          state.replyToMsgId = msg.id;
          replyTargetTextEl.textContent = msg.content;
          replyIndicatorEl.classList.remove('hidden');
          chatInputEl.focus();
        }
      };

      document.getElementById('ctx-memorize').onclick = () => {
        const msgs = state.messages[state.activeSessionId] || [];
        const msg = msgs.find(m => m.id === state.selectedMsgId);
        if (msg) memorizeMessage(msg);
      };

      document.getElementById('ctx-edit').onclick = () => {
        const msgs = state.messages[state.activeSessionId] || [];
        const msg = msgs.find(m => m.id === state.selectedMsgId);
        if (msg) openEditMsgModal(msg);
      };

      document.getElementById('ctx-copy').onclick = () => {
        const msgs = state.messages[state.activeSessionId] || [];
        const msg = msgs.find(m => m.id === state.selectedMsgId);
        if (msg) navigator.clipboard.writeText(msg.content);
      };

      document.getElementById('ctx-regen').onclick = async () => {
        let msgs = state.messages[state.activeSessionId] || [];
        const index = msgs.findIndex(m => m.id === state.selectedMsgId);
        if (index !== -1) {
          msgs.splice(index);
          saveMessages(state.activeSessionId);
          renderActiveChat();
          await fetchSingleAIResponse(getCurrentChar());
        }
      };

      document.getElementById('ctx-delete').onclick = () => {
        let msgs = state.messages[state.activeSessionId] || [];
        state.messages[state.activeSessionId] = msgs.filter(m => m.id !== state.selectedMsgId);
        saveMessages(state.activeSessionId);
        renderActiveChat();
      };

      document.getElementById('btn-confirm-edit-msg').onclick = () => {
        const newText = document.getElementById('edit-msg-input').value.trim();
        if (newText && state.selectedMsgId) {
          let msgs = state.messages[state.activeSessionId] || [];
          const target = msgs.find(m => m.id === state.selectedMsgId);
          if (target) {
            target.content = newText;
            saveMessages(state.activeSessionId);
            renderActiveChat();
          }
        }
        hideModal('modal-edit-msg');
      };

      document.getElementById('btn-cancel-reply').onclick = clearReplyIndicator;
    }

    function updateTranslateBtnState() {
      const char = getCurrentChar();
      if (!char) return;
      if (char.autoTranslate) {
        translateStatusEl.textContent = '转英文: 开';
        translateStatusEl.parentElement.classList.add('bg-softblue/10', 'border-softblue', 'text-softblue');
      } else {
        translateStatusEl.textContent = '转英文: 关';
        translateStatusEl.parentElement.classList.remove('bg-softblue/10', 'border-softblue', 'text-softblue');
      }
    }

    function getCurrentChar() {
      if (state.activeSessionType === 'char') {
        return state.characters.find(c => c.id === state.activeSessionId) || state.characters[0] || null;
      }
      return null;
    }

    function saveCharacters() {
      try {
        localStorage.setItem('hakimi_characters', JSON.stringify(state.characters));
      } catch (e) {
        cleanBloatedStorage();
        try {
          localStorage.setItem('hakimi_characters', JSON.stringify(state.characters));
        } catch(err2) {
          alert('空间不足，请清理历史对话！');
        }
      }
    }

    function saveMessages(id) {
      if (state.messages[id]) {
        try {
          localStorage.setItem(`hakimi_msgs_${id}`, JSON.stringify(state.messages[id]));
        } catch (e) {
          alert('对话记录已满，请及时清空部分历史！');
        }
      }
    }

    function clearReplyIndicator() {
      state.replyToMsgId = null;
      replyIndicatorEl.classList.add('hidden');
    }

    function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
    function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

    function autoResizeTextarea() {
      chatInputEl.style.height = 'auto';
      chatInputEl.style.height = (chatInputEl.scrollHeight) + 'px';
    }

    function scrollToBottom() { msgContainerEl.scrollTop = msgContainerEl.scrollHeight; }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    window.onload = init;
  </script>
</body>
</html>
