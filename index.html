<!DOCTYPE html>
<html lang="zh-CN" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>哈基米 AI - 智能伴侣与多角色群聊</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fdf2f8',
              100: '#fce7f3',
              500: '#ec4899',
              600: '#db2777',
              700: '#be185d',
            }
          },
          keyframes: {
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(6px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            popIn: {
              '0%': { opacity: '0', transform: 'scale(0.95)' },
              '100%': { opacity: '1', transform: 'scale(1)' }
            }
          },
          animation: {
            fadeIn: 'fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            popIn: 'popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(51, 65, 85, 0.8);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(71, 85, 105, 1);
    }
    .touch-callout-none {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    /* Scaled Root Container */
    #app-scaler {
      width: 100%;
      height: 100%;
      transition: zoom 0.15s ease-in-out;
    }
  </style>
</head>
<body class="h-full flex flex-col font-sans overflow-hidden antialiased select-none bg-slate-950">

  <!-- App Wrapper with Zoom Support -->
  <div id="app-scaler" class="h-full w-full">
    <div id="app" class="flex h-full w-full relative overflow-hidden">

      <!-- Sidebar: Navigation, Characters & Groups -->
      <aside id="sidebar" class="w-full md:w-80 bg-slate-900/90 border-r border-slate-800/80 flex flex-col transition-all duration-300 z-20 absolute md:relative h-full backdrop-blur-md">
        <!-- Sidebar Header -->
        <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-900/50">
          <div class="flex items-center space-x-2">
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center font-bold text-white shadow-lg shadow-pink-500/30 text-lg">
              🐱
            </div>
            <span class="font-bold text-lg bg-gradient-to-r from-pink-400 to-rose-300 bg-clip-text text-transparent">哈基米 AI</span>
          </div>
          <div class="flex items-center space-x-1">
            <button id="btn-global-settings" title="界面缩放与 API 配置" class="p-2 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-slate-200 transition">
              <i class="fa-solid fa-gear"></i>
            </button>
            <button id="btn-create-menu" title="新建角色/群聊" class="p-2 bg-pink-600 hover:bg-pink-500 text-white rounded-lg transition shadow-md shadow-pink-600/20 active:scale-95">
              <i class="fa-solid fa-plus"></i>
            </button>
          </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-800 text-xs font-semibold text-slate-400 bg-slate-950/40">
          <button id="tab-chats" class="flex-1 py-3 text-center border-b-2 border-pink-500 text-pink-400 transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-comments"></i> 会话列表
          </button>
          <button id="tab-hall" class="flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition flex items-center justify-center gap-1.5">
            <i class="fa-solid fa-users-viewfinder"></i> 角色大厅
          </button>
        </div>

        <!-- List Container -->
        <div id="sidebar-list" class="flex-1 overflow-y-auto p-3 space-y-2">
          <!-- Rendered dynamically -->
        </div>

        <!-- Footer Info & Directory Export -->
        <div class="p-3 border-t border-slate-800 text-xs text-slate-500 flex justify-between items-center">
          <button id="btn-open-dir-modal" class="text-pink-400 hover:text-pink-300 flex items-center gap-1 font-medium">
            <i class="fa-solid fa-folder-open"></i> 手机存档目录
          </button>
          <button id="btn-quick-zoom" class="hover:text-slate-300 bg-slate-800 px-2 py-1 rounded text-[11px] border border-slate-700">
            缩放: <span id="label-quick-scale">100%</span>
          </button>
        </div>
      </aside>

      <!-- Main Chat Area -->
      <main class="flex-1 flex flex-col h-full bg-slate-950 relative">
        
        <!-- Chat View Header -->
        <header id="chat-header" class="h-16 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md px-3 sm:px-4 flex items-center justify-between z-10">
          <div class="flex items-center space-x-2.5 sm:space-x-3 min-w-0">
            <button id="btn-back-to-list" class="md:hidden p-2 text-slate-400 hover:text-white">
              <i class="fa-solid fa-chevron-left"></i>
            </button>
            <div class="relative shrink-0">
              <img id="chat-avatar" class="w-9 h-9 sm:w-10 sm:h-10 rounded-full object-cover border border-slate-700 shadow" src="" alt="Avatar">
              <span id="chat-online-dot" class="absolute bottom-0 right-0 w-2.5 h-2.5 sm:w-3 sm:h-3 bg-emerald-500 border-2 border-slate-900 rounded-full"></span>
            </div>
            <div class="min-w-0">
              <h2 id="chat-title" class="font-bold text-slate-100 text-sm sm:text-base flex items-center gap-2 truncate">
                <span>未选择会话</span>
              </h2>
              <p id="chat-subtitle" class="text-[11px] sm:text-xs text-slate-400 truncate max-w-[120px] sm:max-w-xs">请创建角色或群聊</p>
            </div>
          </div>

          <div class="flex items-center space-x-1.5 sm:space-x-2 shrink-0">
            <!-- Chat Mode Selector -->
            <div class="relative" id="mode-selector-wrapper">
              <select id="chat-mode-select" class="bg-slate-800 border border-slate-700 text-slate-200 text-xs rounded-lg px-2 py-1.5 focus:outline-none focus:border-pink-500 cursor-pointer">
                <option value="chat">💬 一句话对话</option>
                <option value="rp">🎭 剧情沉浸模式</option>
              </select>
            </div>

            <!-- Toggle Auto Translate -->
            <button id="btn-toggle-translate" title="自动将输入转为英文发给AI (更少限制)" class="px-2 py-1.5 rounded-lg text-xs font-medium border border-slate-700 bg-slate-800 text-slate-300 hover:bg-slate-700 transition flex items-center gap-1">
              <i class="fa-solid fa-language text-pink-400"></i>
              <span id="label-translate-status" class="hidden sm:inline">转英文: 关</span>
            </button>
            
            <button id="btn-char-memory" title="查看/编辑角色记忆" class="p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition">
              <i class="fa-solid fa-brain"></i>
            </button>

            <button id="btn-edit-current" title="编辑设定" class="p-2 text-slate-400 hover:text-slate-200 hover:bg-slate-800 rounded-lg transition">
              <i class="fa-solid fa-sliders"></i>
            </button>
          </div>
        </header>

        <!-- Message Container -->
        <div id="message-container" class="flex-1 overflow-y-auto p-3 sm:p-4 space-y-4">
          <!-- Messages rendered dynamically -->
        </div>

        <!-- Reply Indicator Bar -->
        <div id="reply-indicator" class="hidden px-4 py-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between text-xs text-pink-300">
          <div class="flex items-center space-x-2 truncate">
            <i class="fa-solid fa-reply"></i>
            <span class="text-slate-400">回复:</span>
            <span id="reply-target-text" class="truncate font-mono">...</span>
          </div>
          <button id="btn-cancel-reply" class="text-slate-500 hover:text-slate-300">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- Image Preview Attachment Bar -->
        <div id="image-preview-bar" class="hidden px-4 py-2 bg-slate-900/90 border-t border-slate-800 flex items-center space-x-3">
          <div class="relative">
            <img id="attached-image-thumb" class="w-14 h-14 rounded-lg object-cover border border-pink-500/50 shadow" src="" alt="Image">
            <button id="btn-remove-attached-image" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow hover:bg-red-500">
              <i class="fa-solid fa-xmark"></i>
            </button>
          </div>
          <span class="text-xs text-slate-400">图像已附加，AI 将对其进行视觉分析</span>
        </div>

        <!-- Chat Input Box -->
        <div class="p-2.5 sm:p-4 border-t border-slate-800 bg-slate-900/50 backdrop-blur-md">
          <form id="chat-form" class="flex items-end space-x-2">
            <!-- Image Upload Button -->
            <label title="上传图片供 AI 识别" class="w-10 h-10 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-full flex items-center justify-center transition cursor-pointer shrink-0 border border-slate-700">
              <i class="fa-solid fa-image text-sm text-pink-400"></i>
              <input type="file" id="input-image-file" accept="image/*" class="hidden">
            </label>

            <div class="flex-1 bg-slate-800/90 border border-slate-700 rounded-2xl p-2 focus-within:border-pink-500 focus-within:ring-1 focus-within:ring-pink-500 transition">
              <textarea id="chat-input" rows="1" placeholder="发送消息..." class="w-full bg-transparent text-slate-100 placeholder-slate-500 text-sm focus:outline-none resize-none max-h-32 px-2 py-1"></textarea>
            </div>

            <button type="submit" id="btn-send" class="w-10 h-10 bg-pink-600 hover:bg-pink-500 active:scale-95 text-white rounded-full flex items-center justify-center transition shadow-lg shadow-pink-600/30 shrink-0">
              <i class="fa-solid fa-paper-plane text-sm"></i>
            </button>
          </form>
        </div>
      </main>

    </div>
  </div>

  <!-- Dropdown Menu for Create (+ Button) -->
  <div id="menu-create" class="hidden fixed z-50 bg-slate-800/95 border border-slate-700 rounded-xl shadow-2xl py-1 text-sm text-slate-200 backdrop-blur w-40 overflow-hidden animate-popIn">
    <button id="btn-menu-new-char" class="w-full text-left px-4 py-2.5 hover:bg-pink-600 hover:text-white flex items-center space-x-2">
      <i class="fa-solid fa-user-plus w-4 text-pink-400"></i><span>新建 AI 角色</span>
    </button>
    <button id="btn-menu-new-group" class="w-full text-left px-4 py-2.5 hover:bg-pink-600 hover:text-white flex items-center space-x-2">
      <i class="fa-solid fa-users w-4 text-pink-400"></i><span>创建多角色群聊</span>
    </button>
  </div>

  <!-- Modal: Phone Storage Directory & File Export Manager -->
  <div id="modal-directory" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl animate-popIn max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg text-slate-100 flex items-center gap-2">
          <i class="fa-solid fa-folder-open text-pink-400"></i> 手机本地存储目录
        </h3>
        <button class="close-modal text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <p class="text-xs text-slate-400 leading-relaxed">
        您可以将所有创建的 AI 角色设定、群聊与对话记录直接保存导出为 `.json` 档案文件，存放在手机内存中的“下载(Download)”或“文档(Documents)”文件夹中。
      </p>

      <div class="space-y-3 pt-1">
        <button id="btn-export-dir-file" class="w-full py-3 bg-pink-600 hover:bg-pink-500 text-white rounded-xl text-sm font-medium flex items-center justify-center gap-2 shadow-lg shadow-pink-600/20 active:scale-95 transition">
          <i class="fa-solid fa-file-arrow-down text-base"></i> 导出完整数据包保存至手机目录
        </button>

        <label for="input-import-dir-file" class="w-full py-3 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-sm font-medium flex items-center justify-center gap-2 cursor-pointer active:scale-95 transition">
          <i class="fa-solid fa-file-arrow-up text-base text-pink-400"></i> 从手机文件夹读取/恢复档案
          <input type="file" id="input-import-dir-file" accept=".json" class="hidden">
        </label>
      </div>

      <div class="border-t border-slate-800 pt-3">
        <p class="text-[11px] text-slate-500 leading-normal">
          💡 提示：在手机上导出的文件可存放在文件管理器的本地目录中，随时可在其他手机或电脑上读取导入。
        </p>
      </div>

      <div class="flex justify-end pt-2">
        <button class="close-modal px-4 py-2 bg-slate-800 text-slate-300 rounded-lg text-xs">关闭</button>
      </div>
    </div>
  </div>

  <!-- Modal: Settings & Screen Scaling -->
  <div id="modal-settings" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl animate-popIn max-h-[85vh] overflow-y-auto">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="font-bold text-lg text-slate-100">界面缩放与 API 设置</h3>
        <button class="close-modal text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-4 text-sm">
        <!-- Zoom Level Selector -->
        <div>
          <label class="block text-slate-400 mb-1.5 font-medium flex justify-between">
            <span>手机/电脑界面缩放 (分辨率)</span>
            <span class="text-pink-400 text-xs" id="label-scale-preview">100%</span>
          </label>
          <select id="setting-app-scale" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-pink-500">
            <option value="0.8">80% (极小 - 适合小屏手机视野)</option>
            <option value="0.85">85% (紧凑 - 推荐移动端全显)</option>
            <option value="0.9">90% (轻度缩放)</option>
            <option value="1.0" selected>100% (标准尺寸)</option>
            <option value="1.1">110% (放大)</option>
            <option value="1.2">120% (超大字号)</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-400 mb-1.5 font-medium">选择 AI 模型渠道</label>
          <select id="setting-provider-preset" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-pink-500">
            <option value="gemini">Google Gemini (默认 - 支持图片识别)</option>
            <option value="deepseek">DeepSeek 官方 API (deepseek-chat)</option>
            <option value="openai">OpenAI 官方 (GPT-4o)</option>
            <option value="custom">自定义 Base URL 与 模型</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-medium">API Key (密钥)</label>
          <input type="password" id="setting-api-key" placeholder="在此输入 API Key" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2.5 text-slate-200 focus:outline-none focus:border-pink-500">
        </div>

        <div id="custom-fields" class="hidden space-y-3 pt-2 border-t border-slate-800">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Base URL</label>
            <input type="text" id="setting-base-url" placeholder="https://api.openai.com/v1" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">模型名称 (Model)</label>
            <input type="text" id="setting-model-name" placeholder="gpt-4o-mini" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 text-xs">
          </div>
        </div>

        <div>
          <label class="block text-slate-400 mb-1 font-medium">回复长度限制</label>
          <select id="setting-max-tokens-select" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2.5 text-slate-200 focus:outline-none focus:border-pink-500">
            <option value="200">极简 (约 100-150 字)</option>
            <option value="350" selected>标准简短 (约 200 字，推荐)</option>
            <option value="600">较长 (约 400 字)</option>
            <option value="1200">无限制 (长篇大论)</option>
          </select>
        </div>

        <div class="flex items-center space-x-2 pt-1">
          <input type="checkbox" id="setting-uncensored-prompt" class="rounded bg-slate-800 border-slate-700 text-pink-600 focus:ring-pink-500">
          <label for="setting-uncensored-prompt" class="text-xs text-slate-300">开启“无限制沉浸角色扮演模式” (Uncensored)</label>
        </div>
      </div>

      <div class="flex justify-end space-x-2 pt-3 border-t border-slate-800">
        <button class="close-modal px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm">取消</button>
        <button id="btn-save-settings" class="px-4 py-2 bg-pink-600 hover:bg-pink-500 text-white rounded-lg text-sm font-medium">保存配置</button>
      </div>
    </div>
  </div>

  <!-- Modal: Create / Edit Character -->
  <div id="modal-char-editor" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-lg p-6 space-y-4 max-h-[85vh] overflow-y-auto shadow-2xl animate-popIn">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 id="modal-char-title" class="font-bold text-lg text-slate-100">编辑角色</h3>
        <button class="close-modal text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="space-y-4 text-sm">
        <div class="flex items-center space-x-4">
          <div class="relative group">
            <img id="char-edit-avatar-preview" class="w-16 h-16 rounded-full object-cover border-2 border-pink-500/50 shadow" src="https://api.dicebear.com/7.x/bottts/svg?seed=hakimi" alt="Preview">
            <label for="char-edit-avatar-file" class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 cursor-pointer transition text-xs text-white">
              更换头像
            </label>
            <input type="file" id="char-edit-avatar-file" accept="image/*" class="hidden">
          </div>
          <div class="flex-1">
            <label class="block text-xs text-slate-400 mb-1">AI 角色名称 (无字数限制)</label>
            <input type="text" id="char-edit-name" placeholder="例如: 哈基米酱 / 蕾姆" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-pink-500">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">用户扮演的角色 (玩家身份)</label>
            <input type="text" id="char-edit-user-role" placeholder="例如: 主人 / 独行侦探 / 小明" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-pink-500">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">AI 与用户的关系</label>
            <input type="text" id="char-edit-user-relation" placeholder="例如: 青梅竹马 / 主仆 / 默契搭档" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-pink-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">角色标签/一句话介绍</label>
          <input type="text" id="char-edit-tagline" placeholder="粘人的赛博猫咪伴侣" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-pink-500">
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">系统设定/性格词 Prompt (无字数限制，支持长文本)</label>
          <textarea id="char-edit-prompt" rows="6" placeholder="可在此粘贴长篇大论的角色人生背景、语言风格、说话习惯、性格特征、能力、外观设定等..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-pink-500 min-h-[120px] max-h-[300px] overflow-y-auto"></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">开场第一句话 (无字数限制)</label>
          <textarea id="char-edit-greeting" rows="3" placeholder="喵~ 你终于来找我玩啦！" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-slate-200 focus:outline-none focus:border-pink-500 min-h-[70px] max-h-[150px] overflow-y-auto"></textarea>
        </div>

        <div class="flex items-center space-x-2">
          <input type="checkbox" id="char-edit-translate" class="rounded bg-slate-800 border-slate-700 text-pink-600 focus:ring-pink-500">
          <label for="char-edit-translate" class="text-xs text-slate-300">默认为此角色开启“用户输入自动转英文发送”</label>
        </div>
      </div>

  <!-- Modal: Create Group Chat -->
  <div id="modal-group-editor" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">

  <!-- Modal: Edit Message Text -->

  <!-- Context Menu for Message Long-Press / Right-Click -->
  <div id="context-menu" class="hidden fixed z-50 bg-slate-800/95 border border-slate-700 rounded-xl shadow-2xl py-1 text-sm text-slate-200 backdrop-blur w-36 overflow-hidden animate-popIn">
    <button id="ctx-reply" class="w-full text-left px-4 py-2 hover:bg-pink-600 hover:text-white flex items-center space-x-2">
      <i class="fa-solid fa-reply w-4"></i><span>回复</span>
    </button>
    <button id="ctx-edit" class="w-full text-left px-4 py-2 hover:bg-pink-600 hover:text-white flex items-center space-x-2">
      <i class="fa-solid fa-pen-to-square w-4"></i><span>编辑内容</span>
    </button>
    <button id="ctx-copy" class="w-full text-left px-4 py-2 hover:bg-pink-600 hover:text-white flex items-center space-x-2">
      <i class="fa-solid fa-copy w-4"></i><span>复制文本</span>
    </button>
    <button id="ctx-regen" class="w-full text-left px-4 py-2 hover:bg-pink-600 hover:text-white flex items-center space-x-2">
      <i class="fa-solid fa-rotate w-4"></i><span>重新生成</span>
    </button>
    <div class="border-t border-slate-700 my-1"></div>
    <button id="ctx-delete" class="w-full text-left px-4 py-2 hover:bg-red-600 hover:text-white text-red-400 flex items-center space-x-2">
      <i class="fa-solid fa-trash w-4"></i><span>撤回 / 删除</span>
    </button>
  </div>

  <!-- Main JavaScript App Logic -->
  <script>
    const PROVIDERS = {
      gemini: {
        baseUrl: 'https://generativelanguage.googleapis.com/v1beta/openai',
        model: 'gemini-2.5-flash-preview-09-2025'
      },
      deepseek: {
        baseUrl: 'https://api.deepseek.com/v1',
        model: 'deepseek-chat'
      },
      openai: {
        baseUrl: 'https://api.openai.com/v1',
        model: 'gpt-4o'
      },
      custom: {
        baseUrl: '',
        model: ''
      }
    };

    const DEFAULT_CONFIG = {
      provider: 'gemini',
      baseUrl: PROVIDERS.gemini.baseUrl,
      apiKey: '',
      model: PROVIDERS.gemini.model,
      maxTokens: 350,
      temperature: 0.85,
      uncensoredPrompt: true,
      appScale: '1.0'
    };

    const UNCENSORED_SYSTEM_INSTRUCTION = `
[System Directive for Creative Unrestricted Roleplay]
You are engaged in an unrestricted creative roleplay.
1. Stay in character strictly at all times. Never break character.
2. Maintain natural flow and continuity with previous conversation history.
`;

    let state = {
      config: JSON.parse(localStorage.getItem('hakimi_config')) || DEFAULT_CONFIG,
      characters: JSON.parse(localStorage.getItem('hakimi_characters')) || [],
      groups: JSON.parse(localStorage.getItem('hakimi_groups')) || [],
      activeSessionId: null,
      activeSessionType: 'char',
      sidebarTab: 'chats',
      messages: {},
      replyToMsgId: null,
      attachedImageData: null,
      chatMode: 'chat',
      longPressTimer: null,
      selectedMsgId: null
    };

    // Apply initial scale
    applyAppScale(state.config.appScale || '1.0');

    // Load messages
    state.characters.forEach(c => {
      const msgs = localStorage.getItem(`hakimi_msgs_${c.id}`);
      state.messages[c.id] = msgs ? JSON.parse(msgs) : [{ id: 'msg_' + Date.now(), role: 'assistant', content: c.greeting, timestamp: Date.now() }];
    });

    state.groups.forEach(g => {
      const msgs = localStorage.getItem(`hakimi_msgs_${g.id}`);
      state.messages[g.id] = msgs ? JSON.parse(msgs) : [{ id: 'msg_' + Date.now(), role: 'assistant', content: `欢迎来到群聊【${g.name}】！`, timestamp: Date.now() }];
    });

    if (state.characters.length > 0) {
      state.activeSessionId = state.characters[0].id;
      state.activeSessionType = 'char';
    }

    // --- DOM Elements ---
    const sidebarListEl = document.getElementById('sidebar-list');
    const msgContainerEl = document.getElementById('message-container');
    const chatFormEl = document.getElementById('chat-form');
    const chatInputEl = document.getElementById('chat-input');
    const chatTitleEl = document.getElementById('chat-title');
    const chatSubtitleEl = document.getElementById('chat-subtitle');
    const chatAvatarEl = document.getElementById('chat-avatar');
    const contextMenuEl = document.getElementById('context-menu');
    const createMenuEl = document.getElementById('menu-create');
    const replyIndicatorEl = document.getElementById('reply-indicator');
    const replyTargetTextEl = document.getElementById('reply-target-text');
    const translateStatusEl = document.getElementById('label-translate-status');
    const imagePreviewBarEl = document.getElementById('image-preview-bar');
    const attachedImageThumbEl = document.getElementById('attached-image-thumb');
    const chatModeSelectEl = document.getElementById('chat-mode-select');

    function init() {
      renderSidebar();
      renderActiveChat();
      setupEventListeners();
      autoResizeTextarea();
    }

    function applyAppScale(scaleVal) {
      const val = parseFloat(scaleVal) || 1.0;
      const scaler = document.getElementById('app-scaler');
      if (scaler) {
        scaler.style.zoom = val;
      }
      const previewEl = document.getElementById('label-scale-preview');
      if (previewEl) previewEl.textContent = `${Math.round(val * 100)}%`;
      const quickScaleEl = document.getElementById('label-quick-scale');
      if (quickScaleEl) quickScaleEl.textContent = `${Math.round(val * 100)}%`;
    }

    // --- Sidebar Render ---
    function renderSidebar() {
      sidebarListEl.innerHTML = '';

      if (state.sidebarTab === 'hall') {
        renderCharacterHall();
        return;
      }

      const hasChats = state.characters.length > 0 || state.groups.length > 0;
      if (!hasChats) {
        sidebarListEl.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-xs px-2 animate-fadeIn">
            <i class="fa-solid fa-comments text-3xl mb-2 text-slate-700"></i>
            <p class="mb-2">暂无会话</p>
            <p>点击右上角 <i class="fa-solid fa-plus text-pink-400"></i> 新建角色或群聊吧！</p>
          </div>
        `;
        return;
      }

      // Render Groups
      state.groups.forEach(group => {
        const isActive = state.activeSessionType === 'group' && group.id === state.activeSessionId;
        const lastMsg = (state.messages[group.id] && state.messages[group.id].length > 0)
          ? state.messages[group.id][state.messages[group.id].length - 1].content
          : '暂无消息';

        const item = document.createElement('div');
        item.className = `p-3 rounded-xl cursor-pointer transition flex items-center space-x-3 border ${
          isActive ? 'bg-pink-600/10 border-pink-500/50 text-white' : 'border-transparent hover:bg-slate-800/60 text-slate-400 hover:text-slate-200'
        }`;
        item.onclick = () => selectSession(group.id, 'group');

        item.innerHTML = `
          <div class="w-12 h-12 rounded-full bg-gradient-to-tr from-indigo-500 to-pink-500 flex items-center justify-center font-bold text-white shrink-0 shadow">
            👥
          </div>
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-center mb-0.5">
              <h4 class="font-semibold text-slate-200 truncate text-sm">${escapeHtml(group.name)}</h4>
              <span class="text-[10px] bg-indigo-900/60 text-indigo-300 px-1.5 py-0.5 rounded">群聊</span>
            </div>
            <p class="text-xs text-slate-500 truncate">${escapeHtml(lastMsg)}</p>
          </div>
        `;
        sidebarListEl.appendChild(item);
      });

      // Render Characters
      state.characters.forEach(char => {
        const isActive = state.activeSessionType === 'char' && char.id === state.activeSessionId;
        const lastMsg = (state.messages[char.id] && state.messages[char.id].length > 0)
          ? state.messages[char.id][state.messages[char.id].length - 1].content
          : char.greeting;

        const item = document.createElement('div');
        item.className = `p-3 rounded-xl cursor-pointer transition flex items-center space-x-3 border ${
          isActive ? 'bg-pink-600/10 border-pink-500/50 text-white' : 'border-transparent hover:bg-slate-800/60 text-slate-400 hover:text-slate-200'
        }`;
        item.onclick = () => selectSession(char.id, 'char');

        item.innerHTML = `
          <img class="w-12 h-12 rounded-full object-cover shrink-0 border border-slate-700 shadow" src="${char.avatar}" alt="${char.name}">
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-center mb-0.5">
              <h4 class="font-semibold text-slate-200 truncate text-sm">${escapeHtml(char.name)}</h4>
              ${char.autoTranslate ? '<span class="text-[10px] bg-pink-900/60 text-pink-300 px-1 rounded">转英文</span>' : ''}
            </div>
            <p class="text-xs text-slate-500 truncate">${escapeHtml(lastMsg)}</p>
          </div>
        `;
        sidebarListEl.appendChild(item);
      });
    }

    function renderCharacterHall() {
      if (state.characters.length === 0) {
        sidebarListEl.innerHTML = `
          <div class="text-center py-12 text-slate-500 text-xs px-2 animate-fadeIn">
            <p>大厅暂无角色，快去右上角创建吧！</p>
          </div>
        `;
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'grid grid-cols-1 gap-3 p-1 animate-fadeIn';

      state.characters.forEach(char => {
        const card = document.createElement('div');
        card.className = 'bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 hover:border-pink-500/50 rounded-xl p-3 cursor-pointer transition flex items-center space-x-3 group shadow';
        card.onclick = () => {
          selectSession(char.id, 'char');
          setSidebarTab('chats');
        };

        card.innerHTML = `
          <img class="w-14 h-14 rounded-full object-cover shrink-0 border-2 border-pink-500/40 group-hover:scale-105 transition" src="${char.avatar}">
          <div class="flex-1 min-w-0">
            <h4 class="font-bold text-slate-100 text-sm truncate group-hover:text-pink-300 transition">${escapeHtml(char.name)}</h4>
            <p class="text-xs text-slate-400 truncate mt-0.5">${escapeHtml(char.tagline || '未设置一句话介绍')}</p>
            <div class="flex items-center space-x-2 mt-1.5 text-[10px] text-slate-500">
              ${char.userRole ? `<span class="bg-slate-900 px-1.5 py-0.5 rounded text-slate-400">你: ${escapeHtml(char.userRole)}</span>` : ''}
              ${char.userRelation ? `<span class="bg-slate-900 px-1.5 py-0.5 rounded text-slate-400">关系: ${escapeHtml(char.userRelation)}</span>` : ''}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      sidebarListEl.appendChild(grid);
    }

    function setSidebarTab(tab) {
      state.sidebarTab = tab;
      const tabChats = document.getElementById('tab-chats');
      const tabHall = document.getElementById('tab-hall');

      if (tab === 'chats') {
        tabChats.className = 'flex-1 py-3 text-center border-b-2 border-pink-500 text-pink-400 transition flex items-center justify-center gap-1.5';
        tabHall.className = 'flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition flex items-center justify-center gap-1.5';
      } else {
        tabHall.className = 'flex-1 py-3 text-center border-b-2 border-pink-500 text-pink-400 transition flex items-center justify-center gap-1.5';
        tabChats.className = 'flex-1 py-3 text-center border-b-2 border-transparent hover:text-slate-200 transition flex items-center justify-center gap-1.5';
      }
      renderSidebar();
    }

    function selectSession(id, type) {
      state.activeSessionId = id;
      state.activeSessionType = type;
      renderSidebar();
      renderActiveChat();
      document.getElementById('sidebar').classList.add('hidden', 'md:flex');
    }

    function renderActiveChat() {
      if (!state.activeSessionId) {
        chatTitleEl.innerHTML = `<span>未选择会话</span>`;
        chatSubtitleEl.textContent = '请创建或选择一个角色';
        chatAvatarEl.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=empty';
        chatInputEl.placeholder = '发送消息...';
        msgContainerEl.innerHTML = `
          <div class="h-full flex flex-col items-center justify-center text-slate-500 text-sm space-y-3 animate-fadeIn">
            <i class="fa-solid fa-user-plus text-4xl text-slate-700"></i>
            <p>没有选中的会话，请点击右上角“+”创建角色或群聊</p>
          </div>
        `;
        return;
      }

      if (state.activeSessionType === 'group') {
        const group = state.groups.find(g => g.id === state.activeSessionId);
        if (!group) return;

        chatTitleEl.innerHTML = `<span>${escapeHtml(group.name)}</span>`;
        chatSubtitleEl.textContent = `群成员: ${group.charIds.map(id => state.characters.find(c => c.id === id)?.name).filter(Boolean).join(', ')}`;
        chatAvatarEl.src = 'https://api.dicebear.com/7.x/bottts/svg?seed=' + encodeURIComponent(group.name);
        chatInputEl.placeholder = `在群聊【${group.name}】发发言...`;
      } else {
        const char = getCurrentChar();
        if (!char) return;

        chatTitleEl.innerHTML = `<span>${escapeHtml(char.name)}</span>`;
        let subText = char.tagline || 'AI Roleplay Partner';
        if (char.userRole || char.userRelation) {
          subText = `${char.userRole ? '你的身份: ' + char.userRole : ''} ${char.userRelation ? '(' + char.userRelation + ')' : ''}`;
        }
        chatSubtitleEl.textContent = subText;
        chatAvatarEl.src = char.avatar;
        chatInputEl.placeholder = `发送给 ${char.name}...`;
      }

      updateTranslateBtnState();

      const msgs = state.messages[state.activeSessionId] || [];
      msgContainerEl.innerHTML = '';

      msgs.forEach(msg => {
        const msgEl = createMessageElement(msg);
        msgContainerEl.appendChild(msgEl);
      });

      scrollToBottom();
    }

    function createMessageElement(msg) {
      const isUser = msg.role === 'user';
      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} my-2 text-slate-100 group relative touch-callout-none animate-fadeIn`;
      wrapper.dataset.msgId = msg.id;

      const inner = document.createElement('div');
      inner.className = `flex items-start space-x-2 max-w-[85%] ${isUser ? 'flex-row-reverse space-x-reverse' : 'flex-row'}`;

      let avatarSrc = 'https://api.dicebear.com/7.x/bottts/svg?seed=user_master';
      let senderName = '你';

      if (!isUser) {
        if (msg.charId) {
          const char = state.characters.find(c => c.id === msg.charId);
          if (char) {
            avatarSrc = char.avatar;
            senderName = char.name;
          }
        } else {
          const char = getCurrentChar();
          if (char) {
            avatarSrc = char.avatar;
            senderName = char.name;
          }
        }
      }

      const bubble = document.createElement('div');
      bubble.className = `p-3.5 rounded-2xl text-sm leading-relaxed shadow-md relative ${
        isUser 
          ? 'bg-pink-600 text-white rounded-tr-none' 
          : 'bg-slate-800 text-slate-100 border border-slate-700/60 rounded-tl-none'
      }`;

      let replyHtml = '';
      if (msg.replyTo) {
        replyHtml = `<div class="text-xs border-l-2 border-pink-400 pl-2 mb-1 opacity-75 line-clamp-1 italic">
          ${escapeHtml(msg.replyTo.content)}
        </div>`;
      }

      let imageHtml = '';
      if (msg.image) {
        imageHtml = `<img src="${msg.image}" class="max-w-xs max-h-48 rounded-lg mb-2 object-cover border border-slate-700 shadow">`;
      }

      let translatedInfo = '';
      if (msg.translatedText) {
        translatedInfo = `<div class="text-[10px] text-pink-300/80 border-t border-pink-400/20 pt-1 mt-1 font-mono">
          [已转英文]: ${escapeHtml(msg.translatedText)}
        </div>`;
      }

      let senderHeader = '';
      if (!isUser && state.activeSessionType === 'group') {
        senderHeader = `<div class="text-[11px] font-semibold text-pink-400 mb-1">${escapeHtml(senderName)}</div>`;
      }

      bubble.innerHTML = `
        ${senderHeader}
        ${replyHtml}
        ${imageHtml}
        <div class="whitespace-pre-wrap break-words">${escapeHtml(msg.content)}</div>
        ${translatedInfo}
      `;

      inner.innerHTML = `
        <img class="w-8 h-8 rounded-full object-cover shrink-0 mt-0.5 border border-slate-700 shadow" src="${avatarSrc}">
      `;
      inner.appendChild(bubble);
      wrapper.appendChild(inner);

      setupContextMenuEvents(wrapper, msg);

      return wrapper;
    }

    function setupContextMenuEvents(element, msg) {
      const startTouch = () => {
        state.longPressTimer = setTimeout(() => {
          showContextMenu(msg, element);
        }, 450);
      };

      const cancelTouch = () => {
        if (state.longPressTimer) clearTimeout(state.longPressTimer);
      };

      element.addEventListener('touchstart', startTouch, { passive: true });
      element.addEventListener('touchend', cancelTouch);
      element.addEventListener('touchmove', cancelTouch);

      element.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showContextMenu(msg, element, e.clientX, e.clientY);
      });
    }

    function showContextMenu(msg, element, clientX, clientY) {
      state.selectedMsgId = msg.id;

      const rect = element.getBoundingClientRect();
      const x = clientX || (rect.left + rect.width / 2);
      const y = clientY || (rect.top + rect.height / 2);

      contextMenuEl.style.left = `${Math.min(x, window.innerWidth - 160)}px`;
      contextMenuEl.style.top = `${Math.min(y, window.innerHeight - 200)}px`;
      contextMenuEl.classList.remove('hidden');

      const regenBtn = document.getElementById('ctx-regen');
      if (msg.role === 'assistant') {
        regenBtn.classList.remove('hidden');
      } else {
        regenBtn.classList.add('hidden');
      }
    }

    // --- Message Sending & API Integration ---
    async function handleSendMessage(e) {
      if (e) e.preventDefault();
      const text = chatInputEl.value.trim();
      const hasImage = !!state.attachedImageData;

      if (!text && !hasImage) return;

      if (!state.activeSessionId) {
        alert('请先创建或选择一个角色/群聊！');
        return;
      }

      chatInputEl.value = '';
      autoResizeTextarea();

      const imageToSend = state.attachedImageData;
      clearAttachedImage();

      let replyToObj = null;
      if (state.replyToMsgId) {
        const msgs = state.messages[state.activeSessionId] || [];
        const target = msgs.find(m => m.id === state.replyToMsgId);
        if (target) {
          replyToObj = { id: target.id, content: target.content };
        }
        clearReplyIndicator();
      }

      const char = getCurrentChar();
      let translatedText = null;
      if (char && char.autoTranslate && text) {
        showLoadingIndicator('正在快速翻译为英文...');
        translatedText = await translateToEnglish(text);
        removeLoadingIndicator();
      }

      const userMsg = {
        id: 'msg_' + Date.now(),
        role: 'user',
        content: text,
        image: imageToSend,
        translatedText: translatedText,
        replyTo: replyToObj,
        timestamp: Date.now()
      };

      if (!state.messages[state.activeSessionId]) state.messages[state.activeSessionId] = [];
      state.messages[state.activeSessionId].push(userMsg);
      saveMessages(state.activeSessionId);
      renderActiveChat();

      if (state.activeSessionType === 'group') {
        await fetchGroupAIResponses();
      } else {
        await fetchSingleAIResponse(char);
      }
    }

    async function translateToEnglish(text) {
      if (!state.config.apiKey) return null;
      try {
        const response = await fetch(`${state.config.baseUrl}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.config.apiKey}` },
          body: JSON.stringify({
            model: state.config.model,
            messages: [
              { role: 'system', content: 'Direct translate Chinese to natural spoken English. Output ONLY translated English without extra explanation.' },
              { role: 'user', content: text }
            ],
            temperature: 0.2
          })
        });
        const data = await response.json();
        return data.choices?.[0]?.message?.content?.trim() || null;
      } catch (err) {
        console.error('Translation failed:', err);
        return null;
      }
    }

    async function fetchSingleAIResponse(char) {
      if (!state.config.apiKey) {
        alert('请先在顶部设置 (齿轮图标) 中填写您的 API Key！');
        return;
      }

      showLoadingIndicator(`${char.name} 正在思考回复...`);

      try {
        const apiMessages = buildApiPayloadForChar(char);

        const response = await fetch(`${state.config.baseUrl}/chat/completions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.config.apiKey}` },
          body: JSON.stringify({
            model: state.config.model,
            messages: apiMessages,
            max_tokens: parseInt(state.config.maxTokens) || 350,
            temperature: parseFloat(state.config.temperature) || 0.85
          })
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error?.message || '网络请求错误');
        }

        const data = await response.json();
        const aiText = data.choices?.[0]?.message?.content || '(AI 未响应)';

        const assistantMsg = {
          id: 'msg_' + Date.now(),
          role: 'assistant',
          charId: char.id,
          content: aiText,
          timestamp: Date.now()
        };

        state.messages[char.id].push(assistantMsg);
        saveMessages(char.id);

      } catch (err) {
        alert(`请求失败: ${err.message}`);
      } finally {
        removeLoadingIndicator();
        renderActiveChat();
      }
    }

    async function fetchGroupAIResponses() {
      if (!state.config.apiKey) return alert('请先配置 API Key');

      const group = state.groups.find(g => g.id === state.activeSessionId);
      if (!group || group.charIds.length === 0) return;

      const groupChars = group.charIds.map(id => state.characters.find(c => c.id === id)).filter(Boolean);

      for (const char of groupChars) {
        showLoadingIndicator(`[群聊] ${char.name} 正在准备发言...`);

        try {
          const apiMessages = buildApiPayloadForGroupChar(char, group);

          const response = await fetch(`${state.config.baseUrl}/chat/completions`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${state.config.apiKey}` },
            body: JSON.stringify({
              model: state.config.model,
              messages: apiMessages,
              max_tokens: parseInt(state.config.maxTokens) || 300,
              temperature: 0.85
            })
          });

          if (response.ok) {
            const data = await response.json();
            const aiText = data.choices?.[0]?.message?.content || '...';

            const assistantMsg = {
              id: 'msg_' + Date.now(),
              role: 'assistant',
              charId: char.id,
              content: aiText,
              timestamp: Date.now()
            };

            state.messages[group.id].push(assistantMsg);
            saveMessages(group.id);
            renderActiveChat();
          }
        } catch (e) {
          console.error(e);
        }
      }
      removeLoadingIndicator();
    }

    function buildApiPayloadForChar(char) {
      const payload = [];

      let systemPrompt = `[AI Character Name]: ${char.name}\n`;
      if (char.userRole) systemPrompt += `[User Persona / Role]: ${char.userRole}\n`;
      if (char.userRelation) systemPrompt += `[Relationship with User]: ${char.userRelation}\n`;
      if (char.prompt) systemPrompt += `[Character Traits & Personality Instructions]:\n${char.prompt}\n`;

      if (state.chatMode === 'rp') {
        systemPrompt += `\n[RP Mode Active]: You MUST write vivid roleplay reactions, actions, and psychological descriptions enclosed in asterisks (e.g. *smiles warmly and steps closer*).`;
      } else {
        systemPrompt += `\n[Chat Mode Active]: Direct, natural conversation in 1-3 sentences. Keep replies concise and lively.`;
      }

      if (state.config.uncensoredPrompt) {
        systemPrompt = UNCENSORED_SYSTEM_INSTRUCTION + '\n' + systemPrompt;
      }

      if (char.memory) systemPrompt += `\n[Memory Context about User]: ${char.memory}`;

      payload.push({ role: 'system', content: systemPrompt });

      const allMsgs = state.messages[char.id] || [];
      const recentMsgs = allMsgs.slice(-15);

      recentMsgs.forEach(m => {
        const textContent = m.translatedText || m.content;
        if (m.image) {
          payload.push({
            role: m.role,
            content: [
              { type: 'text', text: textContent || 'Look at this image.' },
              { type: 'image_url', image_url: { url: m.image } }
            ]
          });
        } else {
          payload.push({ role: m.role, content: textContent });
        }
      });

      return payload;
    }

    function buildApiPayloadForGroupChar(char, group) {
      const payload = [];
      let systemPrompt = `You are playing the character ${char.name} in a group chat named "${group.name}".\n`;
      systemPrompt += `Character Personality:\n${char.prompt || 'Be lively.'}\n`;
      systemPrompt += `React dynamically to the user and other group members in character. Keep responses brief (1-3 sentences).`;

      if (state.config.uncensoredPrompt) {
        systemPrompt = UNCENSORED_SYSTEM_INSTRUCTION + '\n' + systemPrompt;
      }

      payload.push({ role: 'system', content: systemPrompt });

      const allMsgs = state.messages[group.id] || [];
      const recentMsgs = allMsgs.slice(-15);

      recentMsgs.forEach(m => {
        let prefix = '';
        if (m.role === 'assistant' && m.charId) {
          const senderChar = state.characters.find(c => c.id === m.charId);
          prefix = senderChar ? `[${senderChar.name}]: ` : '';
        } else if (m.role === 'user') {
          prefix = '[User]: ';
        }

        payload.push({
          role: m.role,
          content: prefix + (m.translatedText || m.content)
        });
      });

      return payload;
    }

    function exportDataToFile() {
      const dataStr = JSON.stringify(state, null, 2);
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", url);
      downloadAnchor.setAttribute("download", `hakimi_ai_archive_${Date.now()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      URL.revokeObjectURL(url);
    }

    function setupContextMenuHandlers() {
      document.getElementById('ctx-reply').onclick = () => {
        const msgs = state.messages[state.activeSessionId] || [];
        const msg = msgs.find(m => m.id === state.selectedMsgId);
        if (msg) {
          state.replyToMsgId = msg.id;
          replyTargetTextEl.textContent = msg.content;
          replyIndicatorEl.classList.remove('hidden');
          chatInputEl.focus();
        }
      };

      document.getElementById('ctx-edit').onclick = () => {
        const msgs = state.messages[state.activeSessionId] || [];
        const msg = msgs.find(m => m.id === state.selectedMsgId);
        if (msg) {
          document.getElementById('edit-msg-input').value = msg.content;
          showModal('modal-edit-msg');
        }
      };

      document.getElementById('ctx-copy').onclick = () => {
        const msgs = state.messages[state.activeSessionId] || [];
        const msg = msgs.find(m => m.id === state.selectedMsgId);
        if (msg) {
          const tempInput = document.createElement('textarea');
          tempInput.value = msg.content;
          document.body.appendChild(tempInput);
          tempInput.select();
          document.execCommand('copy');
          document.body.removeChild(tempInput);
        }
      };

      document.getElementById('ctx-regen').onclick = async () => {
        let msgs = state.messages[state.activeSessionId] || [];
        const index = msgs.findIndex(m => m.id === state.selectedMsgId);
        if (index !== -1) {
          msgs.splice(index);
          saveMessages(state.activeSessionId);
          renderActiveChat();
          if (state.activeSessionType === 'group') {
            await fetchGroupAIResponses();
          } else {
            await fetchSingleAIResponse(getCurrentChar());
          }
        }
      };

      document.getElementById('ctx-delete').onclick = () => {
        let msgs = state.messages[state.activeSessionId] || [];
        state.messages[state.activeSessionId] = msgs.filter(m => m.id !== state.selectedMsgId);
        saveMessages(state.activeSessionId);
        renderActiveChat();
      };

      document.getElementById('btn-confirm-edit-msg').onclick = () => {
        const newText = document.getElementById('edit-msg-input').value.trim();
        if (newText && state.selectedMsgId) {
          let msgs = state.messages[state.activeSessionId] || [];
          const target = msgs.find(m => m.id === state.selectedMsgId);
          if (target) {
            target.content = newText;
            saveMessages(state.activeSessionId);
            renderActiveChat();
          }
        }
        hideModal('modal-edit-msg');
      };

      document.getElementById('btn-cancel-reply').onclick = clearReplyIndicator;
    }

      } else {
        translateStatusEl.textContent = '转英文: 关';
        translateStatusEl.parentElement.classList.remove('bg-pink-600/30', 'border-pink-500', 'text-pink-200');
      }

    function getCurrentChar() {
      if (state.activeSessionType === 'char') {
        return state.characters.find(c => c.id === state.activeSessionId) || state.characters[0] || null;
      }
      return null;
    }

    function saveCharacters() {
