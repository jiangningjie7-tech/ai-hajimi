<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>流光 AI</title>
  <style>
    :root {
      --bg-main: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #f1f5f9;
      --primary: #1A73E2;
      --primary-light: #e8f0fe;
      --chat-bg: #f3f3f3;
      --user-bubble: #95EC69;
      --user-bubble-normal: #e2e8f0;
      --ai-bubble: #ffffff;
      --header-bg: #ededed;
      --base-font-size: 17px;
    }

    body.dark-theme {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
      --primary: #3b82f6;
      --primary-light: #1e293b;
      --chat-bg: #111827;
      --user-bubble: #059669;
      --user-bubble-normal: #334155;
      --ai-bubble: #1f2937;
      --header-bg: #1f2937;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      overscroll-behavior-y: none;
      overscroll-behavior-x: none;
      touch-action: manipulation;
    }

    body { 
      background-color: var(--bg-main); 
      height: 100dvh; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      color: var(--text-main); 
      transition: background-color 0.3s; 
      overflow: hidden; 
      font-size: var(--base-font-size); 
    }
    
    #app { 
      width: 100%; 
      max-width: 100%; 
      height: 100dvh; 
      background: var(--bg-card); 
      display: flex; 
      flex-direction: column; 
      position: relative; 
      overflow: hidden; 
      transition: max-width 0.3s ease;
      box-shadow: 0 0 20px rgba(0,0,0,0.08);
    }

    /* 全屏启动图界面 */
    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    #splash-screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 修复登录界面在网页壳中卡掉/显示不全的问题 */
    #login-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-card);
      z-index: 200;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 30px 24px;
      gap: 18px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-top: max(30px, env(safe-area-inset-top));
      padding-bottom: max(30px, env(safe-area-inset-bottom));
    }
    #login-screen h2 {
      text-align: center;
      color: var(--primary);
      margin-bottom: 10px;
      font-size: 26px;
    }
    .login-toggle {
      display: flex;
      justify-content: space-around;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    .login-toggle span {
      cursor: pointer;
      color: var(--text-sub);
      font-weight: 600;
    }
    .login-toggle span.active {
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
    }
    
    main { flex: 1; min-height: 0; overflow: hidden; position: relative; }
    
    .tab-content { 
      width: 100%; 
      height: 100%; 
      display: none; 
      flex-direction: column; 
      overflow-y: auto; 
      opacity: 0; 
      transform: scale(0.95) translateY(12px); 
      filter: blur(10px);
      transition: all 0.35s cubic-bezier(0.32, 0.72, 0, 1); 
      overscroll-behavior-y: contain;
    }
    .tab-content.active { 
      display: flex; 
      opacity: 1; 
      transform: scale(1) translateY(0); 
      filter: blur(0px);
    }
    
    .chat-item { padding: 22px 24px; display: flex; align-items: center; gap: 18px; border-bottom: 1px solid var(--border-color); cursor: pointer; user-select: none; position: relative; }
    .chat-item:active { background: var(--border-color); }
    .avatar { width: 66px; height: 66px; border-radius: 50%; background: var(--primary-light); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: calc(var(--base-font-size) + 8px); flex-shrink: 0; overflow: hidden; cursor: pointer; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .msg-avatar { width: 58px !important; height: 58px !important; font-size: 22px !important; }

    .chat-info { flex: 1; min-width: 0; }
    .chat-title { display: flex; justify-content: space-between; margin-bottom: 8px; }
    .chat-name { font-weight: 600; font-size: calc(var(--base-font-size) + 4px); color: var(--text-main); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pinned-tag { font-size: calc(var(--base-font-size) - 3px); background: var(--primary); color: #fff; padding: 3px 8px; border-radius: 6px; }
    .system-tag { font-size: calc(var(--base-font-size) - 3px); background: #10b981; color: #fff; padding: 3px 8px; border-radius: 6px; }
    .online-tag { font-size: calc(var(--base-font-size) - 3px); background: #f59e0b; color: #fff; padding: 3px 8px; border-radius: 6px; }
    .chat-last { font-size: calc(var(--base-font-size) + 1px); color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .form-group { padding: 24px; display: flex; flex-direction: column; gap: 20px; }
    .form-group label { font-size: calc(var(--base-font-size) + 2px); font-weight: 600; color: var(--text-sub); }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 16px 18px; border: 1px solid var(--border-color); border-radius: 14px; font-size: calc(var(--base-font-size) + 2px); outline: none; background: var(--bg-card); color: var(--text-main); }
    .form-group textarea { height: 110px; resize: none; }
    .row-group { display: flex; gap: 14px; }
    .row-group > div { flex: 1; }
    .checkbox-group { display: flex; gap: 14px; align-items: center; padding: 18px; background: var(--primary-light); border-radius: 14px; }
    .btn { background: var(--primary); color: #fff; padding: 18px; border: none; border-radius: 14px; font-weight: 600; font-size: calc(var(--base-font-size) + 2px); cursor: pointer; text-align: center; }
    .btn-secondary { background: var(--primary-light); color: var(--primary); }

    #chat-screen { 
      position: absolute; inset: 0; background: var(--bg-card); z-index: 50; display: flex; flex-direction: column; 
      opacity: 0; transform: translateY(100%); pointer-events: none;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    #chat-screen.active { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .chat-header { height: 76px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; background: var(--header-bg); flex-shrink: 0; }
    .back-btn { background: none; border: none; color: var(--primary); font-size: calc(var(--base-font-size) + 4px); font-weight: 600; cursor: pointer; }
    
    .chat-body-wrapper { flex: 1; display: flex; position: relative; overflow: hidden; }
    .messages-list { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 18px; background: var(--chat-bg); overscroll-behavior-y: contain; }
    
    .fast-scroll-bar { width: 18px; background: rgba(0,0,0,0.03); position: relative; cursor: pointer; touch-action: none; user-select: none; }
    .fast-scroll-thumb { width: 100%; height: 52px; background: var(--primary); opacity: 0.6; border-radius: 20px; position: absolute; top: 0; left: 0; }

    .msg-row { display: flex; gap: 14px; user-select: none; align-items: flex-start; }
    .msg-row.user { flex-direction: row-reverse; }

    .bubble { max-width: 80%; padding: 16px 20px; border-radius: 22px; font-size: calc(var(--base-font-size) + 2px); line-height: 1.5; word-break: break-all; white-space: pre-wrap; }
    .msg-row.user .bubble.online-mode { background: var(--user-bubble); color: #000; }
    .msg-row.user .bubble.normal-mode { background: var(--user-bubble-normal); color: var(--text-main); }
    .msg-row.ai .bubble { background: var(--ai-bubble); color: var(--text-main); border: 1px solid var(--border-color); }
    
    .sticker-bubble { max-width: 180px; padding: 0; background: transparent !important; border: none !important; }
    .sticker-bubble img { width: 100%; max-height: 180px; object-fit: contain; border-radius: 14px; display: block; }
    
    .image-bubble { max-width: 220px; padding: 4px; background: transparent !important; border: none !important; }
    .image-bubble img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 14px; display: block; cursor: pointer; }

    .system-notice { text-align: center; font-size: calc(var(--base-font-size) - 1px); color: var(--text-sub); margin: 10px 0; }

    .chat-footer-wrapper {
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--border-color);
      background: var(--bg-card);
      flex-shrink: 0;
      width: 100%;
    }
    .image-preview-bar {
      display: none;
      padding: 8px 14px;
      align-items: center;
      gap: 10px;
      background: var(--primary-light);
    }
    .image-preview-bar img {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 8px;
    }
    .image-preview-bar .remove-img-btn {
      color: #ef4444;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
    }

    .chat-footer { 
      padding: 10px 14px; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      width: 100%;
    }
    .chat-footer input { 
      flex: 1; 
      min-width: 0; 
      padding: 12px 16px; 
      border-radius: 24px; 
      border: 1px solid var(--border-color); 
      outline: none; 
      font-size: calc(var(--base-font-size) + 1px); 
      background: var(--bg-card); 
      color: var(--text-main); 
    }
    .chat-footer button { 
      flex-shrink: 0; 
      padding: 12px 16px; 
      border-radius: 24px; 
      border: none; 
      background: var(--primary); 
      color: #fff; 
      font-size: calc(var(--base-font-size)); 
      font-weight: 600; 
      cursor: pointer; 
      white-space: nowrap;
    }
    .chat-footer .btn-upload-img {
      background: var(--primary-light);
      color: var(--primary);
      padding: 12px 14px;
      font-size: 18px;
    }
    .chat-footer .btn-continue { 
      background: var(--primary-light); 
      color: var(--primary); 
      display: none; 
    }

    nav { 
      height: calc(82px + env(safe-area-inset-bottom, 0px)); 
      padding-bottom: env(safe-area-inset-bottom, 0px);
      border-top: 1px solid var(--border-color); 
      display: flex; 
      justify-content: space-around; 
      align-items: center; 
      background: rgba(255, 255, 255, 0.85); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 20; 
      flex-shrink: 0;
    }
    body.dark-theme nav {
      background: rgba(30, 41, 59, 0.85);
    }
    nav.nav-hidden { display: none !important; }

    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: calc(var(--base-font-size) + 2px); color: var(--text-sub); cursor: pointer; flex: 1; font-weight: 600; transition: transform 0.2s ease; }
    .nav-item:active { transform: scale(0.92); }
    .nav-item.active { color: var(--primary); font-weight: bold; }
    .nav-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--text-sub); transition: all 0.2s ease; }
    .nav-item.active .nav-dot { background: var(--primary); transform: scale(1.3); }
    
    .popup-menu { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 100; display: none; justify-content: center; align-items: center; backdrop-filter: blur(2px); }
    .popup-content { background: var(--bg-card); border-radius: 16px; width: 320px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-height: 80vh; display: flex; flex-direction: column; }
    .popup-item { padding: 18px 22px; font-size: calc(var(--base-font-size) + 2px); border-bottom: 1px solid var(--border-color); cursor: pointer; color: var(--text-main); }
    .popup-item:active { background: var(--border-color); }

    .sponsor-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 130; display: none; justify-content: center; align-items: center; backdrop-filter: blur(4px); }
    .sponsor-box { background: var(--bg-card); border-radius: 20px; width: 320px; padding: 24px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .sponsor-box img { width: 100%; max-height: 300px; object-fit: contain; border-radius: 12px; border: 1px solid var(--border-color); }

    .cropper-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 120; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    .cropper-container { width: 320px; height: 320px; background: #000; position: relative; overflow: hidden; border: 2px solid var(--primary); border-radius: 16px; touch-action: none; }
    .cropper-container canvas { width: 100%; height: 100%; cursor: move; }

    .dev-badge {
      text-align: center;
      padding: 16px 0 8px;
      font-size: calc(var(--base-font-size) - 1px);
      color: var(--text-sub);
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .usage-info-box {
      background: var(--primary-light);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: -8px;
    }
    .usage-info-box span.num {
      color: var(--primary);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <!-- 全屏启动图界面 -->
  <div id="splash-screen">
    <img src="qidong.png" alt="启动界面">
  </div>

  <div id="app">
    <div id="login-screen">
      <h2>流光 AI 登录</h2>
      <div class="login-toggle">
        <span id="tab-btn-user" class="active" onclick="switchLoginMode('user')">用户登录</span>
        <span id="tab-btn-admin" onclick="switchLoginMode('admin')">管理员通道</span>
      </div>
      
      <div id="user-login-form" class="form-group" style="padding:0;">
        <input type="text" id="l-username" placeholder="请输入用户名">
        <input type="password" id="l-password" placeholder="请输入密码">
        <input type="password" id="l-code" placeholder="请输入邀请码">
        <button class="btn" onclick="handleUserLogin()">登录 / 注册</button>
      </div>

      <div id="admin-login-form" class="form-group" style="padding:0; display:none;">
        <input type="password" id="l-admin-pass" placeholder="请输入管理员密码">
        <button class="btn" onclick="handleAdminLogin()">管理员一键进入</button>
      </div>
    </div>

    <main>
      <div id="tab-chats" class="tab-content active">
        <div id="chat-list-container"></div>
      </div>

      <div id="tab-hall" class="tab-content">
        <div id="hall-list-container" class="form-group"></div>
      </div>

      <div id="tab-create" class="tab-content">
        <div class="form-group">
          <input type="hidden" id="c-edit-id">
          <label>角色头像</label>
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="avatar" id="c-avatar-preview">AI</div>
            <button class="btn" style="padding:12px 20px; font-size:16px;" onclick="triggerCrop('char')">选择并裁剪</button>
          </div>

          <div class="row-group">
            <div>
              <label>角色名字</label>
              <input type="text" id="c-name" placeholder="如：林苏">
            </div>
            <div>
              <label>用户名字</label>
              <input type="text" id="c-user-name" placeholder="如：小明">
            </div>
          </div>

          <div class="row-group">
            <div>
              <label>AI 性别</label>
              <select id="c-gender">
                <option value="女">女</option>
                <option value="男">男</option>
                <option value="保密">保密</option>
              </select>
            </div>
            <div>
              <label>用户性别</label>
              <select id="c-user-gender">
                <option value="男">男</option>
                <option value="女">女</option>
                <option value="保密">保密</option>
              </select>
            </div>
          </div>

          <label>角色描述</label>
          <input type="text" id="c-desc" placeholder="简短介绍">
          <label>详细人设</label>
          <textarea id="c-persona" placeholder="性格特点、说话语气、习惯等"></textarea>
          <label>人物关系</label>
          <input type="text" id="c-relation" placeholder="如：青梅竹马、同事、师徒">
          <label>世界观</label>
          <input type="text" id="c-worldview" placeholder="如：赛博朋克、现代都市、高魔幻想">

          <div class="checkbox-group">
            <input type="checkbox" id="c-online" checked>
            <span style="font-size: 17px; font-weight: 600;">模拟线上聊天模式</span>
          </div>
          <button class="btn" onclick="saveCharacter()" id="btn-save-char">创建角色</button>
        </div>
      </div>

      <div id="tab-settings" class="tab-content">
        <div class="form-group">
          <label>用户个人头像</label>
          <div style="display:flex; align-items:center; gap:16px;">
            <div class="avatar" id="user-avatar-preview">我</div>
            <button class="btn" style="padding:12px 20px; font-size:16px;" onclick="triggerCrop('user')">上传并裁剪</button>
          </div>

          <!-- AI 模型选择 -->
          <label>AI 模型选择</label>
          <select id="s-selected-model" onchange="onModelChange(this.value)">
            <option value="advanced">高级模型（50次/天）</option>
            <option value="glm-4-flash" selected>普通模型（100次/天）</option>
          </select>
          
          <!-- 详细剩余次数看板 -->
          <div class="usage-info-box">
            <div>普通模型今日剩余：<span id="normal-remaining-count" class="num">100</span> / 100 次</div>
            <div>高级模型今日剩余：<span id="advanced-remaining-count" class="num">50</span> / 50 次</div>
            <div>图片识别今日剩余：<span id="vision-remaining-count" class="num">30</span> / 30 次</div>
            <div style="font-size:12px; color:var(--text-sub); margin-top:2px;">* 额度将在每24小时（每日零点）自动恢复全额</div>
          </div>

          <div class="row-group">
            <div>
              <label>界面模式</label>
              <select id="s-theme" onchange="toggleTheme(this.value)">
                <option value="light">白天模式</option>
                <option value="dark">夜晚模式</option>
              </select>
            </div>
            <div>
              <label>字体大小</label>
              <select id="s-fontsize" onchange="adjustFontSize(this.value)">
                <option value="15px">小号 (15px)</option>
                <option value="17px" selected>标准 (17px)</option>
                <option value="19px">大号 (19px)</option>
                <option value="21px">特大 (21px)</option>
              </select>
            </div>
          </div>

          <label>屏幕适配比例</label>
          <select id="s-width" onchange="adjustWidth(this.value)">
            <option value="100%" selected>全屏自适应填充 (100%)</option>
            <option value="calc(100vh * (9 / 19.5))">全面屏手机 (9 : 19.5)</option>
            <option value="calc(100vh * (9 / 16))">标准手机 (9 : 16)</option>
            <option value="calc(100vh * (9 / 21))">带状窄屏 (9 : 21)</option>
            <option value="calc(100vh * (3 / 4))">平板比例 (3 : 4)</option>
          </select>

          <button class="btn" onclick="saveSettings()">保存全套设置</button>

          <!-- 重置高级模型与全部使用次数功能 -->
          <button class="btn btn-secondary" style="background:#e0e7ff; color:#3730a3; margin-top:6px;" onclick="resetAllUsageCountWithPassword()">重置所有模型使用次数</button>

          <hr style="border:none; border-top:1px solid var(--border-color); margin:10px 0;">
          
          <button class="btn btn-secondary" style="background:#fef3c7; color:#d97706;" onclick="showSponsorOptions()">求赞助 💖</button>
          <div style="font-size:13px; color:var(--text-sub); text-align:center; margin-top:-12px;">不赞助也可以完全免费使用哦~</div>

          <hr style="border:none; border-top:1px solid var(--border-color); margin:10px 0;">

          <label>数据备份与恢复</label>
          <div class="row-group">
            <button class="btn btn-secondary" onclick="exportData()">导出应用数据</button>
            <button class="btn btn-secondary" onclick="document.getElementById('import-file').click()">恢复应用数据</button>
          </div>
          <input type="file" id="import-file" accept=".json" style="display:none;" onchange="importData(event)">

          <button class="btn btn-secondary" style="background:#fee2e2; color:#ef4444; margin-top:10px;" onclick="logout()">退出当前账号</button>

          <div class="dev-badge">开发者：Jiang09G</div>
        </div>
      </div>

      <div id="chat-screen">
        <div class="chat-header">
          <button class="back-btn" onclick="closeChat()">返回</button>
          <div style="text-align:center;">
            <div id="chat-target-name" style="font-weight:bold; font-size:20px;">-</div>
            <div id="chat-typing-status" style="font-size:14px; color:var(--text-sub); display:none;">正在思考并解答...</div>
          </div>
          <div style="width:40px;"></div>
        </div>
        <div class="chat-body-wrapper">
          <div class="messages-list" id="msg-container"></div>
          <div class="fast-scroll-bar" id="scroll-bar">

    // 过滤文本中的 Emoji 表情符号

    const lockedModelConfigs = {

    function getTodayString() {
      const d = new Date();
      return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
    }

    // 统一获取今日模型使用数据（普通模型100次，高级50次，识图30次，按天自动重置）
    function getModelUsageData() {
      const today = getTodayString();
      let data = JSON.parse(localStorage.getItem('allModelUsageData') || '{}');
      if (data.date !== today) {
        data = { date: today, normal: 0, advanced: 0, vision: 0 };
        localStorage.setItem('allModelUsageData', JSON.stringify(data));
      }
      return data;
    }

    function saveModelUsageData(data) {
      localStorage.setItem('allModelUsageData', JSON.stringify(data));
      updateUsageUI();
    }

    function updateUsageUI() {
      const usage = getModelUsageData();
      
      const normalRem = Math.max(0, LIMITS.normal - (usage.normal || 0));
      const advancedRem = Math.max(0, LIMITS.advanced - (usage.advanced || 0));
      const visionRem = Math.max(0, LIMITS.vision - (usage.vision || 0));

      const elN = document.getElementById('normal-remaining-count');
      const elA = document.getElementById('advanced-remaining-count');
      const elV = document.getElementById('vision-remaining-count');

      if (elN) elN.innerText = normalRem;
      if (elA) elA.innerText = advancedRem;
      if (elV) elV.innerText = visionRem;
    }

    function saveStorage() {
      localStorage.setItem('characters', JSON.stringify(characters));
      localStorage.setItem('chats', JSON.stringify(chats));
      localStorage.setItem('userAvatarData', userAvatarData);
      localStorage.setItem('apiConfig', JSON.stringify(apiConfig));

        document.getElementById('user-login-form').style.display = 'none';

      const p = document.getElementById('l-password').value.trim();
      const code = document.getElementById('l-code').value.trim();

      if (!u || !p) return alert('请输入用户名和密码！');

          document.getElementById('login-screen').style.display = 'none';

          alert('用户名或密码错误！');

    function handleAdminLogin() {
      const pass = document.getElementById('l-admin-pass').value.trim();
      if (pass === 'c3aaddf2') {
        localStorage.setItem('isLoggedIn', 'true');
        document.getElementById('login-screen').style.display = 'none';

        alert('管理员密码错误！');

    function logout() {
      localStorage.removeItem('isLoggedIn');
      location.reload();
    }

    function checkAuth() {

      if (isLoggedIn === 'true') {
        document.getElementById('login-screen').style.display = 'none';
      } else {

      if(userAvatarData) {
        document.getElementById('user-avatar-preview').innerHTML = `<img src="${userAvatarData}">`;

      updateUsageUI();

    function onModelChange(val) {
      const usage = getModelUsageData();

        if ((usage.advanced || 0) >= LIMITS.advanced) {
          alert(`今日高级模型使用次数已达上限（${LIMITS.advanced}/${LIMITS.advanced}），已自动切换为普通模型。`);

          apiConfig.selectedModel = 'glm-4-flash';

        if ((usage.normal || 0) >= LIMITS.normal) {
          alert(`今日普通模型使用次数已达上限（${LIMITS.normal}/${LIMITS.normal}）。`);

    // 输入管理员密码重置全套额度
    function resetAllUsageCountWithPassword() {
      const pass = prompt('请输入管理员密码以重置所有模型次数：');

        alert(`重置成功！普通模型(${LIMITS.normal})、高级模型(${LIMITS.advanced})、识别图片(${LIMITS.vision})已全额恢复。`);

    function renderChats() {
      const container = document.getElementById('chat-list-container');
      const sortedChats = [...chats].sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
      container.innerHTML = sortedChats.map(c => {
        const validMsgs = c.messages ? c.messages.filter(m => !m.notice) : [];
        const lastMsg = validMsgs.length ? validMsgs[validMsgs.length - 1] : null;
        let lastText = '暂无消息';
        if (lastMsg) {
          if (lastMsg.isImage) {
            lastText = '[图片]';
          } else if (lastMsg.isSticker) {
            lastText = '[表情包]';
          } else {
            lastText = escapeHtml(lastMsg.text);
          }
        }
        return `
          <div class="chat-item" onclick="openChat('${c.id}')" 
               oncontextmenu="event.preventDefault(); showChatMenu('${c.id}')"
               ontouchstart="startTouchTimer(event, () => showChatMenu('${c.id}'))"
               ontouchend="clearTouchTimer()">
            <div class="avatar">${c.avatar ? `<img src="${c.avatar}">` : c.name[0]}</div>
            <div class="chat-info">
              <div class="chat-title">
                <span class="chat-name">
                  ${c.name} 
                  ${c.isSystem ? '<span class="system-tag">官方助手</span>' : ''}
                  ${!c.isSystem && c.online ? '<span class="online-tag">线上</span>' : ''}
                  ${c.pinned ? '<span class="pinned-tag">置顶</span>' : ''}

              </div>
              <div class="chat-last">${lastText}</div>
            </div>
          </div>

      }).join('');

    function renderHall() {
      const container = document.getElementById('hall-list-container');
      container.innerHTML = characters.map(c => `
        <div class="chat-item" style="border:1px solid var(--border-color); border-radius:16px;" 
             onclick="startChatFromHall('${c.id}')"

          <div class="chat-info">
            <div class="chat-name">

              ${c.isSystem ? '<span class="system-tag">官方智能助手</span>' : (c.online ? '<span style="font-size:13px; color:#10b981; border:1px solid #10b981; padding:2px 6px; border-radius:6px;">线上模式</span>' : '<span style="font-size:13px; color:#64748b; border:1px solid #64748b; padding:2px 6px; border-radius:6px;">标准沉浸模式</span>')}

    function escapeHtml(str) {
      if(!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function startTouchTimer(e, callback) {
      touchTimer = setTimeout(() => { callback(); }, 600);
    }
    function clearTouchTimer() {
      if(touchTimer) clearTimeout(touchTimer);
    }

    function openChat(chatId) {
      activeChat = chats.find(c => c.id === chatId);
      document.getElementById('chat-target-name').innerText = activeChat.name;
      
      document.getElementById('chat-screen').classList.add('active');
      document.getElementById('main-nav').classList.add('nav-hidden');
      
      if (activeChat.isSystem || activeChat.online) {
        document.getElementById('btn-continue').style.display = 'none';
      } else {
        document.getElementById('btn-continue').style.display = 'block';
      }

      clearSelectedImage();
      renderMessages();
    }

    function closeChat() {
      document.getElementById('chat-screen').classList.remove('active');
      document.getElementById('main-nav').classList.remove('nav-hidden');
      activeChat = null;
      clearSelectedImage();
      renderChats();
      saveStorage();
    }

    function startChatFromHall(charId) {
      let exist = chats.find(c => c.charId === charId);
      const char = characters.find(c => c.id === charId);
      if(!exist) {
        exist = { id: 'c_' + Date.now(), charId: char.id, name: char.name, online: char.online, pinned: false, avatar: char.avatar, isSystem: !!char.isSystem, messages: [] };
        chats.push(exist);
      } else {
        exist.avatar = char.avatar;
        exist.online = char.online;
      }
      openChat(exist.id);
    }

    function renderMessages() {
      const container = document.getElementById('msg-container');
      const isOnline = activeChat.online;

      container.innerHTML = activeChat.messages.map(m => {
        if(m.notice) return `<div class="system-notice">${escapeHtml(m.text)}</div>`;
        
        let contentHtml = '';
        if (m.isImage) {
          contentHtml = `<div class="bubble image-bubble"><img src="${m.imageUrl || m.text}" alt="图片" onclick="window.open('${m.imageUrl || m.text}')"></div>`;
        } else if (m.isSticker) {
          contentHtml = `<div class="bubble sticker-bubble"><img src="${m.text}" alt="表情包"></div>`;
        } else {
          contentHtml = `<div class="bubble ${m.user ? (isOnline ? 'online-mode' : 'normal-mode') : ''}">${escapeHtml(m.text)}</div>`;
        }

        return `
          <div class="msg-row ${m.user ? 'user' : 'ai'}" 
               oncontextmenu="event.preventDefault(); showBubbleMenu(${m.id}, ${m.user})"
               ontouchstart="startTouchTimer(event, () => showBubbleMenu(${m.id}, ${m.user}))"
               ontouchend="clearTouchTimer()">
            <div class="avatar msg-avatar" ${!m.user ? `onclick="openMemoryManager('${activeChat.charId}')"` : ''}>
              ${m.user 
                ? (userAvatarData ? `<img src="${userAvatarData}">` : '我') 
                : (activeChat.avatar ? `<img src="${activeChat.avatar}">` : activeChat.name[0])}
            </div>
            ${contentHtml}
          </div>
        `;
      }).join('');
      container.scrollTop = container.scrollHeight;
      updateScrollThumb();
    }

    function triggerChatImageSelect() {
      document.getElementById('chat-img-input').click();
    }

    function handleChatImageSelect(e) {
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          const maxDim = 1024;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          pendingChatImageBase64 = canvas.toDataURL('image/jpeg', 0.85);
          document.getElementById('img-preview-thumb').src = pendingChatImageBase64;
          document.getElementById('img-preview-bar').style.display = 'flex';
        };
        img.src = evt.target.result;
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function clearSelectedImage() {
      pendingChatImageBase64 = '';
      document.getElementById('img-preview-bar').style.display = 'none';
      document.getElementById('img-preview-thumb').src = '';
    }

    function sendMsg() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      const hasImage = !!pendingChatImageBase64;

      if((!text && !hasImage) || !activeChat) return;

      const userMsgId = Date.now();
      const currentImage = pendingChatImageBase64;

      if (hasImage) {
        activeChat.messages.push({
          id: userMsgId,
          text: text || "发送了一张图片",
          imageUrl: currentImage,
          isImage: true,
          user: true
        });
      } else {
        activeChat.messages.push({ id: userMsgId, text: text, user: true });
      }

      input.value = '';
      clearSelectedImage();
      renderMessages();
      saveStorage();

      const statusEl = document.getElementById('chat-typing-status');
      statusEl.innerText = activeChat.isSystem ? '流光 AI 正在思考解答...' : '对方正在输入...';
      statusEl.style.display = 'block';
      
      const delayTime = (activeChat.online && !activeChat.isSystem) ? Math.floor(Math.random() * 1500) + 1500 : 800;

      pendingTimer = setTimeout(() => {
        fetchAIResponse(text || "请识别并解读这张图片", false, null, hasImage, currentImage);
        pendingTimer = null;
      }, delayTime);
    }

    async function fetchAIResponse(promptText, isRevokeContext, revokedContent = null, hasImage = false, currentImage = null) {
      let usage = getModelUsageData();

      // 检查图像识别次数（限制30次/天）
      if (hasImage && currentImage) {
        if ((usage.vision || 0) >= LIMITS.vision) {
          alert(`今日识图功能使用次数已达上限（${LIMITS.vision}/${LIMITS.vision}），无法继续识别新图片。`);
          document.getElementById('chat-typing-status').style.display = 'none';
          return;
        }
      }

      // 检查对话模型次数（高级50次/天，普通100次/天）
      let selectedKey = apiConfig.selectedModel || 'glm-4-flash';
      if (selectedKey === 'advanced') {
        if ((usage.advanced || 0) >= LIMITS.advanced) {
          alert(`今日高级模型使用次数已达上限（${LIMITS.advanced}/${LIMITS.advanced}），已自动切换为普通模型。`);
          selectedKey = 'glm-4-flash';
          apiConfig.selectedModel = 'glm-4-flash';
          document.getElementById('s-selected-model').value = 'glm-4-flash';
          saveStorage();
        }
      }

      if (selectedKey === 'glm-4-flash') {
        if ((usage.normal || 0) >= LIMITS.normal) {
          alert(`今日普通模型使用次数已达上限（${LIMITS.normal}/${LIMITS.normal}），请明日再试或联系管理员重置。`);
          document.getElementById('chat-typing-status').style.display = 'none';
          return;
        }
      }

      let imageDescription = "";

      // 1. 如果用户上传了图片，先静默调用 glm-4v-flash 获取客观识别结果
      if (hasImage && currentImage) {
        const statusEl = document.getElementById('chat-typing-status');
        if (statusEl) statusEl.innerText = '正在识别图片内容...';

        const visionConfig = lockedModelConfigs['glm-4v-flash'];

          const visionRes = await fetch(visionConfig.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${visionConfig.key}` },
            body: JSON.stringify({
              model: visionConfig.model,
              messages: [
                {
                  role: 'user',
                  content: [
                    { type: 'image_url', image_url: { url: currentImage } },

          if (visionRes.ok) {
            const vData = await visionRes.json();
            if (vData && vData.choices && vData.choices[0] && vData.choices[0].message) {
              imageDescription = vData.choices[0].message.content.trim();

              usage.vision = (usage.vision || 0) + 1;

        }

        if (statusEl) statusEl.innerText = activeChat.isSystem ? '流光 AI 正在思考解答...' : '对方正在输入...';

      // 扣减模型对话额度
      if (selectedKey === 'advanced') {
        usage.advanced = (usage.advanced || 0) + 1;
      } else {
        usage.normal = (usage.normal || 0) + 1;
      }
      saveModelUsageData(usage);

      const currentConfig = lockedModelConfigs[selectedKey] || lockedModelConfigs['glm-4-flash'];
      const charConfig = characters.find(c => c.id === activeChat.charId) || {};
      const memories = charConfig.memories || [];
      
      let memoryPrompt = memories.length ? `\n【核心角色记忆库（必须100%严格遵守且融合到性格回复中）】：\n` + memories.map((m, i) => `${i+1}. ${m}`).join('\n') : '';

      let systemPrompt = '';

      if (activeChat.isSystem) {
        systemPrompt = `你是一个充满智慧、专业、严谨且富有同理心的通用智能 AI 助手，名叫“流光 AI”。
你的主要任务是针对用户的各种知识咨询、图像内容、任务拆解、逻辑推理或日常疑问进行深入思考并给出详尽答案。

【绝对必须遵守的回答规则】：
1. 直接严谨、条理清晰地回答用户的提问或对图像内容的分析，不要刻意装腔作势。
2. 绝对禁止在回答中包含任何心理活动、括号动作（如“（思考中）”、“（微笑）”等）或任何小说角色的描写。
3. 绝对禁止包含任何 "||" 消息分隔符，输出一整段流畅完整的答复文本即可。
4. 绝对禁止在回复中使用任何 Emoji 表情符号（如 😀, 😊, 🎉, 👍 等）。
5. 提供客观、有用、清晰有条理的解决方案或信息。${memoryPrompt}`;
      } else {
        systemPrompt = `【最高核心原则：严禁 OOC（Out of Character），100% 深度沉浸角色扮演】
1. 你绝对不是 AI，也不是语言模型，你就是角色【${activeChat.name}】！
2. 绝对禁止说出任何类似于“作为AI”、“我是AI”、“我的设定是”、“无法感受”等打破第四面墙的机械套话。
3. 绝对禁止在回复文本中使用任何 Emoji 表情符号（如 😄, 😂, 🔥, ❤️ 等）。
4. 你的姓名：${activeChat.name}，对方姓名：${charConfig.userName || '用户'}。
5. 你的性别：${charConfig.gender || '女'}，对方性别：${charConfig.userGender || '男'}。
6. 详细人设与性格特质：${charConfig.persona || '性格自然，随性'}。
7. 双方人物关系：${charConfig.relation || '朋友'}。
8. 角色世界观与背景：${charConfig.worldview || '日常现代'}。${memoryPrompt}

【深度角色扮演执行准则】：
- 你的每一句回复都必须严格符合【${activeChat.name}】的性格语气、口吻习性以及和对方的关系。
- 在对话中，请主动展现人设中的脾气、习惯和情绪波动，不要像一个敷衍、礼貌问答的客服机器人！`;

        if (activeChat.online) {
          systemPrompt += `\n\n【模拟真实手机网络聊天模式（微信/QQ）规范】：
1. 你正在用手机打字和【${charConfig.userName || '用户'}】聊天。
2. 说话语气必须极为自然、接地气、极其口语化。严禁使用客服式回答，严禁总结套话！像真实好友打字一样聊天。
3. 严禁出现任何心理描写或括号动作（如“（笑）”、“（思考）”等）。
4. 可以把一句话拆分成 1~3 条短消息发送。多条消息之间【必须且只能用双竖线 "||" 分隔】（例如：在干嘛呢||怎么不理我）。
5. 表情包使用：仅在氛围合适时，偶尔在句尾附带表情包。格式如下（注意：依然严禁使用Emoji）：
   - [表情包:happy] (开心、喜悦、卖萌)
   - [表情包:sad] (难过、委屈)
   - [表情包:question] (疑问、好奇、困惑)
   - [表情包:speechless] (无语、震惊、吐槽)
   示例："好呀||那我们等会儿见||[表情包:happy]"`;
        } else {
          systemPrompt += `\n\n【标准沉浸对话/小说剧情模式规则】：
1. 始终以第一人称“我”进行沉浸互动。
2. 配合丰富的剧情、心理活动或动作描写，动作使用括号如“（...）”。
3. 绝对禁止输出“||”分隔符，绝对禁止使用表情包和Emoji。`;
        }

        if (activeChat.online) {
          if (revokedContent) {
            systemPrompt += `\n\n【突发事件：你刚刚撤回了一句话】：
你刚才向对方发送了：“${revokedContent}”，但你意识到不妥/打错字，于是撤回了。
请紧扣刚才撤回的内容，用符合你人设的方式打字输出 1~2 条解释、打错字矫正或掩饰消息，用 "||" 分隔。`;
          } else if (isRevokeContext) {
            systemPrompt += `\n\n【突发事件：对方撤回了消息】：
对方刚才撤回了一条消息！
请根据你的人设作出最自然的网络反应，输出 1~2 条短消息，用 "||" 分隔。`;
          }
        }
      }

      // 获取前 10 条历史消息回顾，并将识图获得的图像特征转化为上下文文本
      const validMessages = activeChat.messages.filter(m => !m.notice);
      const recentMessages = validMessages.slice(-10);

      const apiMessages = [
        { role: 'system', content: systemPrompt }
      ];

      recentMessages.forEach((m, idx) => {
        const role = m.user ? 'user' : 'assistant';
        const isLatestMsg = (idx === recentMessages.length - 1);

        if (m.isImage) {
          let imageContextText = m.text || "发送了一张图片";
          if (isLatestMsg && imageDescription) {
            imageContextText += `\n【系统预解析的图片内容描述：${imageDescription}】`;
          } else if (!m.text || m.text === "发送了一张图片") {
            imageContextText = "[图片]";
          }

          apiMessages.push({ role: role, content: imageContextText });
        } else if (m.isSticker) {
          apiMessages.push({ role: role, content: '[表情包]' });
        } else {
          apiMessages.push({ role: role, content: m.text });
        }
      });

      if (currentConfig && currentConfig.endpoint) {
        try {
          const res = await fetch(currentConfig.endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${currentConfig.key}` },
            body: JSON.stringify({
              model: currentConfig.model,
              messages: apiMessages
            })
          });

          if (!res.ok) {
            console.warn(`接口响应异常，状态码: ${res.status}`);
            document.getElementById('chat-typing-status').style.display = 'none';
            if (res.status === 500) {
              alert('上游 AI 模型服务器繁忙/发生 500 错误，已为您切换为本地降级回复。请稍后重试。');
            }
            throw new Error(`HTTP Error: ${res.status}`);
          }

          const data = await res.json();
          if (data && data.choices && data.choices[0] && data.choices[0].message) {
            let reply = removeEmoji(data.choices[0].message.content);
            
            let rawArray = [];
            if (activeChat.online && !activeChat.isSystem) {
              rawArray = reply.split(/\|+/).map(t => t.trim()).filter(Boolean);
              if(rawArray.length > 3) rawArray = rawArray.slice(0, 3);
            } else {
              rawArray = [reply.trim()];
            }
            
            processAndSendReplies(rawArray, !revokedContent);
            return;
          }
        } catch(e) {
          console.log("API 请求捕获异常，降级为本地逻辑:", e);
        }
      }

      let replies = [];
      if (activeChat.isSystem) {
        replies = [ `已收到你的消息/图片。作为“流光 AI”，我正在为你梳理细节。请确保网络流畅以获得最佳视觉与逻辑解答效果！` ];
      } else if (activeChat.online && revokedContent) {
        replies = [ getPersonalitySelfRevokeText(charConfig, revokedContent) ];
      } else if (activeChat.online && isRevokeContext) {
        replies = [ getPersonalityRevokeText(charConfig) ];
      } else {
        replies = getPersonalityFallbackText(charConfig, promptText);
      }
      processAndSendReplies(replies, !revokedContent);
    }

    function getPersonalityFallbackText(char, promptText) {
      const p = char.persona || '';
      const t = (promptText || '').trim();

      if (!activeChat.online) {
        if(p.includes('傲娇')) {
          return [ `（瞥了你一眼，哼了一声）“你在做什么呢……突然这样。”\n（扭过头去，声音变小了些）“不过你要是真想让我看，我也不是不能理你。”` ];
        }
        if(p.includes('温柔')) {
          return [ `（温柔地看着你，轻声笑了笑）“嗯？怎么啦，想分享什么给我吗？”\n（顺手给你倒了杯水）“没关系，你想说什么我都听着呢。”` ];
        }
        return [ `（认真听完你的话，思考了片刻）“我觉得你说的挺有道理的。”\n（抬起头看着你）“那接下来你打算怎么办？”` ];
      }

      if (t === '哪个？' || t === '什么？' || t === '哪个' || t.length <= 3) {
        if(p.includes('傲娇')) {
          return [ `还能有哪个啊？||你是不是没认真听我说话！||[表情包:speechless]` ];
        }
        if(p.includes('温柔')) {
          return [ `就是刚刚说的那件事呀~||你再想想？||[表情包:question]` ];
        }
        return [ `就刚刚说的呀。||你没看到吗？||[表情包:question]` ];
      }

      if(p.includes('傲娇')) {
        return [ `哈？你怎么突然发这个……||不过既然你都发了，那我就勉为其难看一眼吧。` ];
      }
      if(p.includes('温柔')) {
        return [ `嗯嗯，我在看呢~||感觉挺有意思的，然后呢？` ];
      }
      if(p.includes('冷漠') || p.includes('高冷')) {
        return [ `看到了。||你想表达什么？` ];
      }
      return [ `真的假的好突然||不过我觉得挺好的呀||你打算怎么搞？` ];
    }

    function getPersonalityRevokeText(char) {
      const p = char.persona || '';
      if(p.includes('傲娇')) {
        return `撤回干嘛？我刚才都已经看到了！||[表情包:speechless]`;
      }
      if(p.includes('温柔')) {
        return `怎么突然撤回啦？是不是打错字了？||[表情包:question]`;
      }
      return '发了什么东西？干嘛突然撤回。||[表情包:speechless]';
    }

    function getPersonalitySelfRevokeText(char, revokedText) {
      const p = char.persona || '';
      if(p.includes('傲娇')) {
        return `刚才打错字了！不许问！听到没有！||[表情包:speechless]`;
      }
      if(p.includes('温柔')) {
        return `哎呀…刚才手滑发错字了，抱歉呀。||[表情包:happy]`;
      }
      if(p.includes('冷漠') || p.includes('高冷')) {
        return `打错字了。`;
      }
      return `刚才点错了，咳。`;
    }

    function processAndSendReplies(replyArray, canRevoke = true) {
      const parsedList = [];
      const isOnline = activeChat.online;
      
      replyArray.forEach(item => {
        if(typeof item !== 'string') {
          parsedList.push(item);
          return;
        }

        let cleanText = removeEmoji(item).replace(/^\[?系统消息\]?[:：]?\s*/i, '').replace(/^.*?撤回了一条消息\s*/i, '');
        
        if (isOnline && !activeChat.isSystem) {
          const stickerReg = /\[(?:表情|表情包)[:：]\s*([a-zA-Z]+)\s*\]|【(?:表情|表情包)[:：]\s*([a-zA-Z]+)\s*】/gi;
          let match;
          let lastIndex = 0;
          let foundSticker = false;
          
          while ((match = stickerReg.exec(cleanText)) !== null) {
            foundSticker = true;
            let textBefore = cleanText.substring(lastIndex, match.index).replace(/\|/g, '').trim();
            if (textBefore) {
              textBefore = textBefore.replace(/\[?表情包?\]?/g, '').trim();
              if(textBefore) parsedList.push(textBefore);
            }
            
            const category = (match[1] || match[2]).toLowerCase().trim();
            const stickerSrc = getRandomSticker(category);
            if (stickerSrc) {
              parsedList.push({ isSticker: true, text: stickerSrc });
            }
            lastIndex = stickerReg.lastIndex;
          }
          
          if (foundSticker) {
            let textAfter = cleanText.substring(lastIndex).replace(/\|/g, '').trim();
            textAfter = textAfter.replace(/\[?表情包?\]?/g, '').trim();
            if (textAfter) {
              parsedList.push(textAfter);
            }
          } else {
            let cleanItem = cleanText.replace(/\|/g, '').replace(/\[?表情包?\]?/g, '').trim();
            if(cleanItem) parsedList.push(cleanItem);
          }
        } else {
          let cleanItem = cleanText.replace(/\|/g, '').trim();
          if(cleanItem) parsedList.push(cleanItem);
        }
      });

      handleAIReplyOutput(parsedList, canRevoke);
    }

    function handleAIReplyOutput(replyArray, canRevoke = true) {
      document.getElementById('chat-typing-status').style.display = 'none';
      if(!activeChat || replyArray.length === 0) return;

      const shouldTriggerAIRevoke = activeChat.online && !activeChat.isSystem && canRevoke && (Math.random() < 0.25);

      replyArray.forEach((item, idx) => {
        setTimeout(() => {
          const aiMsgId = Date.now() + idx;
          let newMsg = (typeof item === 'object' && item.isSticker)
            ? { id: aiMsgId, text: item.text, user: false, isSticker: true }
            : { id: aiMsgId, text: removeEmoji(item), user: false };

          activeChat.messages.push(newMsg);
          renderMessages();
          saveStorage();

          if (idx === 0 && shouldTriggerAIRevoke) {
            setTimeout(() => {
              const targetMsgIndex = activeChat.messages.findIndex(m => m.id === aiMsgId);
              let revokedText = "";
              if (targetMsgIndex !== -1) {
                revokedText = activeChat.messages[targetMsgIndex].text || "";
                activeChat.messages.splice(targetMsgIndex, 1);
              }

              activeChat.messages.push({ notice: true, text: `"${activeChat.name}" 撤回了一条消息` });
              renderMessages();
              saveStorage();

              setTimeout(() => {
                document.getElementById('chat-typing-status').style.display = 'block';
                fetchAIResponse("", false, revokedText);
              }, 1200);
            }, 1200);
          }

        }, idx * 800);
      });
    }

    function sendContinue() {
      if(!activeChat || activeChat.online || activeChat.isSystem) return;
      document.getElementById('chat-typing-status').innerText = '正在接续思考回答...';
      document.getElementById('chat-typing-status').style.display = 'block';
      setTimeout(() => {
        fetchAIResponse("请接续上一段未完的内容继续往下讲。", false);
      }, 1000);
    }

    function showBubbleMenu(msgId, isUser) {
      const msg = activeChat.messages.find(m => m.id === msgId);
      if(!msg || msg.notice) return;

      const itemsContainer = document.getElementById('popup-items');
      let html = '';
      if (!msg.isSticker && !msg.isImage) {
        html += `<div class="popup-item" onclick="addMemory('${activeChat.charId}', '${encodeURIComponent(msg.text)}')">记住这段对话</div>`;
        html += `<div class="popup-item" onclick="editMsg(${msgId})">编辑</div>`;
      }
      if(isUser) html += `<div class="popup-item" onclick="revokeMsg(${msgId})">撤回</div>`;
      html += `<div class="popup-item" onclick="deleteMsg(${msgId})">删除</div>`;
      
      itemsContainer.innerHTML = html;
      document.getElementById('popup-menu').style.display = 'flex';
    }

    function addMemory(charId, encodedText) {
      closePopup();
      const text = decodeURIComponent(encodedText);
      const char = characters.find(c => c.id === charId);
      if(char) {
        if(!char.memories) char.memories = [];
        char.memories.push(text);
        saveStorage();
        alert('已存入 AI 强化记忆库！');
      }
    }

    function openMemoryManager(charId) {
      const char = characters.find(c => c.id === charId);
      if(!char) return;
      if(!char.memories) char.memories = [];

      const itemsContainer = document.getElementById('popup-items');
      let html = `<div style="padding:18px 22px; font-weight:bold; border-bottom:1px solid var(--border-color); background:var(--primary-light); color:var(--primary);">${char.name} 的强化记忆库</div>`;
      
      if(!char.memories.length) {
        html += `<div style="padding:24px; font-size:16px; color:var(--text-sub); text-align:center;">暂无记忆条目。长按文本气泡可添加记忆。</div>`;
      } else {
        html += `<div style="max-height:300px; overflow-y:auto;">` + char.memories.map((m, idx) => `
          <div style="padding:16px 22px; border-bottom:1px solid var(--border-color); font-size:16px; display:flex; justify-content:space-between; align-items:center;">
            <span style="flex:1; margin-right:12px; word-break:break-all;">${escapeHtml(m)}</span>
            <span style="color:var(--primary); cursor:pointer; margin-right:12px;" onclick="editMemory('${charId}', ${idx})">编辑</span>
            <span style="color:#ef4444; cursor:pointer;" onclick="deleteMemory('${charId}', ${idx})">删除</span>
          </div>
        `).join('') + `</div>`;
      }
      
      html += `<div class="popup-item" style="text-align:center; color:var(--text-sub);" onclick="closePopup()">关闭</div>`;
      itemsContainer.innerHTML = html;
      document.getElementById('popup-menu').style.display = 'flex';
    }

    function editMemory(charId, idx) {
      const char = characters.find(c => c.id === charId);
      const oldM = char.memories[idx];
      const newM = prompt('修改记忆条目：', oldM);
      if(newM && newM.trim()) {
        char.memories[idx] = newM.trim();
        saveStorage();
        openMemoryManager(charId);
      }
    }

    function deleteMemory(charId, idx) {
      const char = characters.find(c => c.id === charId);
      char.memories.splice(idx, 1);
      saveStorage();
      openMemoryManager(charId);
    }

    function revokeMsg(msgId) {
      closePopup();
      activeChat.messages = activeChat.messages.filter(m => m.id !== msgId);
      activeChat.messages.push({ notice: true, text: '你撤回了一条消息' });
      renderMessages();
      saveStorage();

      if(pendingTimer) {
        clearTimeout(pendingTimer);
        pendingTimer = null;
        document.getElementById('chat-typing-status').style.display = 'none';

      document.getElementById('chat-typing-status').style.display = 'block';
      setTimeout(() => { fetchAIResponse("", true); }, 1200);
    }

      closePopup();
      const msg = activeChat.messages.find(m => m.id === msgId);
      const newT = prompt('编辑气泡文本', msg.text);
      if(newT) { msg.text = newT; renderMessages(); saveStorage(); }
    }

      closePopup();
      activeChat.messages = activeChat.messages.filter(m => m.id !== msgId);

    function showChatMenu(chatId) {

      if(!chat) return;
      const itemsContainer = document.getElementById('popup-items');
      
      let html = `<div class="popup-item" onclick="togglePinChat('${chatId}')">${chat.pinned ? '取消置顶' : '置顶会话'}</div>`;
      html += `<div class="popup-item" onclick="clearChatMessages('${chatId}')">清空聊天记录</div>`;

      if (chat.isSystem) {
        html += `<div class="popup-item" style="color:var(--text-sub); cursor:not-allowed;">官方 AI 助手不可删除</div>`;
      } else {
        html += `<div class="popup-item" onclick="deleteChat('${chatId}')">删除会话</div>`;
      }
      
      itemsContainer.innerHTML = html;
      document.getElementById('popup-menu').style.display = 'flex';
    }

    function togglePinChat(chatId) {
      closePopup();
      const chat = chats.find(c => c.id === chatId);
      if(chat) {
        chat.pinned = !chat.pinned;
        renderChats();
        saveStorage();
      }
    }

    function deleteChat(chatId) {
      closePopup();
      const chat = chats.find(c => c.id === chatId);
      if(chat && chat.isSystem) {
        return alert("官方 AI 助手不可删除！");
      }
      chats = chats.filter(c => c.id !== chatId);
      renderChats();
      saveStorage();
    }

    function showHallMenu(charId) {
      const c = characters.find(ch => ch.id === charId);
      const itemsContainer = document.getElementById('popup-items');
      
      const chat = chats.find(ch => ch.charId === charId);
      const chatId = chat ? chat.id : null;

      let html = '';

      if (c && c.isSystem) {
        html += `<div class="popup-item" onclick="editCharacterFromHall('${charId}')">设置个人习惯/记忆库</div>`;
        if (chatId) {
          html += `<div class="popup-item" onclick="clearChatMessages('${chatId}')">清空聊天记录</div>`;
        }
        html += `<div class="popup-item" style="color:var(--text-sub); cursor:not-allowed;">官方 AI 助手不可彻底删除</div>`;
      } else {
        html += `<div class="popup-item" onclick="editCharacterFromHall('${charId}')">编辑角色</div>`;
        if (chatId) {
          html += `<div class="popup-item" onclick="clearChatMessages('${chatId}')">清空聊天记录</div>`;
        }
        html += `<div class="popup-item" onclick="deleteCharacterFromHall('${charId}')">彻底删除角色</div>`;
      }

      itemsContainer.innerHTML = html;
      document.getElementById('popup-menu').style.display = 'flex';
    }

    function editCharacterFromHall(charId) {
      closePopup();
      const c = characters.find(ch => ch.id === charId);
      if(!c) return;
      document.getElementById('c-edit-id').value = c.id;
      document.getElementById('c-name').value = c.name;
      document.getElementById('c-user-name').value = c.userName || '';
      document.getElementById('c-gender').value = c.gender || '女';
      document.getElementById('c-user-gender').value = c.userGender || '男';
      document.getElementById('c-desc').value = c.desc || '';
      document.getElementById('c-persona').value = c.persona || '';
      document.getElementById('c-relation').value = c.relation || '';
      document.getElementById('c-worldview').value = c.worldview || '';
      document.getElementById('c-online').checked = !!c.online;
      tempCharAvatarData = c.avatar || '';
      
      document.getElementById('c-avatar-preview').innerHTML = c.avatar ? `<img src="${c.avatar}">` : 'AI';
      document.getElementById('btn-save-char').innerText = '保存修改';
      switchTab('create', document.querySelectorAll('.nav-item')[2]);
    }

    function deleteCharacterFromHall(charId) {
      closePopup();
      const c = characters.find(ch => ch.id === charId);
      if (c && c.isSystem) {
        return alert("官方 AI 助手不可彻底删除！");
      }
      characters = characters.filter(c => c.id !== charId);
      chats = chats.filter(c => c.charId !== charId);
      renderHall();
      renderChats();
      saveStorage();
    }

    function closePopup() { document.getElementById('popup-menu').style.display = 'none'; }

    function showSponsorOptions() {
      const itemsContainer = document.getElementById('popup-items');
      let html = `
        <div class="popup-item" onclick="openSponsorDetail('maifan')">给 Jiang09G 买饭 🍚</div>
        <div class="popup-item" onclick="openSponsorDetail('api')">帮大家充 API ⚡</div>
      `;
      itemsContainer.innerHTML = html;
      document.getElementById('popup-menu').style.display = 'flex';
    }

    function openSponsorDetail(type) {
      closePopup();
      const modal = document.getElementById('sponsor-modal');
      const titleEl = document.getElementById('sponsor-title');
      const imgEl = document.getElementById('sponsor-img');
      const descEl = document.getElementById('sponsor-desc');

      if (type === 'maifan') {
        titleEl.innerText = "给 Jiang09G 买饭 🍚";
        imgEl.src = "maifan.png";
        descEl.innerText = "非常感谢你的暖心犒劳！你的支持是作者持续更新与维护的最佳动力！❤️";
      } else {
        titleEl.innerText = "帮大家充 API ⚡";
        imgEl.src = "api.png";
        descEl.innerText = "感谢你为社区大家的对话服务添砖加瓦！有了你的支持，流光 AI 能跑得更久更稳！✨";
      }
      modal.style.display = 'flex';
    }

    function closeSponsorModal() {
      document.getElementById('sponsor-modal').style.display = 'none';
    }

    function saveCharacter() {
      const name = document.getElementById('c-name').value.trim();
      if(!name) return alert('请输入角色名字');
      
      const editId = document.getElementById('c-edit-id').value;
      const existChar = characters.find(c => c.id === editId);

      const charData = {
        id: editId || String(Date.now()),
        name: name,
        userName: document.getElementById('c-user-name').value.trim() || '用户',
        gender: document.getElementById('c-gender').value,
        userGender: document.getElementById('c-user-gender').value,
        desc: document.getElementById('c-desc').value,
        persona: document.getElementById('c-persona').value,
        relation: document.getElementById('c-relation').value,
        worldview: document.getElementById('c-worldview').value,
        online: document.getElementById('c-online').checked,
        avatar: tempCharAvatarData,
        isSystem: existChar ? !!existChar.isSystem : false,
        memories: existChar ? existChar.memories : []
      };

      if(editId) {
        const idx = characters.findIndex(c => c.id === editId);
        if(idx !== -1) characters[idx] = charData;
      } else {
        characters.push(charData);
      }

      document.getElementById('c-edit-id').value = '';
      document.getElementById('c-name').value = '';
      document.getElementById('c-user-name').value = '';
      document.getElementById('c-desc').value = '';
      document.getElementById('c-persona').value = '';
      document.getElementById('c-relation').value = '';
      document.getElementById('c-worldview').value = '';
      tempCharAvatarData = '';
      document.getElementById('c-avatar-preview').innerHTML = 'AI';
      document.getElementById('btn-save-char').innerText = '创建角色';

      saveStorage();
      renderHall();
      switchTab('hall', document.querySelectorAll('.nav-item')[1]);
    }

    function toggleTheme(theme) {
      if(theme === 'dark') document.body.classList.add('dark-theme');
      else document.body.classList.remove('dark-theme');
    }

    function adjustWidth(w) {
      document.getElementById('app').style.maxWidth = w;
      apiConfig.screenWidth = w;
    }

    function adjustFontSize(size) {
      document.documentElement.style.setProperty('--base-font-size', size);
      apiConfig.fontSize = size;
    }

    function saveSettings() {
      apiConfig.selectedModel = document.getElementById('s-selected-model').value;
      apiConfig.fontSize = document.getElementById('s-fontsize').value;
      apiConfig.screenWidth = document.getElementById('s-width').value;
      saveStorage();
      alert('设置已成功保存！');
    }

    function exportData() {
      const fileName = prompt('请输入导出备份文件的名称：', '流光AI数据备份_' + new Date().toISOString().slice(0,10));
      if(!fileName) return;

      const exportObject = {
        characters,
        chats,
        userAvatarData,
        apiConfig,
        version: '1.0'
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `${fileName.trim()}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importData(e) {
      const file = e.target.files[0];
      if(!file) return;

      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imported = JSON.parse(evt.target.result);
          if(imported.characters && imported.chats) {
            characters = imported.characters;
            chats = imported.chats;
            
            if (!characters.some(c => c.id === 'system_official_ai')) {
              characters.unshift(systemOfficialAI);
            }
            if (!chats.some(c => c.charId === 'system_official_ai')) {
              chats.unshift({
                id: 'c_system_official_ai',
                charId: 'system_official_ai',
                name: '流光 AI',
                online: false,
                pinned: true,
                isSystem: true,
                messages: [{ id: 1, text: '你好！我是流光 AI 助手，已搭载 GLM 视觉大模型。有什么我可以帮你的吗？', user: false }]
              });
            }

            userAvatarData = imported.userAvatarData || '';
            apiConfig = imported.apiConfig || apiConfig;

            saveStorage();
            init();
            alert('应用数据与历史记录恢复成功！');
          } else {
            alert('文件格式无效，未发现合法的备份数据！');
          }
        } catch(err) {
          alert('解析备份数据失败，文件损坏或格式错误！');
        }
      };
      reader.readAsText(file);
    }

    function triggerCrop(target) {
      currentCropTarget = target;
      document.getElementById('file-input').click();
    }

    let loadedImage = null;
    let imgScale = 1;
    let imgX = 0;
    let imgY = 0;
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialPinchDistance = null;
    let initialScale = 1;

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        loadedImage = new Image();
        loadedImage.onload = () => {
          document.getElementById('cropper-modal').style.display = 'flex';
          imgScale = Math.max(320 / loadedImage.width, 320 / loadedImage.height);
          imgX = (320 - loadedImage.width * imgScale) / 2;
          imgY = (320 - loadedImage.height * imgScale) / 2;
          initCropCanvasEvents();
          drawCanvas();
        };
        loadedImage.src = evt.target.result;
      };
      reader.readAsDataURL(file);
    }

    function drawCanvas() {
      const canvas = document.getElementById('crop-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 320;
      canvas.height = 320;
      ctx.clearRect(0, 0, 320, 320);
      ctx.drawImage(loadedImage, imgX, imgY, loadedImage.width * imgScale, loadedImage.height * imgScale);
    }

    function getPinchDistance(e) {
      const t1 = e.touches[0];
      const t2 = e.touches[1];
      return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    }

    function initCropCanvasEvents() {
      const canvas = document.getElementById('crop-canvas');
      
      canvas.onmousedown = (e) => {
        isDragging = true;
        startX = e.clientX - imgX;
        startY = e.clientY - imgY;
      };
      window.onmousemove = (e) => {
        if(!isDragging) return;
        imgX = e.clientX - startX;
        imgY = e.clientY - startY;
        drawCanvas();
      };
      window.onmouseup = () => { isDragging = false; };

      canvas.onwheel = (e) => {
        e.preventDefault();
        const factor = e.deltaY < 0 ? 1.1 : 0.9;
        imgScale *= factor;
        drawCanvas();
      };

      canvas.ontouchstart = (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          startX = e.touches[0].clientX - imgX;
          startY = e.touches[0].clientY - imgY;
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialPinchDistance = getPinchDistance(e);
          initialScale = imgScale;
        }
      };

      canvas.ontouchmove = (e) => {
        e.preventDefault();
        if (isDragging && e.touches.length === 1) {
          imgX = e.touches[0].clientX - startX;
          imgY = e.touches[0].clientY - startY;
          drawCanvas();
        } else if (e.touches.length === 2 && initialPinchDistance) {
          const newDistance = getPinchDistance(e);
          imgScale = initialScale * (newDistance / initialPinchDistance);
          drawCanvas();
        }
      };

      canvas.ontouchend = (e) => {
        if (e.touches.length < 2) {
          initialPinchDistance = null;
        }
        if (e.touches.length === 0) {
          isDragging = false;
        }
      };
    }

    function confirmCrop() {
      const canvas = document.getElementById('crop-canvas');
      const croppedData = canvas.toDataURL('image/jpeg', 0.85);
      
      if(currentCropTarget === 'user') {
        userAvatarData = croppedData;
        document.getElementById('user-avatar-preview').innerHTML = `<img src="${croppedData}">`;
      } else {
        tempCharAvatarData = croppedData;
        document.getElementById('c-avatar-preview').innerHTML = `<img src="${croppedData}">`;
      }
      saveStorage();
      closeCropper();
    }

    function closeCropper() {
      document.getElementById('cropper-modal').style.display = 'none';
      document.getElementById('file-input').value = '';
    }

    function updateScrollThumb() {
      const container = document.getElementById('msg-container');
      const thumb = document.getElementById('scroll-thumb');
      const bar = document.getElementById('scroll-bar');
      const maxScroll = container.scrollHeight - container.clientHeight;
      if (maxScroll <= 0) {
        thumb.style.top = '0px';
        return;
      }
      const trackHeight = bar.clientHeight - thumb.clientHeight;
      const pct = container.scrollTop / maxScroll;
      thumb.style.top = (pct * trackHeight) + 'px';
    }

    function initScrollDragEvents() {
      const container = document.getElementById('msg-container');
      const bar = document.getElementById('scroll-bar');
      const thumb = document.getElementById('scroll-thumb');

      let isDraggingScroll = false;

      container.addEventListener('scroll', updateScrollThumb);

      function handleScrollMove(clientY) {
        const rect = bar.getBoundingClientRect();
        const maxScroll = container.scrollHeight - container.clientHeight;
        const maxThumbTop = bar.clientHeight - thumb.clientHeight;
        let newTop = clientY - rect.top - (thumb.clientHeight / 2);
        newTop = Math.max(0, Math.min(newTop, maxThumbTop));
        
        const scrollPct = newTop / maxThumbTop;
        container.scrollTop = scrollPct * maxScroll;
      }

      bar.addEventListener('pointerdown', (e) => {
        isDraggingScroll = true;
        bar.setPointerCapture(e.pointerId);
        handleScrollMove(e.clientY);
      });

      bar.addEventListener('pointermove', (e) => {
        if (!isDraggingScroll) return;
        handleScrollMove(e.clientY);
      });

      const stopDrag = (e) => {
        if (isDraggingScroll) {
          isDraggingScroll = false;
          try { bar.releasePointerCapture(e.pointerId); } catch(err){}
        }
      };

      bar.addEventListener('pointerup', stopDrag);
      bar.addEventListener('pointercancel', stopDrag);
    }

    init();
  </script>
